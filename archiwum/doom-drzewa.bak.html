<script>
"use strict";
/* ============================================================
   DRZEWODOOM — raycasterowy klon Dooma, w którym gonią Cię drzewa
   Jeden plik, zero zależności.
   ============================================================ */

const W = 480, H = 270;
const cv  = document.getElementById('cv');
const ctx = cv.getContext('2d', { alpha:false });
ctx.imageSmoothingEnabled = false;
const img  = ctx.createImageData(W, H);
const buf8 = new Uint8ClampedArray(img.data.buffer);
const buf  = new Uint32Array(img.data.buffer);
const zbuf = new Float32Array(W);

const mini = document.getElementById('mini');
const mctx = mini.getContext('2d');

// Mgła i jej zasięg zmieniają się wraz z biomem, a kolor mgły jest wpalany
// w poziomy przyciemnienia tekstur — dlatego przy zmianie poziomu przebudowujemy
// cały zestaw grafik (patrz rebuildArt()).
let MAXFOG = 13.5;                   // dystans całkowitego zaniku we mgle
let FOG = [10, 15, 22];              // kolor mgły

/* ---------- narzędzia ---------- */
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0;
  let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t;
  return ((t^t>>>14)>>>0)/4294967296; }; }
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp =(a,b,t)=>a+(b-a)*t;

/* ============================================================
   MAPA
   ============================================================ */
const RAW = [
 "################################",
 "#..............................#",
 "#..BBB......MMM.........BB.....#",
 "#..B..........M.........BB.....#",
 "#..B.......B..M................#",
 "#..........B..........MMMM.....#",
 "#....MM....B..........M..M.....#",
 "#....MM...............M..M.....#",
 "#..............BBB.............#",
 "#....B...........B......BB.....#",
 "#....B...........B......BB.....#",
 "#....B.........................#",
 "#..........MMMM.....B..........#",
 "#..........M..M.....B..........#",
 "#..BB......M..M.....B......M...#",
 "#..BB......................M...#",
 "#..........................M...#",
 "#.....MMM......BB..............#",
 "#.......M......BB.......BBB....#",
 "#.......M.................B....#",
 "#.........B...............B....#",
 "#....B....B....MM..............#",
 "#....B.........MM.....B..B.....#",
 "#....B................B..B.....#",
 "#.............BB...............#",
 "#....MMMM.....BB......MM.......#",
 "#.......M.............MM.......#",
 "#.......M......................#",
 "#..BB.......B........BBB.......#",
 "#..BB.......B..................#",
 "#..............................#",
 "################################",
];
let map = [], MW = 0, MH = 0;
const cell = (x,y)=> (x<0||y<0||x>=MW||y>=MH) ? 1 : map[y|0][x|0];

function applyMap(g){ map = g.m; MW = g.w; MH = g.h; }

// Poziom 1 to ręcznie ułożona mapa z RAW — znajomy start przed proceduralnymi.
function mapFromRAW(){
  const h = RAW.length, w = Math.max(...RAW.map(r=>r.length));
  const m = [];
  for(let y=0;y<h;y++){
    const row = new Uint8Array(w);
    for(let x=0;x<w;x++){
      const c = RAW[y][x] || '.';
      let v = 0;
      if(c==='#') v=1; else if(c==='B') v=2; else if(c==='M') v=3;
      if(x===0||y===0||x===w-1||y===h-1) v=1;   // zawsze domknięta granica
      row[x]=v;
    }
    m.push(row);
  }
  return { m, w, h };
}

/* ---------- generator map ---------- */
// Rozrzuca kępy w duchu ręcznej mapy: bloki, żywopłoty, puste w środku
// kwadraty i pojedyncze drzewa. Gęstość rośnie z poziomem.
function genMap(seed, level){
  const rnd = mulberry32(seed);
  const w = 32 + (rnd()*7|0), h = 32 + (rnd()*7|0);
  const m = [];
  for(let y=0;y<h;y++) m.push(new Uint8Array(w));
  for(let x=0;x<w;x++){ m[0][x]=1; m[h-1][x]=1; }
  for(let y=0;y<h;y++){ m[y][0]=1; m[y][w-1]=1; }
  const set=(x,y,v)=>{ if(x>0&&y>0&&x<w-1&&y<h-1) m[y][x]=v; };

  const density = Math.min(0.115, 0.060 + (level-1)*0.006);
  const clumps  = Math.round(w*h*density/3);
  for(let i=0;i<clumps;i++){
    const x = 1+(rnd()*(w-2)|0), y = 1+(rnd()*(h-2)|0);
    const mat = rnd()<0.55 ? 2 : (rnd()<0.55 ? 1 : 3);
    const shape = rnd();
    if(shape<0.28){                       // zwarty blok
      const bw=1+(rnd()*3|0), bh=1+(rnd()*3|0);
      for(let a=0;a<bw;a++) for(let b=0;b<bh;b++) set(x+a,y+b,mat);
    } else if(shape<0.55){                // żywopłot
      const len=2+(rnd()*5|0), hor=rnd()<0.5;
      for(let a=0;a<len;a++) set(x+(hor?a:0), y+(hor?0:a), mat);
    } else if(shape<0.78){                // pusty w środku kwadrat — jak MMMM w oryginale
      const s=3+(rnd()*2|0);
      for(let a=0;a<s;a++){ set(x+a,y,mat); set(x+a,y+s-1,mat); set(x,y+a,mat); set(x+s-1,y+a,mat); }
    } else {                              // kępa
      set(x,y,mat);
      if(rnd()<0.5) set(x+1,y,mat);
      if(rnd()<0.5) set(x,y+1,mat);
      if(rnd()<0.25) set(x+1,y+1,mat);
    }
  }
  return { m, w, h };
}

// Zamurowuje wszystkie obszary poza największym spójnym — inaczej wrogowie
// zespawnowani w odciętej kieszeni nigdy nie dojdą i fala nigdy się nie skończy.
// Sąsiedztwo 4-kierunkowe, bo tryMove przesuwa się osobno po osiach:
// przejście „po skosie" nie istnieje.
function largestRegion(m,w,h){
  const seen = new Uint8Array(w*h);
  const regions = [];
  let bestSize = 0, best = null;
  const stack = [];
  for(let y=1;y<h-1;y++) for(let x=1;x<w-1;x++){
    if(m[y][x]!==0 || seen[y*w+x]) continue;
    stack.length=0; stack.push(x,y); seen[y*w+x]=1;
    const reg=[];
    while(stack.length){
      const cy=stack.pop(), cx=stack.pop();
      reg.push(cy*w+cx);
      if(cx>1     && m[cy][cx-1]===0 && !seen[cy*w+cx-1]){ seen[cy*w+cx-1]=1; stack.push(cx-1,cy); }
      if(cx<w-2   && m[cy][cx+1]===0 && !seen[cy*w+cx+1]){ seen[cy*w+cx+1]=1; stack.push(cx+1,cy); }
      if(cy>1     && m[cy-1][cx]===0 && !seen[(cy-1)*w+cx]){ seen[(cy-1)*w+cx]=1; stack.push(cx,cy-1); }
      if(cy<h-2   && m[cy+1][cx]===0 && !seen[(cy+1)*w+cx]){ seen[(cy+1)*w+cx]=1; stack.push(cx,cy+1); }
    }
    regions.push(reg);
    if(reg.length>bestSize){ bestSize=reg.length; best=reg; }
  }
  for(const reg of regions){
    if(reg===best) continue;
    for(const idx of reg) m[(idx/w)|0][idx%w] = 1;
  }
  return bestSize;
}

// Powtarza losowanie, aż mapa jest dość otwarta i ma choć jedną polanę 3x3
// (findOpenSpot potrzebuje jej na punkt startowy gracza).
function buildMap(seed, level){
  for(let attempt=0; attempt<60; attempt++){
    const g = genMap(seed + attempt*7919, level);
    const open = largestRegion(g.m, g.w, g.h);
    if(open < g.w*g.h*0.42) continue;
    let has3=false;
    for(let y=2;y<g.h-2 && !has3;y++){
      for(let x=2;x<g.w-2;x++){
        let ok=true;
        for(let oy=-1;oy<=1 && ok;oy++) for(let ox=-1;ox<=1;ox++)
          if(g.m[y+oy][x+ox]!==0){ ok=false; break; }
        if(ok){ has3=true; break; }
      }
    }
    if(has3) return g;
  }
  return mapFromRAW();          // awaryjnie: znana, na pewno grywalna mapa
}

/* ============================================================
   TEKSTURY (proceduralne, z 32 poziomami przyciemnienia)
   ============================================================ */
function makeCanvas(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
function grab(c){
  const g=c.getContext('2d');
  const d=g.getImageData(0,0,c.width,c.height);
  return { w:c.width, h:c.height, data:new Uint32Array(d.data.buffer) };
}
function shadeLevels(tex, n){
  const lv=[];
  for(let l=0;l<n;l++){
    const f = 1 - l/(n-1);
    const out = new Uint32Array(tex.data.length);
    for(let i=0;i<tex.data.length;i++){
      const c = tex.data[i];
      const a = (c>>>24)&255;
      if(a<128){ out[i]=0; continue; }
      const r = c&255, g=(c>>>8)&255, b=(c>>>16)&255;
      const nr = (r*f + FOG[0]*(1-f))|0;
      const ng = (g*f + FOG[1]*(1-f))|0;
      const nb = (b*f + FOG[2]*(1-f))|0;
      out[i] = (255<<24)|(nb<<16)|(ng<<8)|nr;
    }
    lv.push(out);
  }
  tex.lv = lv; tex.n = n;
  return tex;
}

function texBark(B){
  const c=makeCanvas(64,64), g=c.getContext('2d'), r=mulberry32(7);
  g.fillStyle=B.bark; g.fillRect(0,0,64,64);
  for(let i=0;i<70;i++){
    const x=r()*64, w=1+r()*3, h=8+r()*56, y=r()*64;
    g.fillStyle = r()<.5 ? `rgba(${B.barkDark[0]},${B.barkDark[1]},${B.barkDark[2]},${.3+r()*.5})`
                         : `rgba(${B.barkLite[0]},${B.barkLite[1]},${B.barkLite[2]},${.15+r()*.3})`;
    g.fillRect(x,y,w,h);
  }
  for(let i=0;i<5;i++){                   // sęki
    const x=6+r()*52,y=6+r()*52,rr=3+r()*4;
    g.fillStyle=B.knot[0]; g.beginPath(); g.ellipse(x,y,rr,rr*.7,0,0,7); g.fill();
    g.fillStyle=B.knot[1]; g.beginPath(); g.ellipse(x,y,rr*.5,rr*.35,0,0,7); g.fill();
  }
  g.fillStyle='rgba(0,0,0,.35)'; g.fillRect(0,0,64,2); g.fillRect(0,62,64,2);
  return grab(c);
}
function texStone(moss,B){
  const c=makeCanvas(64,64), g=c.getContext('2d'), r=mulberry32(moss?31:13);
  g.fillStyle=B.stone; g.fillRect(0,0,64,64);
  for(let row=0;row<4;row++){
    const off = (row%2)*8;
    for(let col=-1;col<5;col++){
      const x=col*16+off+1, y=row*16+1, w=14, h=14;
      const t=.6+r()*.4;
      g.fillStyle=`rgb(${(B.stoneRGB[0]*t)|0},${(B.stoneRGB[1]*t)|0},${(B.stoneRGB[2]*t)|0})`;
      g.fillRect(x,y,w,h);
      g.fillStyle='rgba(255,255,255,.06)'; g.fillRect(x,y,w,2);
      g.fillStyle='rgba(0,0,0,.28)'; g.fillRect(x,y+h-2,w,2);
    }
  }
  for(let i=0;i<200;i++){ g.fillStyle=`rgba(0,0,0,${r()*.25})`; g.fillRect(r()*64,r()*64,1,1); }
  if(moss){
    for(let i=0;i<90;i++){
      const x=r()*64,y=r()*64,rr=1+r()*5;
      g.fillStyle=`rgba(${B.moss[0]+r()*B.mossVar[0]|0},${B.moss[1]+r()*B.mossVar[1]|0},${B.moss[2]+r()*B.mossVar[2]|0},${.25+r()*.5})`;
      g.beginPath(); g.ellipse(x,y,rr,rr*.7,0,0,7); g.fill();
    }
    for(let i=0;i<14;i++){                // zwisające pnącza
      const x=r()*64; g.strokeStyle=B.vine; g.lineWidth=1;
      g.beginPath(); g.moveTo(x,0); g.quadraticCurveTo(x+(r()*8-4),20,x+(r()*10-5),18+r()*30); g.stroke();
    }
  }
  return grab(c);
}
function texGrass(B){
  const c=makeCanvas(64,64), g=c.getContext('2d'), r=mulberry32(99);
  g.fillStyle=B.grass; g.fillRect(0,0,64,64);
  for(let i=0;i<900;i++){
    const x=r()*64,y=r()*64;
    g.fillStyle = r()<.55
      ? `rgba(${B.grassA[0]+r()*B.grassAVar[0]|0},${B.grassA[1]+r()*B.grassAVar[1]|0},${B.grassA[2]+r()*B.grassAVar[2]|0},.9)`
      : `rgba(${B.grassB[0]+r()*B.grassBVar[0]|0},${B.grassB[1]+r()*B.grassBVar[1]|0},${B.grassB[2]+r()*B.grassBVar[2]|0},.9)`;
    g.fillRect(x,y,1,1+ (r()<.3?1:0));
  }
  for(let i=0;i<40;i++){                  // gałązki i liście
    const x=r()*64,y=r()*64;
    g.fillStyle=`rgba(${B.litter[0]+r()*30|0},${B.litter[1]+r()*20|0},${B.litter[2]+r()*15|0},.7)`;
    g.fillRect(x,y,2+r()*3,1);
  }
  for(let i=0;i<10;i++){
    const x=r()*64,y=r()*64;
    g.fillStyle=B.sparkle; g.fillRect(x,y,1,1);
  }
  return grab(c);
}

const SKY_W=1024, SKY_H=405, SKY_HZ=270;   // horyzont tekstury w wierszu 270
let sky = null;
function makeSky(B){
  const S=B.sky;
  const c=makeCanvas(SKY_W,SKY_H), g=c.getContext('2d'), r=mulberry32(2024);
  const grd=g.createLinearGradient(0,0,0,SKY_H);
  grd.addColorStop(0,S.stops[0]); grd.addColorStop(.55,S.stops[1]);
  grd.addColorStop(.78,S.stops[2]); grd.addColorStop(1,S.stops[3]);
  g.fillStyle=grd; g.fillRect(0,0,SKY_W,SKY_H);
  for(let i=0;i<S.stars;i++){               // gwiazdy
    const x=r()*SKY_W, y=r()*250, a=r()*.9;
    g.fillStyle=`rgba(200,220,255,${a})`; g.fillRect(x,y,1,1);
    if(r()<.05){ g.fillStyle=`rgba(200,220,255,${a*.4})`; g.fillRect(x-1,y,3,1); g.fillRect(x,y-1,1,3); }
  }
  if(S.moon){                               // księżyc + poświata
    const halo=g.createRadialGradient(300,110,4,300,110,90);
    halo.addColorStop(0,'rgba(190,215,255,.30)'); halo.addColorStop(.35,'rgba(140,170,220,.10)');
    halo.addColorStop(1,'rgba(120,150,200,0)');
    g.fillStyle=halo; g.beginPath(); g.arc(300,110,90,0,7); g.fill();
    const face=g.createRadialGradient(292,102,2,300,110,17);
    face.addColorStop(0,'#f2f6ff'); face.addColorStop(.7,'#cdd8ea'); face.addColorStop(1,'#9fb0c8');
    g.fillStyle=face; g.beginPath(); g.arc(300,110,16,0,7); g.fill();
    g.fillStyle='rgba(140,155,180,.45)';
    g.beginPath(); g.arc(295,105,3.4,0,7); g.fill();
    g.beginPath(); g.arc(305,116,2.4,0,7); g.fill();
    g.beginPath(); g.arc(303,102,1.6,0,7); g.fill();
    g.beginPath(); g.arc(293,116,1.9,0,7); g.fill();
  }
  // chmury
  for(let i=0;i<26;i++){
    const x=r()*SKY_W,y=60+r()*160,w=60+r()*140,h=8+r()*16;
    g.fillStyle=`rgba(${S.cloud},${.12+r()*.2})`;
    g.beginPath(); g.ellipse(x,y,w,h,0,0,7); g.fill();
  }
  // odległa linia lasu
  for(let pass=0;pass<3;pass++){
    const base = 258 + pass*6, col=S.treeline[pass];
    g.fillStyle=col;
    let x=0;
    while(x<SKY_W){
      const w=6+r()*16, h=14+r()*46*(1-pass*.25);
      g.beginPath();
      g.moveTo(x,base); g.lineTo(x+w/2,base-h); g.lineTo(x+w,base); g.closePath(); g.fill();
      x += w*0.62;
    }
    g.fillRect(0,base,SKY_W,SKY_H-base);
  }
  return grab(c);
}

/* ============================================================
   SPRITE'Y (rysowane w 2D, potem cięte na piksele)
   ============================================================ */
const SPR_LV = 16;
function makeSprite(w,h,draw,tint){
  const c=makeCanvas(w,h); const g=c.getContext('2d');
  g.clearRect(0,0,w,h); draw(g,w,h);
  if(tint){                       // odcień biomu — tylko na narysowanych pikselach
    g.globalCompositeOperation='source-atop';
    g.fillStyle=tint; g.fillRect(0,0,w,h);
    g.globalCompositeOperation='source-over';
  }
  return shadeLevels(grab(c), SPR_LV);
}
function jag(g,cx,cy,rr,n,rand,col){
  g.fillStyle=col; g.beginPath();
  for(let i=0;i<n;i++){
    const a=i/n*Math.PI*2, k=rr*(0.72+rand()*0.55);
    const x=cx+Math.cos(a)*k, y=cy+Math.sin(a)*k*0.85;
    i?g.lineTo(x,y):g.moveTo(x,y);
  }
  g.closePath(); g.fill();
}

/* Rysunek jednego wrogiego drzewa.
   kind: 0 sadzonka, 1 dąb, 2 świerk, 3 prastare, 4 zakorzeniony, 5 matecznik, 6 cichosz */
function drawTree(g,w,h,kind,frame,seed){
  const r=mulberry32(seed+frame*17);
  const t = frame/4*Math.PI*2;
  const sway = Math.sin(t)*w*0.045;
  const step = Math.sin(t)*h*0.03;
  const pal = [
    { bark:'#6a4b30', bark2:'#3c2a1a', leaf:['#6fbf4a','#4f9c33','#8ad35e'], eye:'#ffe14a' },
    { bark:'#5a3f28', bark2:'#2e2013', leaf:['#3f7a2c','#2c5c1f','#55993a'], eye:'#ff6a2a' },
    { bark:'#4a3524', bark2:'#241a10', leaf:['#1f5638','#154029','#2c7048'], eye:'#63e3ff' },
    { bark:'#3a2a1e', bark2:'#181009', leaf:['#5b3f6e','#3d2a4c','#7a5690'], eye:'#ff2f2f' },
    { bark:'#4c4a42', bark2:'#22201b', leaf:['#4a5a30','#333f20','#5f7040'], eye:'#ffab2e' },
    { bark:'#6b4a44', bark2:'#33201e', leaf:['#b06a8e','#7d4562','#c98aa8'], eye:'#8cff6a' },
    { bark:'#c6c2b0', bark2:'#6e6a5c', leaf:['#8f9c86','#6d7a66','#aab6a0'], eye:'#ffffff' },
  ][kind];

  const cx=w/2, ground=h-1;
  const trunkW = [0.16,0.30,0.20,0.42,0.50,0.28,0.18][kind]*w;
  const trunkTop = h*[0.52,0.46,0.40,0.30,0.44,0.48,0.34][kind];

  // korzenie-nogi
  g.fillStyle=pal.bark2;
  for(let s=-1;s<=1;s+=2){
    const lx = cx + s*trunkW*0.42 + (s>0?step:-step);
    g.beginPath();
    g.moveTo(lx - trunkW*0.22, ground - h*0.22);
    g.lineTo(lx + trunkW*0.22, ground - h*0.22);
    g.lineTo(lx + trunkW*0.34 + s*3, ground);
    g.lineTo(lx - trunkW*0.34 + s*3, ground);
    g.closePath(); g.fill();
  }
  // pień
  g.fillStyle=pal.bark;
  g.beginPath();
  g.moveTo(cx-trunkW/2, ground-h*0.16);
  g.lineTo(cx+trunkW/2, ground-h*0.16);
  g.lineTo(cx+trunkW*0.36+sway, trunkTop);
  g.lineTo(cx-trunkW*0.36+sway, trunkTop);
  g.closePath(); g.fill();
  g.fillStyle=pal.bark2;
  for(let i=0;i<10;i++){
    const y=trunkTop+r()*(ground-trunkTop-4);
    g.fillRect(cx-trunkW*0.4+r()*trunkW*0.8, y, 1, 3+r()*8);
  }

  // cechy szczególne nowych gatunków
  if(kind===4){                       // zakorzeniony — grube korzenie wpite w ziemię
    g.strokeStyle=pal.bark2; g.lineCap='round';
    for(let i=0;i<7;i++){
      const s=(i/6-0.5)*2;
      g.lineWidth=Math.max(2, trunkW*0.16);
      g.beginPath();
      g.moveTo(cx+s*trunkW*0.28, ground-h*0.20);
      g.quadraticCurveTo(cx+s*trunkW*0.9, ground-h*0.06, cx+s*w*0.46, ground-1);
      g.stroke();
    }
    g.fillStyle='rgba(90,70,40,.45)';
    g.beginPath(); g.ellipse(cx, ground-2, w*0.46, h*0.045, 0,0,7); g.fill();
  } else if(kind===5){                // matecznik — torebki z zarodnikami na pniu
    for(let i=0;i<6;i++){
      const y=trunkTop+r()*(ground-trunkTop-8), x=cx-trunkW*0.5+r()*trunkW;
      const rr2=2+r()*3;
      g.fillStyle='#c98aa8'; g.beginPath(); g.ellipse(x,y,rr2,rr2*1.3,0,0,7); g.fill();
      g.fillStyle='rgba(255,220,235,.6)'; g.beginPath(); g.ellipse(x-rr2*0.3,y-rr2*0.4,rr2*0.35,rr2*0.4,0,0,7); g.fill();
    }
  } else if(kind===6){                // cichosz — brzozowe pręgi
    g.fillStyle='#2f2c26';
    for(let i=0;i<12;i++){
      const y=trunkTop+r()*(ground-trunkTop-3);
      const ww=trunkW*(0.25+r()*0.5);
      g.fillRect(cx-trunkW*0.45+r()*(trunkW*0.9-ww), y, ww, 1+r()*2);
    }
  }

  // konary-ramiona
  g.strokeStyle=pal.bark; g.lineCap='round';
  for(let s=-1;s<=1;s+=2){
    const armY = h*[0.60,0.56,0.52,0.44,0.58,0.58,0.46][kind];
    const reach = w*0.42*(1+Math.sin(t+ (s>0?0:2))*0.12);
    g.lineWidth = Math.max(2, trunkW*0.22);
    g.beginPath();
    g.moveTo(cx + s*trunkW*0.3, armY);
    g.quadraticCurveTo(cx + s*reach*0.8, armY - h*0.06, cx + s*reach, armY + h*0.07);
    g.stroke();
    g.lineWidth = Math.max(1, trunkW*0.11);
    for(let f=0;f<3;f++){
      g.beginPath();
      g.moveTo(cx + s*reach, armY + h*0.07);
      g.lineTo(cx + s*(reach + 4 + f*2), armY + h*(0.12 + f*0.035));
      g.stroke();
    }
  }

  // korona
  if(kind===2){                       // świerk — warstwy
    for(let i=0;i<4;i++){
      const yy = trunkTop - h*0.02 + i*h*0.12;
      const ww = w*(0.18 + i*0.11);
      g.fillStyle = pal.leaf[i%3];
      g.beginPath();
      g.moveTo(cx+sway, yy - h*0.16);
      g.lineTo(cx+sway+ww, yy);
      g.lineTo(cx+sway-ww, yy);
      g.closePath(); g.fill();
    }
  } else {
    const rr = w*[0.24,0.40,0.30,0.46,0.34,0.38,0.26][kind];
    const cy = trunkTop - rr*0.35;
    for(let i=0;i<7;i++){
      const a=i/7*Math.PI*2;
      jag(g, cx+sway+Math.cos(a)*rr*0.55, cy+Math.sin(a)*rr*0.38, rr*0.62, 9, r, pal.leaf[i%3]);
    }
    jag(g, cx+sway, cy, rr*0.9, 11, r, pal.leaf[1]);
    g.globalAlpha=.5;
    jag(g, cx+sway-rr*0.3, cy-rr*0.3, rr*0.5, 9, r, pal.leaf[2]);
    g.globalAlpha=1;
  }

  // twarz w korze
  const fy = h*[0.68,0.66,0.62,0.56,0.66,0.68,0.58][kind];
  const ew = Math.max(2, trunkW*0.20), eg = trunkW*0.24;
  g.fillStyle='#0a0603';
  g.beginPath(); g.ellipse(cx-eg, fy, ew*1.3, ew, 0,0,7); g.fill();
  g.beginPath(); g.ellipse(cx+eg, fy, ew*1.3, ew, 0,0,7); g.fill();
  g.fillStyle=pal.eye;
  g.beginPath(); g.ellipse(cx-eg, fy, ew*0.7, ew*0.55,0,0,7); g.fill();
  g.beginPath(); g.ellipse(cx+eg, fy, ew*0.7, ew*0.55,0,0,7); g.fill();
  g.fillStyle='#0a0603';
  const mw=trunkW*0.5, my=fy+ew*2.2, mh=ew*(1.2+Math.abs(Math.sin(t))*0.9);
  g.beginPath(); g.moveTo(cx-mw/2,my);
  for(let i=0;i<=4;i++) g.lineTo(cx-mw/2+mw*i/4, my + (i%2?mh:mh*0.3));
  g.lineTo(cx+mw/2,my); g.closePath(); g.fill();
  g.fillStyle='#e9e2cf';
  for(let i=0;i<4;i++){
    const x=cx-mw/2+mw*(i+0.5)/4;
    g.beginPath(); g.moveTo(x-1.2,my); g.lineTo(x+1.2,my); g.lineTo(x, my+mh*0.55); g.closePath(); g.fill();
  }
}

function drawStump(g,w,h){
  const r=mulberry32(5);
  g.fillStyle='#3c2a1a';
  g.beginPath(); g.moveTo(w*0.3,h); g.lineTo(w*0.7,h); g.lineTo(w*0.66,h*0.55); g.lineTo(w*0.34,h*0.55); g.closePath(); g.fill();
  g.fillStyle='#7a5a3a'; g.beginPath(); g.ellipse(w/2,h*0.55,w*0.17,h*0.06,0,0,7); g.fill();
  g.strokeStyle='#4a3524'; g.lineWidth=1;
  for(let i=1;i<4;i++){ g.beginPath(); g.ellipse(w/2,h*0.55,w*0.17*i/4,h*0.06*i/4,0,0,7); g.stroke(); }
  for(let i=0;i<6;i++){ g.fillStyle='rgba(0,0,0,.3)'; g.fillRect(w*0.32+r()*w*0.36, h*0.6+r()*h*0.35,1,3+r()*5); }
}
function drawPickup(g,w,h,kind){
  if(kind===0){                                  // liść zdrowia
    g.fillStyle='#7fe06a';
    g.beginPath(); g.moveTo(w/2,h*0.15);
    g.quadraticCurveTo(w*0.95,h*0.45,w/2,h*0.92);
    g.quadraticCurveTo(w*0.05,h*0.45,w/2,h*0.15); g.fill();
    g.strokeStyle='#2f6b22'; g.lineWidth=1;
    g.beginPath(); g.moveTo(w/2,h*0.2); g.lineTo(w/2,h*0.88); g.stroke();
    g.fillStyle='rgba(255,255,255,.35)'; g.beginPath(); g.ellipse(w*0.4,h*0.4,w*0.08,h*0.14,-0.5,0,7); g.fill();
  } else if(kind===1){                           // pudełko naboi śrutowych
    g.fillStyle='#8a2f2f'; g.fillRect(w*0.2,h*0.4,w*0.6,h*0.45);
    g.fillStyle='#c9a24a'; g.fillRect(w*0.2,h*0.72,w*0.6,h*0.13);
    g.fillStyle='#e0d6bb'; g.font=`${Math.floor(h*0.28)}px monospace`; g.textAlign='center';
    g.fillText('S', w*0.5, h*0.68);
  } else {                                       // skrzynka amunicji
    g.fillStyle='#3f5a2e'; g.fillRect(w*0.15,h*0.42,w*0.7,h*0.44);
    g.fillStyle='#2a3d1f'; g.fillRect(w*0.15,h*0.42,w*0.7,h*0.09);
    g.fillStyle='#c9c14a';
    for(let i=0;i<4;i++) g.fillRect(w*(0.22+i*0.16), h*0.56, w*0.09, h*0.22);
  }
}

// generowanie zestawów klatek
const TREE_FRAMES = 4;
const TREES = [];
let STUMP=null, PICKUP=null, CONE=null;

function buildSprites(B){
  const tint = B.treeTint;
  TREES.length = 0;
  for(let k=0;k<7;k++){
    const w=[44,64,52,84,76,58,40][k], h=[64,96,104,140,92,88,110][k];
    const fr=[];
    for(let f=0;f<TREE_FRAMES;f++) fr.push(makeSprite(w,h,(g,W2,H2)=>drawTree(g,W2,H2,k,f,k*101+7), tint));
    TREES.push(fr);
  }
  STUMP  = makeSprite(48,32,drawStump,tint);
  // znajdźki celowo BEZ odcienia — muszą pozostać czytelne w każdym biomie
  PICKUP = [0,1,2].map(k=>makeSprite(28,28,(g,w,h)=>drawPickup(g,w,h,k)));
  CONE = makeSprite(16,20,(g,w,h)=>{
    g.fillStyle='#5a3a1e'; g.beginPath(); g.ellipse(w/2,h/2,w*0.3,h*0.42,0,0,7); g.fill();
    g.fillStyle='#3a2410';
    for(let i=0;i<5;i++) g.fillRect(w*0.2, h*(0.18+i*0.15), w*0.6, 1.5);
    g.fillStyle='rgba(255,180,80,.5)'; g.beginPath(); g.ellipse(w*0.4,h*0.35,w*0.12,h*0.1,0,0,7); g.fill();
  }, tint);
}

   DŹWIĘK
   ============================================================ */
let AC=null, master=null, muted=false, windGain=null;
function audioInit(){
  if(AC) return;
  AC = new (window.AudioContext||window.webkitAudioContext)();
  master = AC.createGain(); master.gain.value=0.5; master.connect(AC.destination);
  // wiatr w tle
  const b = AC.createBufferSource(); b.buffer = noiseBuf(); b.loop=true;
  const f = AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=420; f.Q.value=0.6;
  windGain = AC.createGain(); windGain.gain.value=0.09;
  b.connect(f); f.connect(windGain); windGain.connect(master); b.start();
  const lfo=AC.createOscillator(), lg=AC.createGain();
  lfo.frequency.value=0.13; lg.gain.value=0.05; lfo.connect(lg); lg.connect(windGain.gain); lfo.start();
}
let _nb=null;
function noiseBuf(){
  if(_nb) return _nb;
  const len=AC.sampleRate*3, b=AC.createBuffer(1,len,AC.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
  _nb=b; return b;
}
function env(node, vol, atk, dec){
  const g=AC.createGain(); const t=AC.currentTime;
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol,t+atk);
  g.gain.exponentialRampToValueAtTime(0.0001,t+atk+dec);
  node.connect(g); g.connect(master); return g;
}
function sNoise(vol,atk,dec,type,f0,f1,q){
  if(!AC||muted) return;
  const s=AC.createBufferSource(); s.buffer=noiseBuf();
  const bf=AC.createBiquadFilter(); bf.type=type||'lowpass'; bf.Q.value=q||1;
  const t=AC.currentTime;
  bf.frequency.setValueAtTime(f0,t); bf.frequency.exponentialRampToValueAtTime(Math.max(40,f1),t+atk+dec);
  s.connect(bf); env(bf,vol,atk,dec); s.start(t, Math.random()*2); s.stop(t+atk+dec+0.05);
}
// `delay` planuje dźwięk w zegarze WebAudio zamiast setTimeout — nie rozjeżdża
// się z pauzą i nie zostawia wiszących timerów po restarcie gry
function sTone(vol,atk,dec,wave,f0,f1,delay){
  if(!AC||muted) return;
  const o=AC.createOscillator(); o.type=wave;
  const t=AC.currentTime+(delay||0);
  o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+atk+dec);
  envAt(o,vol,atk,dec,t); o.start(t); o.stop(t+atk+dec+0.05);
}
function envAt(node, vol, atk, dec, t){
  const g=AC.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol,t+atk);
  g.gain.exponentialRampToValueAtTime(0.0001,t+atk+dec);
  node.connect(g); g.connect(master); return g;
}
const SFX = {
  shotgun(){ sNoise(.55,.005,.35,'lowpass',3800,180,1); sTone(.4,.005,.25,'square',150,40); },
  chain(){   sNoise(.22,.002,.07,'bandpass',1800,900,4); sTone(.12,.002,.05,'square',220,90); },
  axe(){     sNoise(.18,.03,.16,'bandpass',900,3200,2); },
  chop(){    sNoise(.35,.004,.18,'lowpass',900,120,1); sTone(.2,.004,.12,'triangle',90,45); },
  hit(){     sNoise(.16,.003,.07,'highpass',1200,2600,1); },
  groan(){   sTone(.14,.15,1.1,'sawtooth',85,42); sNoise(.07,.2,.9,'lowpass',300,120,1); },
  hurt(){    sTone(.3,.01,.35,'sawtooth',320,90); sNoise(.2,.01,.2,'bandpass',700,220,1); },

  swap(){    sTone(.12,.005,.06,'square',400,700); },

// najbliższa naprawdę otwarta polana (kratka wolna razem z ośmioma sąsiadami)
function findOpenSpot(px,py){
  let best=null, bestD=1e9, any=null;
  for(let y=1;y<MH-1;y++) for(let x=1;x<MW-1;x++){
    if(cell(x,y)!==0) continue;
    const cx=x+0.5, cy=y+0.5;
    if(!any) any={x:cx,y:cy};
    let open=true;
    for(let oy=-1;oy<=1 && open;oy++) for(let ox=-1;ox<=1;ox++)
      if(cell(x+ox,y+oy)!==0){ open=false; break; }
    if(!open) continue;
    const d=(cx-px)*(cx-px)+(cy-py)*(cy-py);
    if(d<bestD){ bestD=d; best={x:cx,y:cy}; }
  }
  return best || any || {x:1.5,y:1.5};
}
/* ---------- poziomy ---------- */
const WAVES_PER_LEVEL = 10;
let level = 0, biome = BIOMES[0], levelFade = 0;

// Poziom 1 to mapa z RAW; każde kolejne 10 fal to nowy, losowy las w nowym biomie.
function enterLevel(n, first){
  level = n;
  biome = BIOMES[(n-1) % BIOMES.length];
  FOG = biome.fog.slice();
  MAXFOG = biome.maxfog;

  applyMap(n===1 ? mapFromRAW() : buildMap(n*104729 + 40503, n));
  rebuildArt(biome);

  // nowy las = czysta plansza; stare drzewa i pociski zostają w poprzednim
  enemies.length=0; shots.length=0; parts.length=0; decals.length=0; pickups.length=0;

  const spot = findOpenSpot(MW*0.5, MH*0.5);
  P.x = spot.x; P.y = spot.y; P.a = Math.random()*Math.PI*2;
  P.swingT=0; P.reloadT=0; P.iframe=0; P.cd=0; P.pitch=0;
  waveQueue=[]; waveTimer = first ? 1.6 : 3.2;
  levelFade = 1;

  if(!first){
    // przejście to zarazem punkt kontrolny — bez tego dalsze biomy są nie do przejścia
    P.hp = Math.min(P.maxhp, P.hp + 40);
    P.shells  = Math.min(P.maxShells,  P.shells  + 12);
    P.bullets = Math.min(P.maxBullets, P.bullets + 60);
    SFX.wave();
    message(`POZIOM ${level} — ${biome.name}`, 3);
  }
}

/* ---------- fale ---------- */
// Liczebność wysyca się (limit 26 żywych i tak jest twardy), więc od ~fali 13
// trudność bierze się z MOCY drzew i nowych gatunków, nie z dłuższego przeciągania.
const MAX_WAVE_N = 26;
function waveScale(){
  const w = Math.max(0, wave-1);
  return {
    hp:    1 + Math.min(1.20, w*0.05),    // pułap +120% HP
    dmg:   1 + Math.min(0.90, w*0.045),   // wrogowie realnie bolą coraz bardziej
    spd:   1 + Math.min(0.35, w*0.020),
    rate:  1 / (1 + Math.min(0.50, w*0.030)),  // krótszy odstęp między atakami
  };
}

// pula gatunków otwierana falami: [kind, waga]
function waveRoster(){
  const pool = [[0, 35], [1, 35], [2, 30]];
  if(wave<2)      return [[0,85],[1,15]];
  if(wave<4)      return [[0,50],[1,35],[2,15]];
  if(wave>=4)  pool.push([5, 14]);   // matecznik
  if(wave>=6)  pool.push([4, 16]);   // zakorzeniony
  if(wave>=8)  pool.push([6, 14]);   // cichosz
  return pool;
}
function rollKind(){
  const pool = waveRoster();
  let total=0; for(const p of pool) total+=p[1];
  let r=Math.random()*total;
  for(const p of pool){ r-=p[1]; if(r<=0) return p[0]; }
  return pool[0][0];
}

function startWave(){
  // Co WAVES_PER_LEVEL fal las się zmienia: nowa mapa, nowy biom, nowe tekstury.
  // Warunek `level === wave/WAVES_PER_LEVEL` sprawia, że przejście odpala się
  // dokładnie raz — przy kolejnym wywołaniu level jest już podbity i fala rusza.
  if(wave>0 && wave%WAVES_PER_LEVEL===0 && level === wave/WAVES_PER_LEVEL){
    enterLevel(level+1, false);
    return;                       // fala ruszy po odliczeniu waveTimer w nowym lesie
  }
  wave++;
  waveQueue=[];
  waveTimer=0;
  const boss = wave%5===0;
  const n = Math.min(MAX_WAVE_N, 4 + Math.floor(wave*1.7));
  for(let i=0;i<n;i++) waveQueue.push(rollKind());
  if(boss) waveQueue.push(3);
  SFX.wave();
  message(boss ? `FALA ${wave} — PRADRZEW SIĘ BUDZI!` : `FALA ${wave}`, 2.2);
}

// promień kolizji zawsze < 0.5, żeby każde drzewo przecisnęło się przez przerwę
// szerokości jednej kratki i nigdy nie utknęło na stałe
const ENEMY_DEF = [
  { hp:34,  spd:1.55, r:0.30, hUnits:0.95, wUnits:0.66, dmg:7,  atkCd:0.9, ranged:false, score:1 },
  { hp:105, spd:1.05, r:0.42, hUnits:1.45, wUnits:0.98, dmg:16, atkCd:1.3, ranged:false, score:2 },
  { hp:62,  spd:1.25, r:0.34, hUnits:1.55, wUnits:0.78, dmg:11, atkCd:1.8, ranged:true,  score:2 },
  { hp:900, spd:0.95, r:0.46, hUnits:2.35, wUnits:1.42, dmg:26, atkCd:1.1, ranged:true,  score:10 },
  // zakorzeniony: podchodzi, wrasta w ziemię i staje się fizyczną przeszkodą —
  // zmienia geometrię starcia, zamiast tylko dokładać obrażeń
  { hp:150, spd:1.15, r:0.44, hUnits:1.35, wUnits:1.15, dmg:14, atkCd:1.0, ranged:false, score:3,
    roots:true, rootAt:2.6 },
  // matecznik: przy śmierci rozsiewa dwie sadzonki
  { hp:80,  spd:1.20, r:0.34, hUnits:1.25, wUnits:0.82, dmg:9,  atkCd:1.2, ranged:false, score:3,
    splits:2 },
  // cichosz: rusza się TYLKO wtedy, gdy na niego nie patrzysz
  { hp:70,  spd:3.10, r:0.30, hUnits:1.60, wUnits:0.60, dmg:20, atkCd:1.4, ranged:false, score:4,
    shy:true },
];
const FOV_HALF = 0.62;   // połowa poziomego pola widzenia (~71° łącznie)

function freeCell(x,y,r){
  return cell(x-r,y-r)===0 && cell(x+r,y-r)===0 && cell(x-r,y+r)===0 && cell(x+r,y+r)===0;
}
function makeEnemy(kind,x,y){
  const d=ENEMY_DEF[kind], s=waveScale();
  const hp = d.hp*s.hp;
  return { x, y, kind, hp, maxhp:hp,
           dmg:d.dmg*s.dmg, spd:d.spd*s.spd, atkCd:d.atkCd*s.rate,
           atk:Math.random()*d.atkCd, anim:Math.random()*4, flash:0,
           dying:0, dead:false, groan:Math.random()*6, rooted:false };
}
function spawnEnemy(kind){
  const d=ENEMY_DEF[kind];
  for(let tries=0;tries<200;tries++){
    const x = 1.5 + Math.random()*(MW-3), y = 1.5 + Math.random()*(MH-3);
    if(!freeCell(x,y,d.r+0.1)) continue;
    const dx=x-P.x, dy=y-P.y;
    if(dx*dx+dy*dy < 49) continue;                 // nie bliżej niż 7 jednostek
    enemies.push(makeEnemy(kind,x,y));
    if(Math.random()<0.35) SFX.groan();
    return true;
  }
  return false;
}

let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  let dt=(now-last)/1000; last=now;
  dt=Math.min(dt,0.05);
  if(running) update(dt);
  else if(gameOver) update(Math.min(dt,0.03)*0.35);   // slow-mo po śmierci
  render();
  drawMini();
}
requestAnimationFrame(frame);

/* ============================================================
   AKTUALIZACJA
   ============================================================ */
function update(dt){
  // --- gracz ---
  if(!P.dead){
    const dirX=Math.cos(P.a), dirY=Math.sin(P.a);
    let mx=0,my=0;
    if(keys.KeyW||keys.ArrowUp){ mx+=dirX; my+=dirY; }
    if(keys.KeyS||keys.ArrowDown){ mx-=dirX; my-=dirY; }
    if(keys.KeyA){ mx+=dirY; my-=dirX; }
    if(keys.KeyD){ mx-=dirY; my+=dirX; }
    if(keys.ArrowLeft) P.a-=2.4*dt;
    if(keys.ArrowRight) P.a+=2.4*dt;
    if(keys.KeyQ) P.a-=2.4*dt;
    if(keys.KeyE) P.a+=2.4*dt;

    const len=Math.hypot(mx,my);
    const run = (keys.ShiftLeft||keys.ShiftRight)?1.55:1;
    const spd = 2.6*run;
    if(len>0){
      mx/=len; my/=len;
      tryMove(P, mx*spd*dt, my*spd*dt, 0.28, freeForPlayer);
      bobT += dt*(9*run);
    } else bobT += dt*1.5;
    // gdyby gracz kiedykolwiek znalazł się w geometrii — wypchnij, nie blokuj
    if(!freeCell(P.x,P.y,0.28)) unstick(P,0.28,dt);

    P.pitch *= Math.pow(0.02, dt);                 // powolny powrót do poziomu

    // strzał
    P.cd-=dt; P.fireT=Math.max(0,P.fireT-dt); P.kickT=Math.max(0,P.kickT-dt*3.5);
    P.iframe=Math.max(0,P.iframe-dt);

    // zamach siekiery rozwiązuje się TUTAJ, w pętli gry — nie w setTimeout.
    // Dzięki temu pauza go wstrzymuje, a cel jest szukany w chwili trafienia.
    if(P.swingT>0){
      P.swingT-=dt;
      if(P.swingT<=0){ P.swingT=0; resolveSwing(); }
    }

    // przeładowanie dubeltówki
    if(P.reloadT>0){
      P.reloadT-=dt;
      if(P.reloadT<=0){
        P.reloadT=0;
        const need = WEAPONS[1].mag - P.mag;
        const take = Math.min(need, P.shells);
        P.mag += take; P.shells -= take;
        SFX.reload();
        updateHUD();
      }
    }

    if((keys.Mouse0||keys.Space) && P.cd<=0 && P.reloadT<=0) fire();
    if(keys.KeyR && P.w===1 && P.reloadT<=0 && P.mag<WEAPONS[1].mag && P.shells>0) startReload();
  }

  flashLight = Math.max(0, flashLight - dt*38);
  hurtFlash  = Math.max(0, hurtFlash - dt*1.9);
  camShake   = Math.max(0, camShake - dt*7);
  levelFade  = Math.max(0, levelFade - dt*0.85);   // rozjaśnienie po zmianie lasu

  // --- fale ---
  if(!P.dead){
    if(waveQueue.length===0 && enemies.length===0){
      waveTimer-=dt;
      // startWave() sam ustawia waveTimer — przy zmianie poziomu na przerwę
      // między lasami, normalnie na 0
      if(waveTimer<=0) startWave();
    } else if(waveQueue.length){
      waveTimer-=dt;
      if(waveTimer<=0 && enemies.length<28){
        spawnEnemy(waveQueue.pop());
        waveTimer = waveQueue.length===0 ? 3.4 : Math.max(0.25, 1.1 - wave*0.05);
      }
    }
  }

  // --- wrogowie ---
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i], d=ENEMY_DEF[e.kind];
    if(e.dying>0){
      e.dying-=dt;
      if(e.dying<=0){
        enemies.splice(i,1);
        decals.push({ x:e.x, y:e.y, kind:e.kind });
        if(decals.length>36) decals.shift();
      }
      continue;
    }
    e.flash = Math.max(0, e.flash-dt*9);
    const dx=P.x-e.x, dy=P.y-e.y;
    const dist=Math.hypot(dx,dy)||1e-4;
    e.anim += dt*(2.4 + e.spd);
    e.groan -= dt;
    if(e.groan<=0 && dist<11){ if(Math.random()<0.5) SFX.groan(); e.groan = 4+Math.random()*9; }

    if(!P.dead){
      const nx=dx/dist, ny=dy/dist;

      // zakorzeniony: gdy podejdzie dostatecznie blisko, wrasta w ziemię
      // i od tej chwili jest przeszkodą, przez którą gracz nie przejdzie
      if(d.roots && !e.rooted && dist < d.rootAt && losClear(e.x,e.y,P.x,P.y)){
        e.rooted = true; SFX.root();
        burst(e.x,e.y,0.15,14,[110,90,55]);
      }

      // cichosz stoi jak wryty, dopóki gracz na niego patrzy
      let frozen = false;
      if(d.shy){
        const inView = Math.abs(angDiff(Math.atan2(dy,dx), P.a)) < FOV_HALF;
        frozen = inView && dist < MAXFOG && losClear(e.x,e.y,P.x,P.y);
        e.frozen = frozen;
        if(frozen) e.anim = 0;               // zamiera też animacyjnie
      }

      if(!e.rooted && !frozen){
        // separacja od innych drzew
        let sx=0, sy=0;
        for(let j=0;j<enemies.length;j++){
          if(j===i) continue; const o=enemies[j]; if(o.dying>0) continue;
          const ox=e.x-o.x, oy=e.y-o.y, od=Math.hypot(ox,oy);
          const mind=d.r+ENEMY_DEF[o.kind].r;
          if(od>0 && od<mind){ sx+=ox/od*(mind-od); sy+=oy/od*(mind-od); }
        }
        const keep = d.ranged ? 3.2 : 0.75;
        let mvx=0,mvy=0;
        if(dist>keep){ mvx=nx; mvy=ny; }
        else if(d.ranged && dist<keep*0.7){ mvx=-nx*0.5; mvy=-ny*0.5; }
        // trochę bocznego dryfu, żeby nie szły idealnie w linii
        const drift=Math.sin(e.anim*0.7)*0.35;
        mvx += -ny*drift; mvy += nx*drift;
        mvx += sx*2.2; mvy += sy*2.2;
        const ml=Math.hypot(mvx,mvy);
        if(ml>0.001){ tryMove(e, mvx/ml*e.spd*dt, mvy/ml*e.spd*dt, d.r); }
        if(!freeCell(e.x,e.y,d.r)) unstick(e,d.r,dt);
      }

      // atak
      e.atk-=dt;
      if(e.atk<=0 && !frozen){
        if(d.ranged && dist<10 && losClear(e.x,e.y,P.x,P.y)){
          e.atk = e.atkCd*(0.8+Math.random()*0.5);
          fireCone(e, nx, ny, dist, e.dmg);
        } else if(!d.ranged && dist < d.r+0.55){
          e.atk = e.atkCd;
          hurtPlayer(e.dmg);
        } else if(d.ranged && dist < d.r+0.6){
          e.atk = e.atkCd;
          hurtPlayer(e.dmg*0.7);
        }
      }
    }
  }

  // --- pociski (szyszki) ---
  for(let i=shots.length-1;i>=0;i--){
    const s=shots[i];
    s.life-=dt;
    const nx=s.x+s.vx*dt, ny=s.y+s.vy*dt;
    s.vz -= SHOT_G*dt;
    const nz=s.z+s.vz*dt;
    if(cell(nx,ny)!==0 || nz<0.04 || s.life<=0){
      burst(s.x,s.y,Math.max(0.1,s.z),8,[120,90,50]); shots.splice(i,1); continue;
    }
    // test przeciągnięty po odcinku klatki + kontrola wysokości: szyszka nie
    // przeskoczy gracza przy niskim FPS i nie trafia, jeśli leci nad głową
    if(!P.dead && nz>0.02 && nz<1.05 &&
       segDist2(s.x,s.y,nx,ny,P.x,P.y) < 0.42*0.42){
      hurtPlayer(s.dmg); burst(nx,ny,nz,10,[150,110,60]); shots.splice(i,1); continue;
    }
    s.x=nx; s.y=ny; s.z=nz;
  }

  // --- cząstki ---
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];
    p.life-=dt;
    if(p.life<=0){ parts.splice(i,1); continue; }
    p.vz -= 3.2*dt;
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.z+=p.vz*dt;
    if(p.z<0.02){ p.z=0.02; p.vz*=-0.32; p.vx*=0.6; p.vy*=0.6; }
  }

  // --- znajdźki ---
  for(let i=pickups.length-1;i>=0;i--){
    const pk=pickups[i];
    pk.t+=dt;
    pk.life-=dt;
    if(pk.life<=0){ pickups.splice(i,1); continue; }   // nie zaśmiecamy mapy w nieskończoność
    if(Math.hypot(P.x-pk.x,P.y-pk.y)<0.55){
      let taken=false;
      if(pk.kind===0 && P.hp<P.maxhp){ P.hp=Math.min(P.maxhp,P.hp+25); taken=true; message('+25 ŻYWICY',1); }
      else if(pk.kind===1 && P.shells<P.maxShells){ P.shells=Math.min(P.maxShells,P.shells+8); taken=true; message('+8 NABOI',1); }
      else if(pk.kind===2 && P.bullets<P.maxBullets){ P.bullets=Math.min(P.maxBullets,P.bullets+45); taken=true; message('+45 AMUNICJI',1); }
      if(taken){ SFX.pick(); pickups.splice(i,1); updateHUD(); }
    }
  }

  if(msgTimer>0){ msgTimer-=dt; if(msgTimer<=0) document.getElementById('msg').classList.remove('show'); }
  updateHUD();
}

function tryMove(ent, dx, dy, r, free){
  free = free || freeCell;
  let moved=false;
  if(free(ent.x+dx, ent.y, r)){ ent.x+=dx; moved=true; }
  if(free(ent.x, ent.y+dy, r)){ ent.y+=dy; moved=true; }
  if(!moved){
    // oba kierunki zablokowane — spróbuj wyślizgu w bok (anty-zakleszczenie)
    const l=Math.hypot(dx,dy)||1e-6, px=-dy/l*l, py=dx/l*l;
    if(free(ent.x+px, ent.y+py, r)){ ent.x+=px; ent.y+=py; moved=true; }
    else if(free(ent.x-px, ent.y-py, r)){ ent.x-=px; ent.y-=py; moved=true; }
  }
  return moved;
}
// zakorzenione drzewa są dla gracza twardą przeszkodą — stąd ich rola taktyczna
function freeForPlayer(x,y,r){
  if(!freeCell(x,y,r)) return false;
  for(const e of enemies){
    if(!e.rooted || e.dying>0) continue;
    const rr = ENEMY_DEF[e.kind].r + r;
    const ox=e.x-x, oy=e.y-y;
    if(ox*ox+oy*oy < rr*rr) return false;
  }
  return true;
}
// kwadrat najmniejszej odległości punktu (px,py) od odcinka a->b
function segDist2(ax,ay,bx,by,px,py){
  const dx=bx-ax, dy=by-ay, l2=dx*dx+dy*dy;
  let t = l2>0 ? ((px-ax)*dx+(py-ay)*dy)/l2 : 0;
  t = t<0?0:t>1?1:t;
  const qx=ax+dx*t-px, qy=ay+dy*t-py;
  return qx*qx+qy*qy;
}
const SHOT_SPD = 6.5, SHOT_G = 1.8, SHOT_Z0 = 0.75;
function fireCone(e, nx, ny, dist, dmg){
  const T = Math.max(0.15, dist/SHOT_SPD);
  const vz = (0.5 - SHOT_Z0)/T + 0.5*SHOT_G*T;   // balistyka celowana w tors
  shots.push({ x:e.x, y:e.y, z:SHOT_Z0, vx:nx*SHOT_SPD, vy:ny*SHOT_SPD, vz, dmg, life:3 });
  SFX.hit();
}
const MAX_PICKUPS = 24, PICKUP_LIFE = 45;
function addPickup(x,y,kind){
  if(pickups.length>=MAX_PICKUPS) pickups.shift();
  pickups.push({ x, y, kind, t:0, life:PICKUP_LIFE });
}
// awaryjne wypchnięcie drzewa, które wlazło w geometrię
function unstick(e,r,dt){
  const cx=(e.x|0)+0.5, cy=(e.y|0)+0.5;
  if(cell(cx,cy)===0){
    const dx=cx-e.x, dy=cy-e.y, l=Math.hypot(dx,dy)||1;
    e.x+=dx/l*2.5*dt; e.y+=dy/l*2.5*dt; return;
  }
  const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
  for(const [ox,oy] of dirs){
    if(cell(cx+ox,cy+oy)===0){ e.x+=ox*2.5*dt; e.y+=oy*2.5*dt; return; }
  }
}
function losClear(x0,y0,x1,y1){
  const dx=x1-x0, dy=y1-y0, d=Math.hypot(dx,dy), steps=Math.ceil(d/0.15);
  for(let i=1;i<steps;i++){
    const t=i/steps;
    if(cell(x0+dx*t, y0+dy*t)!==0) return false;
  }
  return true;
}
function hurtPlayer(dmg){
  if(P.dead || P.iframe>0) return;   // zamach siekierą daje chwilę oddechu
  P.hp -= dmg;
  hurtFlash = Math.min(1, hurtFlash + dmg/45);
  camShake = Math.min(6, camShake + dmg/8);
  SFX.hurt();
  if(P.hp<=0){ P.hp=0; endGame(); }
  updateHUD();
}
function burst(x,y,z,n,col){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, s=0.6+Math.random()*2.4;
    parts.push({ x,y,z:z+Math.random()*0.3,
      vx:Math.cos(a)*s, vy:Math.sin(a)*s, vz:1+Math.random()*2.4,
      life:0.5+Math.random()*0.7, size:0.03+Math.random()*0.05,
      c:(255<<24)|((col[2]+Math.random()*30|0)<<16)|((col[1]+Math.random()*40|0)<<8)|(col[0]+Math.random()*30|0) });
  }
  if(parts.length>420) parts.splice(0, parts.length-420);
}

/* ---------- strzelanie ---------- */
function startReload(){
  P.reloadT = WEAPONS[1].reload;
  P.cd = Math.max(P.cd, P.reloadT);
  SFX.swap();
  updateHUD();
}

function fire(){
  const w=WEAPONS[P.w];

  if(P.w===1){                                  // dubeltówka — magazynek dwulufowy
    if(P.mag<=0){
      if(P.shells>0) startReload(); else { SFX.empty(); P.cd=0.35; }
      return;
    }
    P.mag--;
  } else if(w.ammo!==-1){
    if(P[w.ammo]<=0){ SFX.empty(); P.cd=0.35; return; }
    P[w.ammo]--;
  }
  P.cd=w.cd; P.kickT=1; P.fireT=w.melee?0.32:0.11;

  if(w.melee){
    SFX.axe();
    // trafienie rozwiązuje resolveSwing() po w.swing sekund — w pętli gry
    P.swingT = w.swing;
    P.iframe = Math.max(P.iframe, w.iframe);
    camShake=Math.max(camShake,1.2);
    return;
  }

  // broń palna
  if(P.w===1){ SFX.shotgun(); flashLight=Math.max(flashLight,9); camShake=Math.max(camShake,3.2); P.pitch=clamp(P.pitch+7,-70,70); }
  else       { SFX.chain();   flashLight=Math.max(flashLight,5); camShake=Math.max(camShake,1.1); P.pitch=clamp(P.pitch+1.6,-70,70); }

  for(let i=0;i<w.pellets;i++){
    const a = P.a + (Math.random()*2-1)*w.spread;
    hitscan(a, w.range, w.dmg*(0.85+Math.random()*0.3));
  }

  // po opróżnieniu obu luf przeładuj automatycznie
  if(P.w===1 && P.mag<=0 && P.shells>0) startReload();
  updateHUD();
}

// Siekiera tnie w łuku: dostają WSZYSTKIE drzewa w stożku, sadzonki podwójnie,
// a trafione są odrzucane. Cel szukany w chwili trafienia, nie w chwili zamachu.
function resolveSwing(){
  if(P.dead) return;
  const w=WEAPONS[0];
  let any=false;
  const targets = enemies.slice();   // kopia: matecznik może dosiać sadzonki w trakcie
  for(const e of targets){
    if(e.dying>0) continue;
    const dx=e.x-P.x, dy=e.y-P.y, dist=Math.hypot(dx,dy);
    if(dist > w.range + ENEMY_DEF[e.kind].r) continue;
    if(Math.abs(angDiff(Math.atan2(dy,dx), P.a)) > w.arc) continue;
    let dmg = w.dmg*(0.85+Math.random()*0.3);
    if(e.kind===0) dmg*=2;                       // sadzonki rąbie się jak chrust
    damage(e,dmg);
    if(!e.rooted && e.dying<=0){                 // odrzut — tylko niezakorzenione
      const l=dist||1e-4;
      tryMove(e, dx/l*w.knock, dy/l*w.knock, ENEMY_DEF[e.kind].r);
    }
    any=true;
  }
  if(any){ SFX.chop(); camShake=Math.max(camShake,1.8); }
}

function angDiff(a,b){ let d=a-b; while(d>Math.PI)d-=2*Math.PI; while(d<-Math.PI)d+=2*Math.PI; return d; }

// Odległość do najbliższej ściany wzdłuż promienia (DDA — bez marszu po krokach).
function rayWallDist(ox,oy,dx,dy,maxD){
  let mapX=ox|0, mapY=oy|0;
  const ddx = dx===0?1e30:Math.abs(1/dx);
  const ddy = dy===0?1e30:Math.abs(1/dy);
  let stepX,stepY,sdx,sdy;
  if(dx<0){ stepX=-1; sdx=(ox-mapX)*ddx; } else { stepX=1; sdx=(mapX+1-ox)*ddx; }
  if(dy<0){ stepY=-1; sdy=(oy-mapY)*ddy; } else { stepY=1; sdy=(mapY+1-oy)*ddy; }
  let side=0, guard=0;
  while(guard++<512){
    if(sdx<sdy){ sdx+=ddx; mapX+=stepX; side=0; }
    else       { sdy+=ddy; mapY+=stepY; side=1; }
    const d = side===0 ? sdx-ddx : sdy-ddy;
    if(d>maxD) return maxD;
    if(cell(mapX,mapY)!==0) return d;
  }
  return maxD;
}

// Analityczny promień↔okrąg: jeden test na wroga zamiast ~250 kroków marszu.
// Znika też błąd „kwadratowego" hitboksa i przestrzeliwanie cienkich sadzonek.
function hitscan(a, range, dmg){
  const dx=Math.cos(a), dy=Math.sin(a);
  const wallD = rayWallDist(P.x, P.y, dx, dy, range);

  let hit=null, hitT=wallD;
  for(const e of enemies){
    if(e.dying>0) continue;
    const r = ENEMY_DEF[e.kind].r;
    const ex=e.x-P.x, ey=e.y-P.y;
    const proj = ex*dx + ey*dy;              // rzut środka na promień
    if(proj<=0 || proj-r>=hitT) continue;    // za plecami albo dalej niż aktualne trafienie
    const perp2 = ex*ex+ey*ey - proj*proj;   // kwadrat odległości środka od osi promienia
    if(perp2 > r*r) continue;
    const t = proj - Math.sqrt(r*r - perp2); // wejście w okrąg
    if(t<0 || t>=hitT) continue;
    hitT=t; hit=e;
  }

  if(hit){
    damage(hit,dmg);
    burst(P.x+dx*hitT, P.y+dy*hitT, 0.6+Math.random()*0.7, 5, [90,150,60]);
  } else if(wallD<range){
    burst(P.x+dx*(wallD-0.1), P.y+dy*(wallD-0.1), 0.5+Math.random()*0.5, 4, [110,95,70]);
  }
}
function damage(e,dmg){
  e.hp-=dmg; e.flash=1;
  burst(e.x,e.y,0.7+Math.random()*0.6,4,[80,140,55]);
  if(e.hp<=0 && e.dying<=0){
    const def=ENEMY_DEF[e.kind];
    e.dying=0.65; e.dead=true; e.rooted=false;
    kills++;
    score += def.score * (1 + Math.floor((wave-1)/5));   // późne fale są warte więcej
    SFX.fall();
    burst(e.x,e.y,0.9,26,[70,130,50]);
    burst(e.x,e.y,0.4,10,[110,80,45]);
    // łupy
    const roll=Math.random();
    if(roll<0.16) addPickup(e.x,e.y,0);
    else if(roll<0.40) addPickup(e.x,e.y,1);
    else if(roll<0.56) addPickup(e.x,e.y,2);
    if(e.kind===3){ message('PRADRZEW POWALONY!',2.4);
      addPickup(e.x+0.6,e.y,0);
      addPickup(e.x-0.6,e.y,2); }
    // matecznik pęka i rozsiewa sadzonki
    if(def.splits && enemies.length < 40){
      burst(e.x,e.y,0.8,18,[200,140,175]);
      for(let s=0;s<def.splits;s++){
        const a=Math.random()*Math.PI*2, off=0.5+Math.random()*0.3;
        const sx=e.x+Math.cos(a)*off, sy=e.y+Math.sin(a)*off;
        const sd=ENEMY_DEF[0];
        if(!freeCell(sx,sy,sd.r)) continue;
        enemies.push(makeEnemy(0,sx,sy));
      }
      message('MATECZNIK PĘKŁ — SADZONKI!',1.4);
    }
    updateHUD();
  } else SFX.hit();
}

/* ============================================================
   RENDER
   ============================================================ */
let dirX=1,dirY=0,plX=0,plY=0.66, camShift=0;

function render(){
  const shakeX = camShake>0 ? (Math.random()*2-1)*camShake : 0;
  const shakeY = camShake>0 ? (Math.random()*2-1)*camShake : 0;
  const bob = Math.sin(bobT)*2.2 + Math.abs(Math.cos(bobT))*0.8;
  camShift = P.dead ? P.pitch + 70          // po śmierci kamera opada na ziemię
                    : P.pitch + bob + shakeY;
  const ang = P.a + shakeX*0.002;
  dirX=Math.cos(ang); dirY=Math.sin(ang);
  plX=-dirY*0.66;     plY=dirX*0.66;

  const horizon = (H/2 + camShift)|0;

  drawSky(ang, horizon);
  drawFloor(horizon);
  drawWalls(horizon);

  // sprite'y: wrogowie, pnie, znajdźki, pociski
  const list=[];
  for(const e of enemies){
    const fr = TREES[e.kind][((e.anim|0)%TREE_FRAMES+TREE_FRAMES)%TREE_FRAMES];
    const d=ENEMY_DEF[e.kind];
    let sy=1, sx=1;
    if(e.dying>0){ const t=1-e.dying/0.65; sy=1-t*0.92; sx=1+t*0.45; }
    if(e.rooted){ sy*=0.92; sx*=1.12; }          // wrośnięty: przysiada i rozpiera się
    list.push({ x:e.x, y:e.y, tex:fr, hUnits:d.hUnits*sy, wUnits:d.wUnits*sx, flash:e.flash });
  }
  for(const d of decals) list.push({ x:d.x, y:d.y, tex:STUMP, hUnits:0.30, wUnits:0.45, flash:0 });
  for(const pk of pickups){
    // ostatnie 5 s znajdźka miga — widać, że zaraz zniknie
    if(pk.life<5 && (pk.life*6|0)%2) continue;
    list.push({ x:pk.x, y:pk.y, tex:PICKUP[pk.kind],
      hUnits:0.30, wUnits:0.30, flash:0, zoff:0.10+Math.sin(pk.t*3)*0.05 });
  }
  for(const s of shots) list.push({ x:s.x, y:s.y, tex:CONE, hUnits:0.22, wUnits:0.18, flash:0, zoff:s.z-0.11 });

  for(const s of list) s.d=(s.x-P.x)*(s.x-P.x)+(s.y-P.y)*(s.y-P.y);
  list.sort((a,b)=>b.d-a.d);
  for(const s of list) drawSprite(s);

  drawParticles();

  ctx.putImageData(img,0,0);

  drawWeapon();
  drawOverlayFX();
}

function drawSky(ang, horizon){
  let off = Math.floor(ang/(Math.PI*2)*SKY_W) % SKY_W;
  if(off<0) off+=SKY_W;
  const top = Math.max(0, Math.min(H, horizon));
  for(let y=0;y<top;y++){
    let sy = y - horizon + SKY_HZ;
    if(sy<0) sy=0; else if(sy>=SKY_H) sy=SKY_H-1;
    const srow = sy*SKY_W, drow = y*W;
    for(let x=0;x<W;x++){
      let sx = off + x; if(sx>=SKY_W) sx-=SKY_W;
      buf[drow+x] = sky.data[srow+sx];
    }
  }
}

function drawFloor(horizon){
  const rdx0=dirX-plX, rdy0=dirY-plY;
  const rdx1=dirX+plX, rdy1=dirY+plY;
  const start = Math.max(0, horizon+1);
  const posZ = 0.5*H;
  const gw=GRASS.w, gh=GRASS.h;
  for(let y=start;y<H;y++){
    const p = y-horizon;
    const rowDist = posZ/p;
    if(rowDist>MAXFOG*1.35){
      // za mgłą — jednolity kolor
      const c=(255<<24)|(FOG[2]<<16)|(FOG[1]<<8)|FOG[0];
      buf.fill(c, y*W, y*W+W);
      continue;
    }
    const stepX=rowDist*(rdx1-rdx0)/W, stepY=rowDist*(rdy1-rdy0)/W;
    let fx=P.x+rowDist*rdx0, fy=P.y+rowDist*rdy0;
    let lvl = (rowDist/MAXFOG*31)|0;
    lvl -= flashLight*0.6|0;
    lvl = clamp(lvl,0,31);
    const tex = GRASS.lv[lvl];
    const row=y*W;
    for(let x=0;x<W;x++){
      const tx = ((fx*gw)|0) & (gw-1);
      const ty = ((fy*gh)|0) & (gh-1);
      buf[row+x] = tex[ty*gw+tx];
      fx+=stepX; fy+=stepY;
    }
  }
}

function drawWalls(horizon){
  for(let x=0;x<W;x++){
    const camX = 2*x/W - 1;
    const rdx = dirX + plX*camX, rdy = dirY + plY*camX;
    let mapX=P.x|0, mapY=P.y|0;
    const ddx = rdx===0?1e30:Math.abs(1/rdx);
    const ddy = rdy===0?1e30:Math.abs(1/rdy);
    let stepX,stepY,sdx,sdy;
    if(rdx<0){ stepX=-1; sdx=(P.x-mapX)*ddx; } else { stepX=1; sdx=(mapX+1-P.x)*ddx; }
    if(rdy<0){ stepY=-1; sdy=(P.y-mapY)*ddy; } else { stepY=1; sdy=(mapY+1-P.y)*ddy; }
    let side=0, hit=0, guard=0;
    while(!hit && guard++<256){
      if(sdx<sdy){ sdx+=ddx; mapX+=stepX; side=0; }
      else       { sdy+=ddy; mapY+=stepY; side=1; }
      if(cell(mapX,mapY)!==0) hit=cell(mapX,mapY);
    }
    if(!hit){ zbuf[x]=1e9; continue; }
    const perp = side===0 ? (sdx-ddx) : (sdy-ddy);
    const dist = Math.max(0.05, perp);
    zbuf[x]=dist;

    const lineH = (H/dist)|0;
    let y0 = (-lineH/2 + H/2 + camShift)|0;
    let y1 = ( lineH/2 + H/2 + camShift)|0;
    const drawY0 = Math.max(0,y0), drawY1 = Math.min(H-1,y1);
    if(drawY1<drawY0) continue;

    const tex = TEX[hit];
    let wallX = side===0 ? P.y + dist*rdy : P.x + dist*rdx;
    wallX -= Math.floor(wallX);
    let tx = (wallX*tex.w)|0;
    if(side===0 && rdx>0) tx=tex.w-tx-1;
    if(side===1 && rdy<0) tx=tex.w-tx-1;

    let lvl = (dist/MAXFOG*31)|0;
    if(side===1) lvl+=4;
    lvl -= flashLight|0;
    lvl = clamp(lvl,0,31);
    const t = tex.lv[lvl];

    const stepT = tex.h/lineH;
    let texPos = (drawY0 - camShift - H/2 + lineH/2)*stepT;
    const tw=tex.w, th=tex.h;
    for(let y=drawY0;y<=drawY1;y++){
      const ty = ((texPos|0) & (th-1));
      texPos += stepT;
      buf[y*W+x] = t[ty*tw+tx];
    }
  }
}

function drawSprite(s){
  const sx = s.x-P.x, sy = s.y-P.y;
  const invDet = 1/(plX*dirY - dirX*plY);
  const tX = invDet*(dirY*sx - dirX*sy);
  const tY = invDet*(-plY*sx + plX*sy);
  if(tY<0.12) return;
  const unit = H/tY;
  const scr = ((W/2)*(1+tX/tY))|0;
  const floorY = H/2 + camShift + unit*0.5 - (s.zoff||0)*unit;
  const sh = (unit*s.hUnits)|0;
  const sw = (unit*s.wUnits)|0;
  if(sh<1||sw<1) return;
  const y1 = floorY|0, y0 = y1-sh;
  const x0 = (scr-(sw>>1))|0, x1 = x0+sw;
  const dx0=Math.max(0,x0), dx1=Math.min(W-1,x1-1);
  if(dx1<dx0) return;
  const dy0=Math.max(0,y0), dy1=Math.min(H-1,y1-1);
  if(dy1<dy0) return;

  let lvl = (tY/MAXFOG*(SPR_LV-1))|0;
  lvl -= (flashLight*0.5)|0;
  lvl = clamp(lvl,0,SPR_LV-1);
  const tex = s.tex, t = tex.lv[lvl];
  const tw=tex.w, th=tex.h;
  const flash = s.flash>0.02;

  for(let x=dx0;x<=dx1;x++){
    if(zbuf[x]<=tY) continue;
    const texX = (((x-x0)*tw/sw)|0);
    if(texX<0||texX>=tw) continue;
    for(let y=dy0;y<=dy1;y++){
      const texY = (((y-y0)*th/sh)|0);
      if(texY<0||texY>=th) continue;
      const c = t[texY*tw+texX];
      if(c===0) continue;
      // trafienie: rozjaśnienie z zachowaniem kształtu (średnia z bielą)
      buf[y*W+x] = flash ? (0xFF000000 | (((c>>>1)&0x7F7F7F) + 0x808080)) : c;
    }
  }
}

function drawParticles(){
  const invDet = 1/(plX*dirY - dirX*plY);
  for(const p of parts){
    const sx=p.x-P.x, sy=p.y-P.y;
    const tX = invDet*(dirY*sx - dirX*sy);
    const tY = invDet*(-plY*sx + plX*sy);
    if(tY<0.15) continue;
    const unit=H/tY;
    const scr = ((W/2)*(1+tX/tY))|0;
    const yy  = (H/2 + camShift + unit*0.5 - p.z*unit)|0;
    const sz  = Math.max(1,(p.size*unit)|0);
    const fade = clamp(1-tY/MAXFOG,0,1);
    if(fade<=0.02) continue;
    const c=p.c;
    const r=((c&255)*fade+FOG[0]*(1-fade))|0;
    const g=(((c>>>8)&255)*fade+FOG[1]*(1-fade))|0;
    const b=(((c>>>16)&255)*fade+FOG[2]*(1-fade))|0;
    const col=(255<<24)|(b<<16)|(g<<8)|r;
    for(let x=scr;x<scr+sz;x++){
      if(x<0||x>=W) continue;
      if(zbuf[x]<=tY) continue;
      for(let y=yy;y<yy+sz;y++){
        if(y<0||y>=H) continue;
        buf[y*W+x]=col;
      }
    }
  }
}

/* ---------- broń w rękach ---------- */
function drawWeapon(){
  const bx = Math.sin(bobT)*6, by = Math.abs(Math.cos(bobT))*5;
  const kick = P.kickT*P.kickT;
  ctx.save();
  ctx.translate(W/2 + bx, H + by + kick*18 - (P.dead?-80:0));

  if(P.w===0){                                       // siekiera
    const sw = P.fireT>0 ? (1-P.fireT/0.32) : 0;
    const ang = -0.55 + (P.fireT>0 ? Math.sin(sw*Math.PI)*1.5 : 0);
    ctx.translate(58,-8); ctx.rotate(ang);
    ctx.fillStyle='#5a3c22'; ctx.fillRect(-6,-4,13,110);
    ctx.fillStyle='#3a2614'; ctx.fillRect(-6,-4,4,110);
    ctx.fillStyle='#9aa3ab';
    ctx.beginPath();
    ctx.moveTo(-6,0); ctx.lineTo(-44,-12); ctx.lineTo(-50,16); ctx.lineTo(-6,22);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle='#d7dde3';
    ctx.beginPath(); ctx.moveTo(-40,-11); ctx.lineTo(-50,16); ctx.lineTo(-42,17); ctx.lineTo(-34,-8);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle='#6c7178'; ctx.fillRect(-10,-2,8,22);
    ctx.fillStyle='rgba(90,170,60,.5)';
    ctx.fillRect(-38,4,6,3); ctx.fillRect(-30,12,5,3);
  } else if(P.w===1){                                // dubeltówka
    ctx.translate(0,-2);
    const rec = kick*14;
    ctx.translate(0,rec);
    // przeładowanie: broń opada i łamie się w zawiasie
    if(P.reloadT>0){
      const rt = 1 - P.reloadT/WEAPONS[1].reload;      // 0 → 1
      const swing = Math.sin(rt*Math.PI);              // w dół i z powrotem
      ctx.translate(10*swing, 30*swing);
      ctx.rotate(-0.55*swing);
      if(swing>0.55){                                  // wyrzucone łuski
        ctx.fillStyle='#c9a24a';
        ctx.fillRect(-20,-96-(swing-0.55)*70, 7, 14);
        ctx.fillRect(8, -96-(swing-0.55)*58, 7, 14);
      }
    }
    ctx.fillStyle='#2a2d31';
    ctx.fillRect(-26,-88,20,88); ctx.fillRect(2,-88,20,88);
    ctx.fillStyle='#3d4247'; ctx.fillRect(-26,-88,20,4); ctx.fillRect(2,-88,20,4);
    ctx.fillStyle='#14161a'; ctx.fillRect(-22,-86,12,84); ctx.fillRect(6,-86,12,84);
    ctx.fillStyle='#5a3c22';
    ctx.beginPath(); ctx.moveTo(-34,4); ctx.lineTo(30,4); ctx.lineTo(46,64); ctx.lineTo(-48,64);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle='#77502e'; ctx.fillRect(-30,6,58,10);
    ctx.fillStyle='#1b1d20'; ctx.fillRect(-8,-6,16,14);
    if(P.fireT>0.02){
      const f=P.fireT/0.11;
      ctx.globalAlpha=f;
      const grd=ctx.createRadialGradient(-16,-92,2,-16,-92,34);
      grd.addColorStop(0,'#fff7d0'); grd.addColorStop(.4,'#ffc44a'); grd.addColorStop(1,'rgba(255,120,20,0)');
      ctx.fillStyle=grd; ctx.beginPath(); ctx.arc(-16,-92,34,0,7); ctx.fill();
      const grd2=ctx.createRadialGradient(12,-92,2,12,-92,30);
      grd2.addColorStop(0,'#fff7d0'); grd2.addColorStop(.4,'#ffc44a'); grd2.addColorStop(1,'rgba(255,120,20,0)');
      ctx.fillStyle=grd2; ctx.beginPath(); ctx.arc(12,-92,30,0,7); ctx.fill();
      ctx.globalAlpha=1;
    }
  } else {                                           // kosiarka (szybkostrzelna)
    ctx.translate(4,0);
    const rec=kick*8;
    ctx.translate(Math.sin(P.fireT*90)*2, rec);
    const spin = (bobT*3 + (P.fireT>0? performance.now()/40:0));
    ctx.fillStyle='#2b2f33'; ctx.fillRect(-30,-70,60,70);
    for(let i=0;i<4;i++){
      const a=spin + i*Math.PI/2;
      const ox=Math.cos(a)*11, sc=0.6+Math.sin(a)*0.4;
      ctx.fillStyle=`rgb(${(40+sc*70)|0},${(44+sc*70)|0},${(50+sc*70)|0})`;
      ctx.fillRect(-4+ox,-104,9,44);
    }
    ctx.fillStyle='#1a1d20'; ctx.fillRect(-32,-64,64,10);
    ctx.fillStyle='#3d4247'; ctx.fillRect(-34,-58,68,8);
    ctx.fillStyle='#4a3a22'; ctx.fillRect(-14,-2,28,44);
    ctx.fillStyle='#22262a'; ctx.fillRect(-40,-46,16,34); ctx.fillRect(24,-46,16,34);
    if(P.fireT>0.01){
      ctx.globalAlpha=P.fireT/0.11;
      const grd=ctx.createRadialGradient(0,-106,2,0,-106,26);
      grd.addColorStop(0,'#fffbe0'); grd.addColorStop(.35,'#ffd45a'); grd.addColorStop(1,'rgba(255,120,20,0)');
      ctx.fillStyle=grd; ctx.beginPath(); ctx.arc(0,-106,26,0,7); ctx.fill();
      ctx.globalAlpha=1;
    }
  }
  ctx.restore();
}

function drawOverlayFX(){
  // celownik
  if(!P.dead){
    ctx.fillStyle='rgba(190,255,170,.75)';
    const cxp=W/2|0, cyp=(H/2+P.pitch*0.35)|0;
    ctx.fillRect(cxp-5,cyp,3,1); ctx.fillRect(cxp+3,cyp,3,1);
    ctx.fillRect(cxp,cyp-5,1,3); ctx.fillRect(cxp,cyp+3,1,3);
    ctx.fillStyle='rgba(190,255,170,.35)'; ctx.fillRect(cxp,cyp,1,1);
  }
  // czerwony błysk obrażeń
  if(hurtFlash>0.01){
    ctx.fillStyle=`rgba(150,20,15,${Math.min(0.6,hurtFlash*0.5)})`;
    ctx.fillRect(0,0,W,H);
  }
  // winieta
  if(!vign) buildVignette();
  ctx.drawImage(vign,0,0);
  // wygaszenie przy przejściu do nowego lasu
  if(levelFade>0.005){
    ctx.fillStyle=`rgba(0,0,0,${Math.min(1,levelFade)})`;
    ctx.fillRect(0,0,W,H);
  }
  // niski stan zdrowia — pulsowanie
  if(P.hp<35 && !P.dead){
    const a = (Math.sin(performance.now()/180)*0.5+0.5)*0.18*(1-P.hp/35);
    ctx.fillStyle=`rgba(160,20,20,${a})`; ctx.fillRect(0,0,W,H);
  }
}
let vign=null;
function buildVignette(){
  vign=makeCanvas(W,H); const g=vign.getContext('2d');
  const grd=g.createRadialGradient(W/2,H/2,H*0.35,W/2,H/2,H*0.85);
  grd.addColorStop(0,'rgba(0,0,0,0)'); grd.addColorStop(1,'rgba(0,0,0,.65)');
  g.fillStyle=grd; g.fillRect(0,0,W,H);
}

/* ---------- minimapa ---------- */
function drawMini(){
  const S=72, R=9;                     // promień widoczności w kratkach
  mctx.clearRect(0,0,S,S);
  mctx.fillStyle='rgba(4,10,6,.55)'; mctx.fillRect(0,0,S,S);
  const sc=S/(R*2);
  const ox=P.x, oy=P.y;
  for(let gy=Math.floor(oy-R); gy<=oy+R; gy++){
    for(let gx=Math.floor(ox-R); gx<=ox+R; gx++){
      const c=cell(gx,gy);
      if(!c) continue;
      const sx=(gx-ox+R)*sc, sy=(gy-oy+R)*sc;
      mctx.fillStyle = biome.mini[c-1] || biome.mini[0];
      mctx.fillRect(sx,sy,sc+0.6,sc+0.6);
    }
  }
  for(const d of decals){
    const sx=(d.x-ox+R)*sc, sy=(d.y-oy+R)*sc;
    if(sx<0||sy<0||sx>S||sy>S) continue;
    mctx.fillStyle='rgba(120,90,60,.7)'; mctx.fillRect(sx-1,sy-1,2,2);
  }
  for(const pk of pickups){
    const sx=(pk.x-ox+R)*sc, sy=(pk.y-oy+R)*sc;
    if(sx<0||sy<0||sx>S||sy>S) continue;
    mctx.fillStyle = pk.kind===0?'#7fe06a':'#e0c14a'; mctx.fillRect(sx-1.5,sy-1.5,3,3);
  }
  let widoczny=false;
  for(const e of enemies){
    if(e.dying>0) continue;
    const sx=(e.x-ox+R)*sc, sy=(e.y-oy+R)*sc;
    if(sx<0||sy<0||sx>S||sy>S) continue;
    widoczny=true;
    mctx.fillStyle = ['#ff8a3b','#ff8a3b','#5bd0ff','#ff3b3b','#ffb02e','#ff6ab0','#e8e8e8'][e.kind];
    const r = e.kind===3?3:(e.kind===4&&e.rooted)?3:2;
    mctx.fillRect(sx-r/2,sy-r/2,r,r);
  }
  // żaden wróg nie mieści się na minimapie — pokaż kierunek do najbliższego,
  // żeby ostatnie drzewa fali nie zmuszały do ślepego przeczesywania mapy
  if(!widoczny){
    let near=null, nd=1e9;
    for(const e of enemies){
      if(e.dying>0) continue;
      const d=(e.x-ox)*(e.x-ox)+(e.y-oy)*(e.y-oy);
      if(d<nd){ nd=d; near=e; }
    }
    if(near){
      const a=Math.atan2(near.y-oy, near.x-ox);
      const rad=S/2-8;
      mctx.save();
      mctx.translate(S/2+Math.cos(a)*rad, S/2+Math.sin(a)*rad);
      mctx.rotate(a);
      // dolny próg 0.44 — puls ma przyciągać wzrok, a nie gasić strzałkę
      mctx.globalAlpha = 0.72 + 0.28*Math.sin(performance.now()/220);
      mctx.fillStyle = near.kind===3 ? '#ff3b3b' : '#ffb02e';
      mctx.beginPath();
      mctx.moveTo(7,0); mctx.lineTo(-4,4.5); mctx.lineTo(-4,-4.5);
      mctx.closePath(); mctx.fill();
      mctx.restore();
    }
  }
  // gracz
  mctx.save(); mctx.translate(S/2,S/2); mctx.rotate(P.a);
  mctx.fillStyle='#dff3cf';
  mctx.beginPath(); mctx.moveTo(5,0); mctx.lineTo(-3,3); mctx.lineTo(-3,-3); mctx.closePath(); mctx.fill();
  mctx.restore();
}

/* ---------- HUD ---------- */
const el = {
  wave:document.getElementById('wave'), left:document.getElementById('left'),
  kills:document.getElementById('kills'), hpnum:document.getElementById('hpnum'),
  hpbar:document.getElementById('hpbar'), wepname:document.getElementById('wepname'),
  ammo:document.getElementById('ammo'), weplist:document.getElementById('weplist'),
  score:document.getElementById('score'), best:document.getElementById('best'),
  biome:document.getElementById('biome'),
};
function updateHUD(){
  el.biome.textContent = `L${level} ${biome.name}`;
  el.wave.textContent = wave||1;
  el.left.textContent = enemies.filter(e=>e.dying<=0).length + waveQueue.length;
  el.kills.textContent = kills;
  el.score.textContent = score|0;
  el.best.textContent = best.score|0;
  el.hpnum.textContent = Math.ceil(P.hp);
  el.hpbar.style.width = clamp(P.hp/P.maxhp*100,0,100)+'%';
  el.hpbar.className = P.hp<35 ? 'low' : '';
  const w=WEAPONS[P.w];
  el.wepname.textContent = P.w===1 && P.reloadT>0 ? 'ŁADOWANIE…' : w.name;
  el.ammo.textContent = w.ammo===-1 ? '∞'
                      : P.w===1     ? `${P.mag}/${P.shells}`
                                    : P[w.ammo];
  el.weplist.innerHTML = [0,1,2].map(i=>`<span class="${i===P.w?'on':''}">${i+1}</span>`).join(' ');
}

/* ---------- skalowanie okna ---------- */
function fit(){
  const app=document.getElementById('app');
  const vw=innerWidth, vh=innerHeight;
  const s = Math.max(1, Math.min(vw/W, vh/H));
  app.style.width = Math.floor(W*s)+'px';
  app.style.height= Math.floor(H*s)+'px';
  document.documentElement.style.setProperty('--s', (s*0.95).toFixed(3));
  document.body.style.display='flex';
}
addEventListener('resize',fit);
fit();

reset();
updateHUD();
showTitle();
render();
</script>
