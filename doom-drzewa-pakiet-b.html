<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DRZEWODOOM — Las Cię dopadnie (Pakiet B: światło i cienie)</title>
<style>
  :root{ --s: 3; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; background:#05070a; overflow:hidden;
    font-family:"Consolas","Courier New",monospace; color:#cfe3c4; }
  #app{ position:relative; margin:auto; background:#000; overflow:hidden;
        box-shadow:0 0 calc(20px*var(--s)) rgba(0,0,0,.9); }
  canvas#cv{ display:block; width:100%; height:100%; image-rendering:pixelated;
             image-rendering:crisp-edges; }
  #ui{ position:absolute; inset:0; pointer-events:none;
       font-size:calc(7px*var(--s)); line-height:1.3; letter-spacing:.06em;
       text-shadow:0 calc(1px*var(--s)) 0 #000, 0 0 calc(4px*var(--s)) rgba(0,0,0,.9); }

  #topbar{ position:absolute; top:calc(5px*var(--s)); left:calc(6px*var(--s));
           right:calc(6px*var(--s)); display:flex; justify-content:space-between;
           color:#9bbf86; font-size:calc(6px*var(--s)); }
  #topbar b{ color:#e8d27a; }

  #msg{ position:absolute; left:0; right:0; top:34%; text-align:center;
        color:#ffe9a8; font-size:calc(9px*var(--s)); opacity:0; transition:opacity .25s; }
  #msg.show{ opacity:1; }

  #bottom{ position:absolute; left:calc(6px*var(--s)); right:calc(6px*var(--s));
           bottom:calc(5px*var(--s)); display:flex; align-items:flex-end;
           justify-content:space-between; gap:calc(8px*var(--s)); }
  .blk{ background:rgba(6,12,8,.55); border:calc(1px*var(--s)) solid #1e3324;
        padding:calc(3px*var(--s)) calc(5px*var(--s)); }
  .lbl{ font-size:calc(5px*var(--s)); color:#6f8f61; }
  .big{ font-size:calc(11px*var(--s)); color:#e6f0dc; }
  .bar{ width:calc(60px*var(--s)); height:calc(5px*var(--s)); background:#132015;
        border:calc(1px*var(--s)) solid #2b4630; margin-top:calc(2px*var(--s)); }
  .bar > i{ display:block; height:100%; background:linear-gradient(#8fd46a,#3f8a35); width:100%; }
  #hpbar.low{ background:linear-gradient(#ff8a5a,#c22b2b); }
  .sbar{ height:calc(3px*var(--s)); }
  .sbar > i{ background:linear-gradient(#8ad8ff,#2f7fae); }
  .sbar.out > i{ background:linear-gradient(#ff9a5a,#b84a2a); }
  #bossbar{ position:absolute; top:calc(16px*var(--s)); left:50%;
            transform:translateX(-50%); text-align:center; }
  #bossbar.hide{ display:none; }
  #bossname{ font-size:calc(5px*var(--s)); color:#ff8a72; letter-spacing:.18em; }
  .bbar{ width:calc(88px*var(--s)); height:calc(4px*var(--s)); }
  .bbar > i{ background:linear-gradient(#ff6a4a,#8d1f14); }
  /* ---------- leśne akcenty: pnącza rysowane pod kolory biomu ----------
     Grafika powstaje w makeVineCorner() i wjeżdża tu zmiennymi --vine/--vine-big,
     dlatego przy zmianie lasu pnącza same zmieniają odcień. */
  /* #bossbar jest już absolutny (sam jest kontekstem dla swoich pnączy) */
  .blk, #minibox, #optrows{ position:relative; }
  .blk::before, .blk::after,
  #minibox::before, #minibox::after,
  #optrows::before, #optrows::after{
    content:''; position:absolute; pointer-events:none;
    width:calc(13px*var(--s)); height:calc(13px*var(--s));
    background:var(--vine) no-repeat center/100% 100%;
    image-rendering:pixelated; opacity:.9; }
  .blk::before, #minibox::before, #optrows::before{
    left:calc(-3px*var(--s)); top:calc(-3px*var(--s)); }
  .blk::after, #minibox::after, #optrows::after{
    right:calc(-3px*var(--s)); bottom:calc(-3px*var(--s)); transform:rotate(180deg); }
  #optrows::before, #optrows::after{ opacity:.75; }
  /* pasek bossa dostaje pnącza po bokach, żeby nie zasłaniać samego paska */
  #bossbar::before, #bossbar::after{
    content:''; position:absolute; pointer-events:none;
    top:50%; margin-top:calc(-5px*var(--s));
    width:calc(11px*var(--s)); height:calc(11px*var(--s));
    background:var(--vine) no-repeat center/100% 100%;
    image-rendering:pixelated; opacity:.8; }
  #bossbar::before{ left:calc(-14px*var(--s)); transform:rotate(-90deg); }
  #bossbar::after{ right:calc(-14px*var(--s)); transform:rotate(90deg); }
  /* pnącza zwisające z górnych narożników ekranu — rama lasu wokół obrazu */
  #frame{ position:absolute; inset:0; pointer-events:none; }
  #frame::before, #frame::after{
    content:''; position:absolute; top:calc(13px*var(--s));
    width:calc(48px*var(--s)); height:calc(48px*var(--s));
    background:var(--vine-big) no-repeat center/100% 100%;
    image-rendering:pixelated; opacity:.5; }
  #frame::before{ left:0; }
  #frame::after{ right:0; transform:scaleX(-1); }
  #minibox{ line-height:0; align-self:flex-end; }

  /* lewa kolumna HUD: broń u góry, pod nią zdrowie i kondycja */
  #sidehud{ display:flex; flex-direction:column; align-items:flex-start;
            gap:calc(3px*var(--s)); text-align:left; }
  #sidehud .bar{ margin-right:auto; }   /* paski trzymają się lewej krawędzi */
  #wepbox{ text-align:left; }
  #weplist{ font-size:calc(5px*var(--s)); color:#5d7a52; margin-top:calc(2px*var(--s)); }
  #weplist span.on{ color:#ffe07a; }

  /* minimapa siedzi w prawym dolnym narożniku, jako ostatni element #bottom */
  #mini{ display:block; align-self:flex-end;
         width:calc(64px*var(--s)); height:calc(64px*var(--s));
         image-rendering:pixelated; opacity:.8;
         border:calc(1px*var(--s)) solid #1e3324; background:rgba(4,9,6,.5); }

  #overlay{ position:absolute; inset:0; display:flex; flex-direction:column;
            align-items:center; justify-content:center; gap:calc(4px*var(--s));
            background:radial-gradient(circle at 50% 45%, rgba(10,20,12,.82), rgba(0,0,0,.95));
            text-align:center; padding:calc(10px*var(--s)); cursor:pointer; }
  #overlay.hidden{ display:none; }
  #overlay h1{ font-size:calc(22px*var(--s)); letter-spacing:.14em; color:#8fd46a;
               text-shadow:0 calc(2px*var(--s)) 0 #14240f, 0 0 calc(14px*var(--s)) #2f6b22; }
  #overlay h2{ font-size:calc(10px*var(--s)); color:#e6c05a; font-weight:normal; }
  #overlay p{ font-size:calc(6px*var(--s)); color:#9bbf86; max-width:calc(200px*var(--s)); }
  #overlay .keys{ font-size:calc(6px*var(--s)); color:#7fa06d; line-height:1.9; }
  #overlay .keys b{ color:#e6f0dc; }
  #overlay .go{ margin-top:calc(6px*var(--s)); font-size:calc(8px*var(--s)); color:#fff;
                animation:blink 1.1s steps(2) infinite; }
  @keyframes blink{ 50%{ opacity:.25 } }
  #stats{ font-size:calc(7px*var(--s)); color:#cfe3c4; line-height:1.8; }
  #optrows{ display:flex; flex-direction:column; gap:calc(2px*var(--s));
            margin-top:calc(3px*var(--s)); }
  .optrow{ display:flex; align-items:center; justify-content:space-between;
           gap:calc(4px*var(--s)); font-size:calc(6px*var(--s)); color:#9bbf86;
           background:rgba(6,12,8,.55); border:calc(1px*var(--s)) solid #1e3324;
           padding:calc(2px*var(--s)) calc(4px*var(--s)); min-width:calc(168px*var(--s)); }
  .optrow b{ color:#e6f0dc; min-width:calc(52px*var(--s)); text-align:center; }
  .optbtn{ cursor:pointer; color:#ffe07a; padding:0 calc(3px*var(--s)); }
  .optbtn:hover{ color:#fff; }
  #overlay .link{ cursor:pointer; color:#ffe07a; text-decoration:underline;
                  font-size:calc(6px*var(--s)); margin-top:calc(3px*var(--s)); }
</style>
</head>
<body>
<div id="app">
  <canvas id="cv" width="480" height="270"></canvas>
  <div id="ui">
    <div id="frame"></div>
    <div id="topbar">
      <div><b id="biome">NOCNY BÓR</b> &nbsp;·&nbsp; FALA <b id="wave">1</b> &nbsp;·&nbsp; ZOSTAŁO <b id="left">0</b></div>
      <div>ŚCIĘTE <b id="kills">0</b> &nbsp;·&nbsp; PKT <b id="score">0</b> &nbsp;·&nbsp; REKORD <b id="best">0</b></div>
    </div>
    <div id="bossbar" class="hide">
      <div id="bossname">PRADRZEW</div>
      <div class="bar bbar"><i id="bosshp"></i></div>
    </div>
    <div id="msg"></div>
    <div id="bottom">
      <div id="sidehud">
        <div class="blk" id="wepbox">
          <div class="lbl" id="wepname">SIEKIERA</div>
          <div class="big" id="ammo">∞</div>
          <div id="weplist"><span class="on">1</span> <span>2</span> <span>3</span> <span>4</span></div>
        </div>
        <div class="blk">
          <div class="lbl">ZDROWIE</div>
          <div class="big" id="hpnum">100</div>
          <div class="bar"><i id="hpbar"></i></div>
          <div class="lbl" style="margin-top:calc(3px*var(--s))">KONDYCJA</div>
          <div class="bar sbar"><i id="stambar"></i></div>
        </div>
      </div>
      <div id="minibox"><canvas id="mini" width="72" height="72"></canvas></div>
    </div>
  </div>
  <div id="overlay"></div>
</div>

<script>
"use strict";
/* ============================================================
   DRZEWODOOM — raycasterowy klon Dooma, w którym gonią Cię drzewa
   Jeden plik, zero zależności.
   ============================================================ */

/* ---------- opcje gracza (czułość, FOV, rozdzielczość, głośność) ---------- */
function clampNum(v,a,b,d){ v=+v; return isFinite(v) ? (v<a?a:v>b?b:v) : d; }
const RES = [[320,180],[480,270],[640,360]];
const OPT_KEY = 'drzewodoom.opt';
let opt = { sens:1, fov:1, res:1, vol:0.5 };
try{
  const raw = localStorage.getItem(OPT_KEY);
  if(raw){ const o=JSON.parse(raw)||{};
    opt = { sens:clampNum(o.sens,0.3,2.5,1), fov:clampNum(o.fov,0.8,1.4,1),
            res:Math.min(RES.length-1, Math.max(0, o.res|0)), vol:clampNum(o.vol,0,1,0.5) }; }
}catch(err){ /* prywatne okno — gramy na domyślnych */ }
function saveOpt(){ try{ localStorage.setItem(OPT_KEY, JSON.stringify(opt)); }catch(err){} }

let W = RES[opt.res][0], H = RES[opt.res][1];
let PLANE = 0.66*opt.fov;                    // połowa szerokości płaszczyzny rzutu
const cv  = document.getElementById('cv');
const ctx = cv.getContext('2d', { alpha:false });

// Bufory zależą od rozdzielczości, więc są zmienne i przydzielane od nowa
// przy każdej zmianie w opcjach (applyRes()).
let img, buf, zbuf, vign=null;
function allocBuffers(){
  cv.width = W; cv.height = H;
  ctx.imageSmoothingEnabled = false;
  img  = ctx.createImageData(W, H);
  buf  = new Uint32Array(img.data.buffer);
  zbuf = new Float32Array(W);
  vign = null;                               // winieta ma rozmiar ekranu
}
allocBuffers();

const mini = document.getElementById('mini');
const mctx = mini.getContext('2d');

// Mgła i jej zasięg zmieniają się wraz z biomem, a kolor mgły jest wpalany
// w poziomy przyciemnienia tekstur — dlatego przy zmianie poziomu przebudowujemy
// cały zestaw grafik (patrz rebuildArt()).
let MAXFOG = 13.5;                   // dystans całkowitego zaniku we mgle
let FOG = [10, 15, 22];              // kolor mgły

/* ---------- narzędzia ---------- */
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0;
  let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t;
  return ((t^t>>>14)>>>0)/4294967296; }; }
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp =(a,b,t)=>a+(b-a)*t;

/* ============================================================
   MAPA
   ============================================================ */
const RAW = [
 "################################",
 "#..............................#",
 "#..BBB......MMM.........BB.....#",
 "#..B..........M.........BB.....#",
 "#..B.......B..M................#",
 "#..........B..........MMMM.....#",
 "#....MM....B..........M..M.....#",
 "#....MM...............M..M.....#",
 "#..............BBB.............#",
 "#....B...........B......BB.....#",
 "#....B...........B......BB.....#",
 "#....B.........................#",
 "#..........MMMM.....B..........#",
 "#..........M..M.....B..........#",
 "#..BB......M..M.....B......M...#",
 "#..BB......................M...#",
 "#..........................M...#",
 "#.....MMM......BB..............#",
 "#.......M......BB.......BBB....#",
 "#.......M.................B....#",
 "#.........B...............B....#",
 "#....B....B....MM..............#",
 "#....B.........MM.....B..B.....#",
 "#....B................B..B.....#",
 "#.............BB...............#",
 "#....MMMM.....BB......MM.......#",
 "#.......M.............MM.......#",
 "#.......M......................#",
 "#..BB.......B........BBB.......#",
 "#..BB.......B..................#",
 "#..............................#",
 "################################",
];
let map = [], MW = 0, MH = 0;
const cell = (x,y)=> (x<0||y<0||x>=MW||y>=MH) ? 1 : map[y|0][x|0];

function applyMap(g){ map = g.m; MW = g.w; MH = g.h; }

// Poziom 1 to ręcznie ułożona mapa z RAW — znajomy start przed proceduralnymi.
function mapFromRAW(){
  const h = RAW.length, w = Math.max(...RAW.map(r=>r.length));
  const m = [];
  for(let y=0;y<h;y++){
    const row = new Uint8Array(w);
    for(let x=0;x<w;x++){
      const c = RAW[y][x] || '.';
      let v = 0;
      if(c==='#') v=1; else if(c==='B') v=2; else if(c==='M') v=3;
      if(x===0||y===0||x===w-1||y===h-1) v=1;   // zawsze domknięta granica
      row[x]=v;
    }
    m.push(row);
  }
  return { m, w, h };
}

/* ---------- generator map ---------- */
// Rozrzuca kępy w duchu ręcznej mapy: bloki, żywopłoty, puste w środku
// kwadraty i pojedyncze drzewa. Gęstość rośnie z poziomem.
function genMap(seed, level){
  const rnd = mulberry32(seed);
  const w = 32 + (rnd()*7|0), h = 32 + (rnd()*7|0);
  const m = [];
  for(let y=0;y<h;y++) m.push(new Uint8Array(w));
  for(let x=0;x<w;x++){ m[0][x]=1; m[h-1][x]=1; }
  for(let y=0;y<h;y++){ m[y][0]=1; m[y][w-1]=1; }
  const set=(x,y,v)=>{ if(x>0&&y>0&&x<w-1&&y<h-1) m[y][x]=v; };

  const density = Math.min(0.115, 0.060 + (level-1)*0.006);
  const clumps  = Math.round(w*h*density/3);
  for(let i=0;i<clumps;i++){
    const x = 1+(rnd()*(w-2)|0), y = 1+(rnd()*(h-2)|0);
    const mat = rnd()<0.55 ? 2 : (rnd()<0.55 ? 1 : 3);
    const shape = rnd();
    if(shape<0.28){                       // zwarty blok
      const bw=1+(rnd()*3|0), bh=1+(rnd()*3|0);
      for(let a=0;a<bw;a++) for(let b=0;b<bh;b++) set(x+a,y+b,mat);
    } else if(shape<0.55){                // żywopłot
      const len=2+(rnd()*5|0), hor=rnd()<0.5;
      for(let a=0;a<len;a++) set(x+(hor?a:0), y+(hor?0:a), mat);
    } else if(shape<0.78){                // pusty w środku kwadrat — jak MMMM w oryginale
      const s=3+(rnd()*2|0);
      for(let a=0;a<s;a++){ set(x+a,y,mat); set(x+a,y+s-1,mat); set(x,y+a,mat); set(x+s-1,y+a,mat); }
    } else {                              // kępa
      set(x,y,mat);
      if(rnd()<0.5) set(x+1,y,mat);
      if(rnd()<0.5) set(x,y+1,mat);
      if(rnd()<0.25) set(x+1,y+1,mat);
    }
  }
  return { m, w, h };
}

// Zamurowuje wszystkie obszary poza największym spójnym — inaczej wrogowie
// zespawnowani w odciętej kieszeni nigdy nie dojdą i fala nigdy się nie skończy.
// Sąsiedztwo 4-kierunkowe, bo tryMove przesuwa się osobno po osiach:
// przejście „po skosie" nie istnieje.
function largestRegion(m,w,h){
  const seen = new Uint8Array(w*h);
  const regions = [];
  let bestSize = 0, best = null;
  const stack = [];
  for(let y=1;y<h-1;y++) for(let x=1;x<w-1;x++){
    if(m[y][x]!==0 || seen[y*w+x]) continue;
    stack.length=0; stack.push(x,y); seen[y*w+x]=1;
    const reg=[];
    while(stack.length){
      const cy=stack.pop(), cx=stack.pop();
      reg.push(cy*w+cx);
      if(cx>1     && m[cy][cx-1]===0 && !seen[cy*w+cx-1]){ seen[cy*w+cx-1]=1; stack.push(cx-1,cy); }
      if(cx<w-2   && m[cy][cx+1]===0 && !seen[cy*w+cx+1]){ seen[cy*w+cx+1]=1; stack.push(cx+1,cy); }
      if(cy>1     && m[cy-1][cx]===0 && !seen[(cy-1)*w+cx]){ seen[(cy-1)*w+cx]=1; stack.push(cx,cy-1); }
      if(cy<h-2   && m[cy+1][cx]===0 && !seen[(cy+1)*w+cx]){ seen[(cy+1)*w+cx]=1; stack.push(cx,cy+1); }
    }
    regions.push(reg);
    if(reg.length>bestSize){ bestSize=reg.length; best=reg; }
  }
  for(const reg of regions){
    if(reg===best) continue;
    for(const idx of reg) m[(idx/w)|0][idx%w] = 1;
  }
  return bestSize;
}

// Powtarza losowanie, aż mapa jest dość otwarta i ma choć jedną polanę 3x3
// (findOpenSpot potrzebuje jej na punkt startowy gracza).
function buildMap(seed, level){
  for(let attempt=0; attempt<60; attempt++){
    const g = genMap(seed + attempt*7919, level);
    const open = largestRegion(g.m, g.w, g.h);
    if(open < g.w*g.h*0.42) continue;
    let has3=false;
    for(let y=2;y<g.h-2 && !has3;y++){
      for(let x=2;x<g.w-2;x++){
        let ok=true;
        for(let oy=-1;oy<=1 && ok;oy++) for(let ox=-1;ox<=1;ox++)
          if(g.m[y+oy][x+ox]!==0){ ok=false; break; }
        if(ok){ has3=true; break; }
      }
    }
    if(has3) return g;
  }
  return mapFromRAW();          // awaryjnie: znana, na pewno grywalna mapa
}


/* ============================================================
   ŚWIATŁO  (Pakiet B)

   Mgła zostaje tam, gdzie była: jednowymiarowy LUT wpalony w tekstury,
   jeden odczyt na piksel. Światło dokłada się JAKO MNOŻENIE RGB po wyjściu
   z LUT-a — i liczy się raz na kolumnę ściany, raz na 8 pikseli podłogi
   i raz na sprite, nigdy na piksel. To ok. 2 500 wyliczeń na klatkę
   zamiast 130 000.
   ============================================================ */
let LM = null;                 // Float32Array, 3 kanały na komórkę, 1.0 = neutralnie
const LT = [0,0,0];            // bufor roboczy, żeby nie alokować w pętli

/* ---------- B2: statyczna lightmapa poziomu ---------- */
function buildLightmap(B, seed){
  LM = new Float32Array(MW*MH*3);
  const rnd = mulberry32(seed);

  // 1. otwartość: ile nieba widzi komórka. Ważone jądro 7x7 to tania,
  //    ale zaskakująco przekonująca aproksymacja sky occlusion.
  const amb = new Float32Array(MW*MH);
  for(let y=0;y<MH;y++) for(let x=0;x<MW;x++){
    if(cell(x,y)!==0) continue;
    let open=0, tot=0;
    for(let dy=-3;dy<=3;dy++) for(let dx=-3;dx<=3;dx++){
      const w=1/(1+dx*dx+dy*dy);
      tot+=w; if(cell(x+dx,y+dy)===0) open+=w;
    }
    amb[y*MW+x]=open/tot;
  }

  // 2. ambient nieba — kolor z biomu, siła z otwartości.
  //    Komórki ścian też dostają wpis (amb=0 -> ambientMin), żeby dwuliniowe
  //    próbkowanie podłogi przy ścianie nie wpadało w czerń.
  const A=B.ambient, lo=B.ambientMin;
  for(let i=0;i<MW*MH;i++){
    const k = lo + (1-lo)*amb[i];
    LM[i*3]=A[0]*k; LM[i*3+1]=A[1]*k; LM[i*3+2]=A[2]*k;
  }

  // 3. źródła statyczne w losowych otwartych komórkach
  for(let i=0,put=0; i<400 && put<B.lights; i++){
    const x=1+(rnd()*(MW-2)|0), y=1+(rnd()*(MH-2)|0);
    if(cell(x,y)!==0) continue;
    if(amb[y*MW+x] > 0.75) continue;      // światła mają sens w gąszczu, nie na polanie
    addStaticLight(x+0.5, y+0.5, B.lightCol, B.lightRad);
    put++;
  }
}

function addStaticLight(lx,ly,col,rad){
  const x0=Math.max(0,(lx-rad)|0), x1=Math.min(MW-1,(lx+rad)|0);
  const y0=Math.max(0,(ly-rad)|0), y1=Math.min(MH-1,(ly+rad)|0);
  for(let cy=y0;cy<=y1;cy++) for(let cx=x0;cx<=x1;cx++){
    const d=Math.hypot(cx+0.5-lx, cy+0.5-ly);
    if(d>rad) continue;
    // ściany też rozświetlamy — inaczej kałuża światła urywa się na krawędzi
    if(cell(cx,cy)===0 && !losClear(lx,ly,cx+0.5,cy+0.5)) continue;
    const f=(1-d/rad)*(1-d/rad);
    const i=(cy*MW+cx)*3;
    LM[i]+=col[0]*f; LM[i+1]+=col[1]*f; LM[i+2]+=col[2]*f;
  }
}

/* ---------- B4: światła dynamiczne ---------- */
const DL=[];                   // lista aktywnych źródeł
const MAXDL=10;
function addLight(x,y,col,rad,life){
  if(DL.length>=MAXDL){
    // wyrzucamy NAJSŁABSZE, nie najstarsze: inaczej trzy lecące szyszki
    // potrafią zjeść błysk wystrzału, który jest tu najważniejszy
    let wi=0, wv=1e9;
    for(let i=0;i<DL.length;i++){
      const v=DL[i].rad*DL[i].t;
      if(v<wv){ wv=v; wi=i; }
    }
    DL.splice(wi,1);
  }
  DL.push({x,y,c:col,rad,t:life,life});
}
function updateLights(dt){
  for(let i=DL.length-1;i>=0;i--){
    DL[i].t-=dt;
    if(DL[i].t<=0) DL.splice(i,1);
  }
}
// Światła nie sprawdzają widoczności — test losClear na źródło i kolumnę
// wywróciłby koszt, a w gęstym lesie o krótkich dystansach tego nie widać.
function addDynamic(px,py,out){
  for(let i=0;i<DL.length;i++){
    const L=DL[i];
    const dx=px-L.x, dy=py-L.y, d2=dx*dx+dy*dy;
    if(d2 > L.rad*L.rad) continue;
    const f=1-Math.sqrt(d2)/L.rad;
    const k=f*f*(L.t/L.life);            // kwadratowy spadek + wygasanie w czasie
    out[0]+=L.c[0]*k; out[1]+=L.c[1]*k; out[2]+=L.c[2]*k;
  }
}

/* ---------- odczyt: to woła B1 ---------- */
function lightAt(px,py,out){
  if(!LM){ out[0]=out[1]=out[2]=1; return; }
  const cx=px|0, cy=py|0;
  if(cx<0||cy<0||cx>=MW||cy>=MH){ out[0]=out[1]=out[2]=1; return; }
  const i=(cy*MW+cx)*3;
  out[0]=LM[i]; out[1]=LM[i+1]; out[2]=LM[i+2];
  addDynamic(px,py,out);
}

/* ---------- B3: dwuliniowe próbkowanie dla podłogi ---------- */
function lightBilinear(px,py,out){
  if(!LM){ out[0]=out[1]=out[2]=1; return; }
  const x=px-0.5, y=py-0.5;
  const x0=Math.floor(x), y0=Math.floor(y);
  const tx=x-x0, ty=y-y0;
  // indeksy liczone ręcznie: domknięcie-pomocnik alokowane 12 000 razy na klatkę
  // kosztowało więcej niż samo próbkowanie
  const ax0 = x0<0?0:x0>=MW?MW-1:x0, ax1 = x0+1<0?0:x0+1>=MW?MW-1:x0+1;
  const ay0 = y0<0?0:y0>=MH?MH-1:y0, ay1 = y0+1<0?0:y0+1>=MH?MH-1:y0+1;
  const r0=ay0*MW, r1=ay1*MW;
  const i00=(r0+ax0)*3, i10=(r0+ax1)*3, i01=(r1+ax0)*3, i11=(r1+ax1)*3;
  for(let k=0;k<3;k++)
    out[k]=lerp(lerp(LM[i00+k],LM[i10+k],tx), lerp(LM[i01+k],LM[i11+k],tx), ty);
  addDynamic(px,py,out);
}

/* ---------- B7: kierunkowe światło księżyca ---------- */
// 0:+X  1:-X  2:+Y  3:-Y — normalna ściany wskazuje NA gracza
const FACE_N=[[1,0],[-1,0],[0,1],[0,-1]];
const faceK=new Float32Array([1,1,1,1]);
function updateFaceLight(B){
  for(let i=0;i<4;i++){
    const d = FACE_N[i][0]*B.moonDir[0] + FACE_N[i][1]*B.moonDir[1];
    faceK[i] = 1 + d*B.moonStr;
  }
}

/* ============================================================
   TEKSTURY (proceduralne, z 32 poziomami przyciemnienia)
   ============================================================ */
function makeCanvas(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
function grab(c){
  const g=c.getContext('2d');
  const d=g.getImageData(0,0,c.width,c.height);
  return { w:c.width, h:c.height, data:new Uint32Array(d.data.buffer) };
}
function shadeLevels(tex, n){
  const lv=[];
  for(let l=0;l<n;l++){
    const f = 1 - l/(n-1);
    const out = new Uint32Array(tex.data.length);
    for(let i=0;i<tex.data.length;i++){
      const c = tex.data[i];
      const a = (c>>>24)&255;
      if(a<128){ out[i]=0; continue; }
      const r = c&255, g=(c>>>8)&255, b=(c>>>16)&255;
      const nr = (r*f + FOG[0]*(1-f))|0;
      const ng = (g*f + FOG[1]*(1-f))|0;
      const nb = (b*f + FOG[2]*(1-f))|0;
      out[i] = (255<<24)|(nb<<16)|(ng<<8)|nr;
    }
    lv.push(out);
  }
  tex.lv = lv; tex.n = n;
  return tex;
}

function texBark(B){
  const c=makeCanvas(64,64), g=c.getContext('2d'), r=mulberry32(7);
  g.fillStyle=B.bark; g.fillRect(0,0,64,64);
  for(let i=0;i<70;i++){
    const x=r()*64, w=1+r()*3, h=8+r()*56, y=r()*64;
    g.fillStyle = r()<.5 ? `rgba(${B.barkDark[0]},${B.barkDark[1]},${B.barkDark[2]},${.3+r()*.5})`
                         : `rgba(${B.barkLite[0]},${B.barkLite[1]},${B.barkLite[2]},${.15+r()*.3})`;
    g.fillRect(x,y,w,h);
  }
  for(let i=0;i<5;i++){                   // sęki
    const x=6+r()*52,y=6+r()*52,rr=3+r()*4;
    g.fillStyle=B.knot[0]; g.beginPath(); g.ellipse(x,y,rr,rr*.7,0,0,7); g.fill();
    g.fillStyle=B.knot[1]; g.beginPath(); g.ellipse(x,y,rr*.5,rr*.35,0,0,7); g.fill();
  }
  g.fillStyle='rgba(0,0,0,.35)'; g.fillRect(0,0,64,2); g.fillRect(0,62,64,2);
  return grab(c);
}
function texStone(moss,B){
  const c=makeCanvas(64,64), g=c.getContext('2d'), r=mulberry32(moss?31:13);
  g.fillStyle=B.stone; g.fillRect(0,0,64,64);

    for(let col=-1;col<5;col++){

      const t=.6+r()*.4;
      g.fillStyle=`rgb(${(B.stoneRGB[0]*t)|0},${(B.stoneRGB[1]*t)|0},${(B.stoneRGB[2]*t)|0})`;
      g.fillRect(x,y,w,h);
      g.fillStyle='rgba(255,255,255,.06)'; g.fillRect(x,y,w,2);
      g.fillStyle='rgba(0,0,0,.28)'; g.fillRect(x,y+h-2,w,2);
    }
  }
  for(let i=0;i<200;i++){ g.fillStyle=`rgba(0,0,0,${r()*.25})`; g.fillRect(r()*64,r()*64,1,1); }

}

    halo.addColorStop(0,'rgba(190,215,255,.30)'); halo.addColorStop(.35,'rgba(140,170,220,.10)');

    const face=g.createRadialGradient(292,102,2,300,110,17);
    face.addColorStop(0,'#f2f6ff'); face.addColorStop(.7,'#cdd8ea'); face.addColorStop(1,'#9fb0c8');
    g.fillStyle=face; g.beginPath(); g.arc(300,110,16,0,7); g.fill();
    g.fillStyle='rgba(140,155,180,.45)';
    g.beginPath(); g.arc(295,105,3.4,0,7); g.fill();
    g.beginPath(); g.arc(305,116,2.4,0,7); g.fill();
    g.beginPath(); g.arc(303,102,1.6,0,7); g.fill();
    g.beginPath(); g.arc(293,116,1.9,0,7); g.fill();
  }
  // chmury
  for(let i=0;i<26;i++){
    const x=r()*SKY_W,y=60+r()*160,w=60+r()*140,h=8+r()*16;
    g.fillStyle=`rgba(${S.cloud},${.12+r()*.2})`;
    g.beginPath(); g.ellipse(x,y,w,h,0,0,7); g.fill();
  }
  // odległa linia lasu
  for(let pass=0;pass<3;pass++){
    const base = 258 + pass*6, col=S.treeline[pass];
    g.fillStyle=col;
    let x=0;
    while(x<SKY_W){
      const w=6+r()*16, h=14+r()*46*(1-pass*.25);
      g.beginPath();
      g.moveTo(x,base); g.lineTo(x+w/2,base-h); g.lineTo(x+w,base); g.closePath(); g.fill();
      x += w*0.62;
    }
    g.fillRect(0,base,SKY_W,SKY_H-base);
  }
  return grab(c);
}

/* ============================================================
   SPRITE'Y (rysowane w 2D, potem cięte na piksele)
   ============================================================ */
const SPR_LV = 16;
function makeSprite(w,h,draw,tint){
  const c=makeCanvas(w,h); const g=c.getContext('2d');
  g.clearRect(0,0,w,h); draw(g,w,h);
  if(tint){                       // odcień biomu — tylko na narysowanych pikselach
    g.globalCompositeOperation='source-atop';
    g.fillStyle=tint; g.fillRect(0,0,w,h);
    g.globalCompositeOperation='source-over';
  }
  return shadeLevels(grab(c), SPR_LV);
}
function jag(g,cx,cy,rr,n,rand,col){
  g.fillStyle=col; g.beginPath();
  for(let i=0;i<n;i++){
    const a=i/n*Math.PI*2, k=rr*(0.72+rand()*0.55);
    const x=cx+Math.cos(a)*k, y=cy+Math.sin(a)*k*0.85;
    i?g.lineTo(x,y):g.moveTo(x,y);
  }
  g.closePath(); g.fill();
}

/* Rysunek jednego wrogiego drzewa.
   kind: 0 sadzonka, 1 dąb, 2 świerk, 3 prastare, 4 zakorzeniony, 5 matecznik, 6 cichosz */
function drawTree(g,w,h,kind,frame,seed){
  const r=mulberry32(seed+frame*17);
  const t = frame/4*Math.PI*2;
  const sway = Math.sin(t)*w*0.045;
  const step = Math.sin(t)*h*0.03;
  const pal = [
    { bark:'#6a4b30', bark2:'#3c2a1a', leaf:['#6fbf4a','#4f9c33','#8ad35e'], eye:'#ffe14a' },
    { bark:'#5a3f28', bark2:'#2e2013', leaf:['#3f7a2c','#2c5c1f','#55993a'], eye:'#ff6a2a' },
    { bark:'#4a3524', bark2:'#241a10', leaf:['#1f5638','#154029','#2c7048'], eye:'#63e3ff' },
    { bark:'#3a2a1e', bark2:'#181009', leaf:['#5b3f6e','#3d2a4c','#7a5690'], eye:'#ff2f2f' },
    { bark:'#4c4a42', bark2:'#22201b', leaf:['#4a5a30','#333f20','#5f7040'], eye:'#ffab2e' },
    { bark:'#6b4a44', bark2:'#33201e', leaf:['#b06a8e','#7d4562','#c98aa8'], eye:'#8cff6a' },
    { bark:'#c6c2b0', bark2:'#6e6a5c', leaf:['#8f9c86','#6d7a66','#aab6a0'], eye:'#ffffff' },
    { bark:'#4a2a20', bark2:'#20100c', leaf:['#c25a22','#8e3c16','#e07a2e'], eye:'#ffd23b' },
  ][kind];

  const cx=w/2, ground=h-1;
  const trunkW = [0.16,0.30,0.20,0.42,0.50,0.28,0.18,0.22][kind]*w;
  const trunkTop = h*[0.52,0.46,0.40,0.30,0.44,0.48,0.34,0.46][kind];

  // korzenie-nogi
  g.fillStyle=pal.bark2;
  for(let s=-1;s<=1;s+=2){
    const lx = cx + s*trunkW*0.42 + (s>0?step:-step);
    g.beginPath();
    g.moveTo(lx - trunkW*0.22, ground - h*0.22);
    g.lineTo(lx + trunkW*0.22, ground - h*0.22);
    g.lineTo(lx + trunkW*0.34 + s*3, ground);
    g.lineTo(lx - trunkW*0.34 + s*3, ground);
    g.closePath(); g.fill();
  }
  // pień
  g.fillStyle=pal.bark;
  g.beginPath();
  g.moveTo(cx-trunkW/2, ground-h*0.16);
  g.lineTo(cx+trunkW/2, ground-h*0.16);
  g.lineTo(cx+trunkW*0.36+sway, trunkTop);
  g.lineTo(cx-trunkW*0.36+sway, trunkTop);
  g.closePath(); g.fill();
  g.fillStyle=pal.bark2;
  for(let i=0;i<10;i++){
    const y=trunkTop+r()*(ground-trunkTop-4);
    g.fillRect(cx-trunkW*0.4+r()*trunkW*0.8, y, 1, 3+r()*8);
  }

  // cechy szczególne nowych gatunków
  if(kind===4){                       // zakorzeniony — grube korzenie wpite w ziemię
    g.strokeStyle=pal.bark2; g.lineCap='round';
    for(let i=0;i<7;i++){
      const s=(i/6-0.5)*2;
      g.lineWidth=Math.max(2, trunkW*0.16);
      g.beginPath();
      g.moveTo(cx+s*trunkW*0.28, ground-h*0.20);
      g.quadraticCurveTo(cx+s*trunkW*0.9, ground-h*0.06, cx+s*w*0.46, ground-1);
      g.stroke();
    }
    g.fillStyle='rgba(90,70,40,.45)';
    g.beginPath(); g.ellipse(cx, ground-2, w*0.46, h*0.045, 0,0,7); g.fill();
  } else if(kind===5){                // matecznik — torebki z zarodnikami na pniu
    for(let i=0;i<6;i++){
      const y=trunkTop+r()*(ground-trunkTop-8), x=cx-trunkW*0.5+r()*trunkW;
      const rr2=2+r()*3;
      g.fillStyle='#c98aa8'; g.beginPath(); g.ellipse(x,y,rr2,rr2*1.3,0,0,7); g.fill();
      g.fillStyle='rgba(255,220,235,.6)'; g.beginPath(); g.ellipse(x-rr2*0.3,y-rr2*0.4,rr2*0.35,rr2*0.4,0,0,7); g.fill();
    }
  } else if(kind===7){                // pękacz — nabrzmiałe, świecące torebki
    for(let i=0;i<5;i++){
      const y=trunkTop+r()*(ground-trunkTop-10), x=cx-trunkW*0.55+r()*trunkW*1.1;
      const rr2=3+r()*3.5, gl=0.5+((frame%2)?0.35:0);
      g.fillStyle='rgba(255,'+((90+gl*90)|0)+',30,'+(0.55+gl*0.35).toFixed(2)+')';
      g.beginPath(); g.ellipse(x,y,rr2,rr2*1.25,0,0,7); g.fill();
      g.fillStyle='rgba(255,240,180,.75)';
      g.beginPath(); g.ellipse(x-rr2*0.25,y-rr2*0.35,rr2*0.3,rr2*0.36,0,0,7); g.fill();
    }
  } else if(kind===6){                // cichosz — brzozowe pręgi
    g.fillStyle='#2f2c26';
    for(let i=0;i<12;i++){
      const y=trunkTop+r()*(ground-trunkTop-3);
      const ww=trunkW*(0.25+r()*0.5);
      g.fillRect(cx-trunkW*0.45+r()*(trunkW*0.9-ww), y, ww, 1+r()*2);
    }
  }

  // konary-ramiona
  g.strokeStyle=pal.bark; g.lineCap='round';
  for(let s=-1;s<=1;s+=2){
    const armY = h*[0.60,0.56,0.52,0.44,0.58,0.58,0.46,0.56][kind];
    const reach = w*0.42*(1+Math.sin(t+ (s>0?0:2))*0.12);
    g.lineWidth = Math.max(2, trunkW*0.22);
    g.beginPath();
    g.moveTo(cx + s*trunkW*0.3, armY);
    g.quadraticCurveTo(cx + s*reach*0.8, armY - h*0.06, cx + s*reach, armY + h*0.07);
    g.stroke();
    g.lineWidth = Math.max(1, trunkW*0.11);
    for(let f=0;f<3;f++){
      g.beginPath();
      g.moveTo(cx + s*reach, armY + h*0.07);
      g.lineTo(cx + s*(reach + 4 + f*2), armY + h*(0.12 + f*0.035));
      g.stroke();
    }
  }

  // korona
  if(kind===2){                       // świerk — warstwy
    for(let i=0;i<4;i++){
      const yy = trunkTop - h*0.02 + i*h*0.12;
      const ww = w*(0.18 + i*0.11);
      g.fillStyle = pal.leaf[i%3];
      g.beginPath();
      g.moveTo(cx+sway, yy - h*0.16);
      g.lineTo(cx+sway+ww, yy);
      g.lineTo(cx+sway-ww, yy);
      g.closePath(); g.fill();
    }
  } else {
    const rr = w*[0.24,0.40,0.30,0.46,0.34,0.38,0.26,0.30][kind];
    const cy = trunkTop - rr*0.35;
    for(let i=0;i<7;i++){
      const a=i/7*Math.PI*2;
      jag(g, cx+sway+Math.cos(a)*rr*0.55, cy+Math.sin(a)*rr*0.38, rr*0.62, 9, r, pal.leaf[i%3]);
    }
    jag(g, cx+sway, cy, rr*0.9, 11, r, pal.leaf[1]);
    g.globalAlpha=.5;
    jag(g, cx+sway-rr*0.3, cy-rr*0.3, rr*0.5, 9, r, pal.leaf[2]);
    g.globalAlpha=1;
  }

  // twarz w korze
  const fy = h*[0.68,0.66,0.62,0.56,0.66,0.68,0.58,0.64][kind];
  const ew = Math.max(2, trunkW*0.20), eg = trunkW*0.24;
  g.fillStyle='#0a0603';
  g.beginPath(); g.ellipse(cx-eg, fy, ew*1.3, ew, 0,0,7); g.fill();
  g.beginPath(); g.ellipse(cx+eg, fy, ew*1.3, ew, 0,0,7); g.fill();
  g.fillStyle=pal.eye;
  g.beginPath(); g.ellipse(cx-eg, fy, ew*0.7, ew*0.55,0,0,7); g.fill();
  g.beginPath(); g.ellipse(cx+eg, fy, ew*0.7, ew*0.55,0,0,7); g.fill();
  g.fillStyle='#0a0603';
  const mw=trunkW*0.5, my=fy+ew*2.2, mh=ew*(1.2+Math.abs(Math.sin(t))*0.9);
  g.beginPath(); g.moveTo(cx-mw/2,my);
  for(let i=0;i<=4;i++) g.lineTo(cx-mw/2+mw*i/4, my + (i%2?mh:mh*0.3));
  g.lineTo(cx+mw/2,my); g.closePath(); g.fill();
  g.fillStyle='#e9e2cf';
  for(let i=0;i<4;i++){
    const x=cx-mw/2+mw*(i+0.5)/4;
    g.beginPath(); g.moveTo(x-1.2,my); g.lineTo(x+1.2,my); g.lineTo(x, my+mh*0.55); g.closePath(); g.fill();
  }
}

function drawStump(g,w,h){
  const r=mulberry32(5);
  g.fillStyle='#3c2a1a';
  g.beginPath(); g.moveTo(w*0.3,h); g.lineTo(w*0.7,h); g.lineTo(w*0.66,h*0.55); g.lineTo(w*0.34,h*0.55); g.closePath(); g.fill();
  g.fillStyle='#7a5a3a'; g.beginPath(); g.ellipse(w/2,h*0.55,w*0.17,h*0.06,0,0,7); g.fill();
  g.strokeStyle='#4a3524'; g.lineWidth=1;
  for(let i=1;i<4;i++){ g.beginPath(); g.ellipse(w/2,h*0.55,w*0.17*i/4,h*0.06*i/4,0,0,7); g.stroke(); }
  for(let i=0;i<6;i++){ g.fillStyle='rgba(0,0,0,.3)'; g.fillRect(w*0.32+r()*w*0.36, h*0.6+r()*h*0.35,1,3+r()*5); }
}
function drawPickup(g,w,h,kind){
  if(kind===0){                                  // liść zdrowia
    g.fillStyle='#7fe06a';
    g.beginPath(); g.moveTo(w/2,h*0.15);
    g.quadraticCurveTo(w*0.95,h*0.45,w/2,h*0.92);
    g.quadraticCurveTo(w*0.05,h*0.45,w/2,h*0.15); g.fill();
    g.strokeStyle='#2f6b22'; g.lineWidth=1;
    g.beginPath(); g.moveTo(w/2,h*0.2); g.lineTo(w/2,h*0.88); g.stroke();
    g.fillStyle='rgba(255,255,255,.35)'; g.beginPath(); g.ellipse(w*0.4,h*0.4,w*0.08,h*0.14,-0.5,0,7); g.fill();
  } else if(kind===1){                           // pudełko naboi śrutowych
    g.fillStyle='#8a2f2f'; g.fillRect(w*0.2,h*0.4,w*0.6,h*0.45);
    g.fillStyle='#c9a24a'; g.fillRect(w*0.2,h*0.72,w*0.6,h*0.13);
    g.fillStyle='#e0d6bb'; g.font=`${Math.floor(h*0.28)}px monospace`; g.textAlign='center';
    g.fillText('S', w*0.5, h*0.68);
  } else if(kind===3){                           // kanister paliwa
    g.fillStyle='#b5471f'; g.fillRect(w*0.24,h*0.34,w*0.5,h*0.52);
    g.fillStyle='#7c2c11'; g.fillRect(w*0.24,h*0.34,w*0.5,h*0.08);
    g.fillStyle='#2a2320'; g.fillRect(w*0.44,h*0.24,w*0.12,h*0.12);
    g.strokeStyle='#2a2320'; g.lineWidth=2;
    g.beginPath(); g.moveTo(w*0.34,h*0.3); g.lineTo(w*0.5,h*0.22); g.stroke();
    g.fillStyle='#ffd06a'; g.beginPath();
    g.moveTo(w*0.46,h*0.44); g.lineTo(w*0.6,h*0.44); g.lineTo(w*0.48,h*0.62);
    g.lineTo(w*0.58,h*0.62); g.lineTo(w*0.42,h*0.8); g.lineTo(w*0.5,h*0.6);
    g.lineTo(w*0.4,h*0.6); g.closePath(); g.fill();
  } else {                                       // skrzynka amunicji
    g.fillStyle='#3f5a2e'; g.fillRect(w*0.15,h*0.42,w*0.7,h*0.44);
    g.fillStyle='#2a3d1f'; g.fillRect(w*0.15,h*0.42,w*0.7,h*0.09);
    g.fillStyle='#c9c14a';
    for(let i=0;i<4;i++) g.fillRect(w*(0.22+i*0.16), h*0.56, w*0.09, h*0.22);
  }
}

const TREE_FRAMES = 4;

function buildSprites(B){
  const tint = B.treeTint;
  TREES.length = 0;
  for(let k=0;k<8;k++){
    const w=[44,64,52,84,76,58,40,48][k], h=[64,96,104,140,92,88,110,78][k];

    for(let f=0;f<TREE_FRAMES;f++) fr.push(makeSprite(w,h,(g,W2,H2)=>drawTree(g,W2,H2,k,f,k*101+7), tint));

  }
  STUMP  = makeSprite(48,32,drawStump,tint);

    g.fillStyle='#3a2410';
    for(let i=0;i<5;i++) g.fillRect(w*0.2, h*(0.18+i*0.15), w*0.6, 1.5);
    g.fillStyle='rgba(255,180,80,.5)'; g.beginPath(); g.ellipse(w*0.4,h*0.35,w*0.12,h*0.1,0,0,7); g.fill();
  }, tint);
}

/* ---------- pnącza w interfejsie ----------
   Rysowane na płótnie i wstrzykiwane do CSS jako data URI. Kolory bierzemy
   z mchu biomu, więc UI zmienia odcień razem z lasem. */
function vineLeaf(g,x,y,len,ang,col){
  g.save(); g.translate(x,y); g.rotate(ang);
  g.fillStyle=col;
  g.beginPath(); g.moveTo(0,0);
  g.quadraticCurveTo(len*0.5,-len*0.44, len,0);
  g.quadraticCurveTo(len*0.5, len*0.44, 0,0);
  g.fill();
  g.restore();
}
function makeVineCorner(B,S,seed){
  const c=makeCanvas(S,S), g=c.getContext('2d'), r=mulberry32(seed||23);
  const m=B.moss;
  const shade=(k)=>`rgb(${Math.min(255,Math.max(0,m[0]*k))|0},${Math.min(255,Math.max(0,m[1]*k))|0},${Math.min(255,Math.max(0,m[2]*k))|0})`;
  const dark=shade(0.5), mid=shade(0.95), lite=shade(1.45);
  g.lineCap='round'; g.lineJoin='round';
  // główna łodyga biegnie wzdłuż narożnika
  const stem=(w,col)=>{ g.strokeStyle=col; g.lineWidth=S*w;
    g.beginPath(); g.moveTo(S*0.05,S*0.82);
    g.quadraticCurveTo(S*0.09,S*0.11, S*0.84,S*0.07); g.stroke(); };
  stem(0.105, dark);
  stem(0.055, mid);
  // wąsy odchodzące w głąb panelu
  g.strokeStyle=mid; g.lineWidth=Math.max(1,S*0.035);
  g.beginPath(); g.moveTo(S*0.08,S*0.46); g.quadraticCurveTo(S*0.28,S*0.42,S*0.24,S*0.21); g.stroke();
  g.beginPath(); g.moveTo(S*0.46,S*0.08); g.quadraticCurveTo(S*0.50,S*0.28,S*0.70,S*0.25); g.stroke();
  // listki wzdłuż łodygi i na końcach wąsów
  const leaves=[[0.10,0.64,0.26,2.55],[0.08,0.34,0.25,2.15],[0.06,0.88,0.21,2.95],
                [0.30,0.09,0.25,0.55],[0.60,0.06,0.23,0.95],
                [0.24,0.20,0.19,-0.75],[0.70,0.25,0.19,1.65]];
  for(const [lx,ly,ll,la] of leaves){
    vineLeaf(g,S*lx,S*ly,S*ll,la, r()<0.45?lite:mid);
    g.strokeStyle=dark; g.lineWidth=Math.max(1,S*0.02);
    g.beginPath(); g.moveTo(S*lx,S*ly);
    g.lineTo(S*lx+Math.cos(la)*S*ll*0.9, S*ly+Math.sin(la)*S*ll*0.9); g.stroke();
  }
  return c;
}
function rebuildUIArt(B){
  const root=document.documentElement;
  root.style.setProperty('--vine',     `url(${makeVineCorner(B,28,23).toDataURL()})`);
  root.style.setProperty('--vine-big', `url(${makeVineCorner(B,48,71).toDataURL()})`);
}

let AC=null, master=null, muted=false, windGain=null, droneGain=null;
function audioInit(){
  if(AC) return;
  AC = new (window.AudioContext||window.webkitAudioContext)();
  master = AC.createGain(); master.gain.value=muted?0:opt.vol; master.connect(AC.destination);
  // wiatr w tle
  const b = AC.createBufferSource(); b.buffer = noiseBuf(); b.loop=true;
  const f = AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=420; f.Q.value=0.6;
  windGain = AC.createGain(); windGain.gain.value=0.09;
  b.connect(f); f.connect(windGain); windGain.connect(master); b.start();
  const lfo=AC.createOscillator(), lg=AC.createGain();
  lfo.frequency.value=0.13; lg.gain.value=0.05; lfo.connect(lg); lg.connect(windGain.gain); lfo.start();
  // niskie dudnienie - podkrecane w update(), gdy drzewa sa blisko
  const dosc=AC.createOscillator(); dosc.type='sawtooth'; dosc.frequency.value=48;
  const df=AC.createBiquadFilter(); df.type='lowpass'; df.frequency.value=170; df.Q.value=0.7;
  droneGain=AC.createGain(); droneGain.gain.value=0;
  dosc.connect(df); df.connect(droneGain); droneGain.connect(master); dosc.start();
  const dl=AC.createOscillator(), dlg=AC.createGain();
  dl.frequency.value=0.07; dlg.gain.value=7; dl.connect(dlg); dlg.connect(dosc.frequency); dl.start();
}
let _nb=null;
function noiseBuf(){
  if(_nb) return _nb;
  const len=AC.sampleRate*3, b=AC.createBuffer(1,len,AC.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
  _nb=b; return b;
}
function env(node, vol, atk, dec){
  const g=AC.createGain(); const t=AC.currentTime;
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol,t+atk);
  g.gain.exponentialRampToValueAtTime(0.0001,t+atk+dec);
  node.connect(g); g.connect(master); return g;
}
function sNoise(vol,atk,dec,type,f0,f1,q){
  if(!AC||muted) return;
  const s=AC.createBufferSource(); s.buffer=noiseBuf();
  const bf=AC.createBiquadFilter(); bf.type=type||'lowpass'; bf.Q.value=q||1;
  const t=AC.currentTime;
  bf.frequency.setValueAtTime(f0,t); bf.frequency.exponentialRampToValueAtTime(Math.max(40,f1),t+atk+dec);
  s.connect(bf); env(bf,vol,atk,dec); s.start(t, Math.random()*2); s.stop(t+atk+dec+0.05);
}
// `delay` planuje dźwięk w zegarze WebAudio zamiast setTimeout — nie rozjeżdża
// się z pauzą i nie zostawia wiszących timerów po restarcie gry
function sTone(vol,atk,dec,wave,f0,f1,delay){
  if(!AC||muted) return;
  const o=AC.createOscillator(); o.type=wave;
  const t=AC.currentTime+(delay||0);
  o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+atk+dec);
  envAt(o,vol,atk,dec,t); o.start(t); o.stop(t+atk+dec+0.05);
}
function envAt(node, vol, atk, dec, t){
  const g=AC.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol,t+atk);
  g.gain.exponentialRampToValueAtTime(0.0001,t+atk+dec);
  node.connect(g); g.connect(master); return g;
}

// najbliższa naprawdę otwarta polana (kratka wolna razem z ośmioma sąsiadami)
function findOpenSpot(px,py){
  let bestSpot=null, bestD=1e9, any=null;
  for(let y=1;y<MH-1;y++) for(let x=1;x<MW-1;x++){
    if(cell(x,y)!==0) continue;
    const cx=x+0.5, cy=y+0.5;
    if(!any) any={x:cx,y:cy};
    let open=true;
    for(let oy=-1;oy<=1 && open;oy++) for(let ox=-1;ox<=1;ox++)
      if(cell(x+ox,y+oy)!==0){ open=false; break; }
    if(!open) continue;
    const d=(cx-px)*(cx-px)+(cy-py)*(cy-py);
    if(d<bestD){ bestD=d; bestSpot={x:cx,y:cy}; }
  }
  return bestSpot || any || {x:1.5,y:1.5};
}

/* ---------- fale ---------- */
// Liczebność wysyca się (limit 26 żywych i tak jest twardy), więc od ~fali 13
// trudność bierze się z MOCY drzew i nowych gatunków, nie z dłuższego przeciągania.
const MAX_WAVE_N = 26;
function waveScale(){
  const w = Math.max(0, wave-1);
  return {
    hp:    1 + Math.min(1.20, w*0.05),    // pułap +120% HP
    dmg:   1 + Math.min(0.90, w*0.045),   // wrogowie realnie bolą coraz bardziej
    spd:   1 + Math.min(0.35, w*0.020),
    rate:  1 / (1 + Math.min(0.50, w*0.030)),  // krótszy odstęp między atakami
  };
}

// pula gatunków otwierana falami: [kind, waga]
function waveRoster(){
  const pool = [[0, 35], [1, 35], [2, 30]];
  if(wave<2)      return [[0,85],[1,15]];
  if(wave<4)      return [[0,50],[1,35],[2,15]];
  if(wave>=4)  pool.push([5, 14]);   // matecznik
  if(wave>=5)  pool.push([7, 15]);   // pękacz
  if(wave>=6)  pool.push([4, 16]);   // zakorzeniony
  if(wave>=8)  pool.push([6, 14]);   // cichosz
  return pool;
}
function rollKind(){
  const pool = waveRoster();
  let total=0; for(const p of pool) total+=p[1];
  let r=Math.random()*total;
  for(const p of pool){ r-=p[1]; if(r<=0) return p[0]; }
  return pool[0][0];
}

function startWave(){
  // Co WAVES_PER_LEVEL fal las się zmienia: nowa mapa, nowy biom, nowe tekstury.
  // Warunek `level === wave/WAVES_PER_LEVEL` sprawia, że przejście odpala się
  // dokładnie raz — przy kolejnym wywołaniu level jest już podbity i fala rusza.
  if(wave>0 && wave%WAVES_PER_LEVEL===0 && level === wave/WAVES_PER_LEVEL){
    enterLevel(level+1, false);
    return;                       // fala ruszy po odliczeniu waveTimer w nowym lesie
  }
  wave++;
  waveQueue=[];
  waveTimer=0;
  const boss = wave%5===0;
  const n = Math.min(MAX_WAVE_N, 4 + Math.floor(wave*1.7));
  for(let i=0;i<n;i++) waveQueue.push(rollKind());
  if(boss) waveQueue.push(3);
  SFX.wave();
  message(boss ? `FALA ${wave} — PRADRZEW SIĘ BUDZI!` : `FALA ${wave}`, 2.2);
}

function freeCell(x,y,r){
  return cell(x-r,y-r)===0 && cell(x+r,y-r)===0 && cell(x-r,y+r)===0 && cell(x+r,y+r)===0;
}
function makeEnemy(kind,x,y){
  const d=ENEMY_DEF[kind], s=waveScale();
  const hp = d.hp*s.hp;
  return { x, y, kind, hp, maxhp:hp,
           dmg:d.dmg*s.dmg, spd:d.spd*s.spd, atkCd:d.atkCd*s.rate,
           atk:Math.random()*d.atkCd, anim:Math.random()*4, flash:0,
           dying:0, dead:false, groan:Math.random()*6, rooted:false };
}
function spawnEnemy(kind){
  const d=ENEMY_DEF[kind];
  for(let tries=0;tries<200;tries++){
    const x = 1.5 + Math.random()*(MW-3), y = 1.5 + Math.random()*(MH-3);
    if(!freeCell(x,y,d.r+0.1)) continue;
    const dx=x-P.x, dy=y-P.y;
    if(dx*dx+dy*dy < 49) continue;                 // nie bliżej niż 7 jednostek
    enemies.push(makeEnemy(kind,x,y));
    if(Math.random()<0.35) SFX.groan();
    return true;
  }
  return false;
}
