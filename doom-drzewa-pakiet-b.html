let last=performance.now();
// P0 — licznik czasu renderu. Renderer jest programowy, więc każda zmiana
// w wewnętrznej pętli jest odczuwalna; bez pomiaru nie wiadomo, co kosztowało.
let renderMs=0, frameN=0;
function frame(now){
  requestAnimationFrame(frame);
  let dt=(now-last)/1000; last=now;
  dt=Math.min(dt,0.05);
  if(running) update(dt);
  else if(gameOver) update(Math.min(dt,0.03)*0.35);   // slow-mo po śmierci
  const t0=performance.now();
  render();
  renderMs = renderMs*0.92 + (performance.now()-t0)*0.08;
  drawMini();
  // rysowane poza buforem — na pasku tytułu, żeby nie wchodzić w klatkę
  if(((frameN++)&15)===0)
    document.title = renderMs.toFixed(2)+' ms / render — DRZEWODOOM';
}
requestAnimationFrame(frame);

/* ============================================================
   AKTUALIZACJA
   ============================================================ */
function update(dt){
  // --- gracz ---
  if(!P.dead){
    const dirX=Math.cos(P.a), dirY=Math.sin(P.a);
    let mx=0,my=0;
    if(keys.KeyW||keys.ArrowUp){ mx+=dirX; my+=dirY; }
    if(keys.KeyS||keys.ArrowDown){ mx-=dirX; my-=dirY; }
    if(keys.KeyA){ mx+=dirY; my-=dirX; }
    if(keys.KeyD){ mx-=dirY; my+=dirX; }
    if(keys.ArrowLeft) P.a-=2.4*dt;
    if(keys.ArrowRight) P.a+=2.4*dt;
    if(keys.KeyQ) P.a-=2.4*dt;
    if(keys.KeyE) P.a+=2.4*dt;

    const len=Math.hypot(mx,my);
    // Kondycja: bieg kosztuje i regeneruje się po chwili bez biegu. Bez tego
    // „trzymaj Shift i nigdy nie walcz" była strategią bez wady.
    const wantRun = (keys.ShiftLeft||keys.ShiftRight) && len>0 && P.stam>0.02;
    if(wantRun){
      P.stam = Math.max(0, P.stam - dt);
      P.stamCd = 0.9;
      if(P.stam<=0 && !P.puff){ P.puff=true; SFX.breath(); message('BRAK ODDECHU',1); }
    } else {
      P.stamCd = Math.max(0, P.stamCd - dt);
      if(P.stamCd<=0){
        P.stam = Math.min(P.maxStam, P.stam + dt*(len>0?0.7:1.3));
        if(P.stam > P.maxStam*0.4) P.puff=false;
      }
    }
    const run = wantRun?1.55:1;
    const spd = 2.6*run;
    if(len>0){
      mx/=len; my/=len;
      tryMove(P, mx*spd*dt, my*spd*dt, 0.28, freeForPlayer);
      bobT += dt*(9*run);
      // krok na każdym półokresie kołysania kamery
      const ph = Math.floor(bobT/Math.PI);
      if(ph!==stepPhase){ stepPhase=ph; SFX.step(); }
    } else { bobT += dt*1.5; stepPhase = Math.floor(bobT/Math.PI); }
    // gdyby gracz kiedykolwiek znalazł się w geometrii — wypchnij, nie blokuj
    if(!freeCell(P.x,P.y,0.28)) unstick(P,0.28,dt);

    P.pitch *= Math.pow(0.02, dt);                 // powolny powrót do poziomu

    // strzał
    P.cd-=dt; P.fireT=Math.max(0,P.fireT-dt); P.kickT=Math.max(0,P.kickT-dt*3.5);
    P.iframe=Math.max(0,P.iframe-dt);

    // zamach siekiery rozwiązuje się TUTAJ, w pętli gry — nie w setTimeout.
    // Dzięki temu pauza go wstrzymuje, a cel jest szukany w chwili trafienia.
    if(P.swingT>0){
      P.swingT-=dt;
      if(P.swingT<=0){ P.swingT=0; resolveSwing(); }
    }

    // przeładowanie dubeltówki
    if(P.reloadT>0){
      P.reloadT-=dt;
      if(P.reloadT<=0){
        P.reloadT=0;
        const need = WEAPONS[1].mag - P.mag;
        const take = Math.min(need, P.shells);
        P.mag += take; P.shells -= take;
        SFX.reload();
        updateHUD();
      }
    }

    if((keys.Mouse0||keys.Space) && P.cd<=0 && P.reloadT<=0) fire();
    if(keys.KeyR && P.w===1 && P.reloadT<=0 && P.mag<WEAPONS[1].mag && P.shells>0) startReload();
  }

  updateLights(dt);                                   // B4 — wygaszanie źródeł
  // lecące szyszki świecą przez cały lot: odświeżamy pozycję co klatkę,
  // a życie na dt*1.05 sprawia, że światło gaśnie samo, gdy pocisk zniknie
  for(const sh of shots) addLight(sh.x, sh.y, [0.55,0.30,0.08], 2.6, dt*1.05);
  hitT       = Math.max(0, hitT - dt);
  if(streakT>0){ streakT-=dt; if(streakT<=0) streak=0; }   // seria wygasa
  hurtFlash  = Math.max(0, hurtFlash - dt*1.9);
  camShake   = Math.max(0, camShake - dt*7);
  levelFade  = Math.max(0, levelFade - dt*0.85);   // rozjaśnienie po zmianie lasu

  // --- fale ---
  if(!P.dead){
    if(waveQueue.length===0 && enemies.length===0){
      waveTimer-=dt;
      // startWave() sam ustawia waveTimer — przy zmianie poziomu na przerwę
      // między lasami, normalnie na 0
      if(waveTimer<=0) startWave();
    } else if(waveQueue.length){
      waveTimer-=dt;
      if(waveTimer<=0 && enemies.length<28){
        spawnEnemy(waveQueue.pop());
        waveTimer = waveQueue.length===0 ? 3.4 : Math.max(0.25, 1.1 - wave*0.05);
      }
    }
  }

  // --- wrogowie ---
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i], d=ENEMY_DEF[e.kind];
    if(e.dying>0){
      e.dying-=dt;
      if(e.dying<=0){
        enemies.splice(i,1);
        decals.push({ x:e.x, y:e.y, kind:e.kind });
        if(decals.length>36) decals.shift();
      }
      continue;
    }
    e.flash = Math.max(0, e.flash-dt*9);
    // płonie: obrażenia w czasie dobijają to, co wyszło ze stożka miotacza
    if(e.burn>0){
      e.burn-=dt;
      damage(e, dt*7.5, 'burn');
      if(Math.random()<dt*16) burst(e.x,e.y,0.35+Math.random()*0.9,2,[235,130,35]);
      if(e.dying>0) continue;
    }
    const dx=P.x-e.x, dy=P.y-e.y;
    const dist=Math.hypot(dx,dy)||1e-4;
    e.anim += dt*(2.4 + e.spd);
    e.groan -= dt;
    if(e.groan<=0 && dist<11){ if(Math.random()<0.5) SFX.groan(); e.groan = 4+Math.random()*9; }

    if(!P.dead){
      const nx=dx/dist, ny=dy/dist;

      // zakorzeniony: gdy podejdzie dostatecznie blisko, wrasta w ziemię
      // i od tej chwili jest przeszkodą, przez którą gracz nie przejdzie
      if(d.roots && !e.rooted && dist < d.rootAt && losClear(e.x,e.y,P.x,P.y)){
        e.rooted = true; SFX.root();
        burst(e.x,e.y,0.15,14,[110,90,55]);
      }

      // cichosz stoi jak wryty, dopóki gracz na niego patrzy
      let frozen = false;
      if(d.shy){
        const inView = Math.abs(angDiff(Math.atan2(dy,dx), P.a)) < FOV_HALF;
        frozen = inView && dist < MAXFOG && losClear(e.x,e.y,P.x,P.y);
        e.frozen = frozen;
        if(frozen) e.anim = 0;               // zamiera też animacyjnie
      }

      if(!e.rooted && !frozen){
        // separacja od innych drzew
        let sx=0, sy=0;
        for(let j=0;j<enemies.length;j++){
          if(j===i) continue; const o=enemies[j]; if(o.dying>0) continue;
          const ox=e.x-o.x, oy=e.y-o.y, od=Math.hypot(ox,oy);
          const mind=d.r+ENEMY_DEF[o.kind].r;
          if(od>0 && od<mind){ sx+=ox/od*(mind-od); sy+=oy/od*(mind-od); }
        }
        const keep = d.ranged ? 3.2 : 0.75;
        let mvx=0,mvy=0;
        if(dist>keep){ mvx=nx; mvy=ny; }
        else if(d.ranged && dist<keep*0.7){ mvx=-nx*0.5; mvy=-ny*0.5; }
        // trochę bocznego dryfu, żeby nie szły idealnie w linii
        const drift=Math.sin(e.anim*0.7)*0.35;
        mvx += -ny*drift; mvy += nx*drift;
        mvx += sx*2.2; mvy += sy*2.2;
        const ml=Math.hypot(mvx,mvy);
        if(ml>0.001){ tryMove(e, mvx/ml*e.spd*dt, mvy/ml*e.spd*dt, d.r); }
        if(!freeCell(e.x,e.y,d.r)) unstick(e,d.r,dt);
      }

      // pękacz nie bije — tyka coraz szybciej i wybucha przy zetknięciu
      if(d.boom){
        e.tick = (e.tick||0) - dt;
        if(dist<4.5 && e.tick<=0){
          e.tick = Math.max(0.11, dist*0.10);
          SFX.fuse(); e.flash=Math.max(e.flash,0.75);
        }
        if(dist < d.r+0.75){ damage(e, e.hp+1, 'blast'); continue; }
      }

      // atak
      e.atk-=dt;
      if(e.atk<=0 && !frozen){
        if(d.ranged && dist<10 && losClear(e.x,e.y,P.x,P.y)){
          e.atk = e.atkCd*(0.8+Math.random()*0.5);
          fireCone(e, nx, ny, dist, e.dmg);
        } else if(!d.ranged && dist < d.r+0.55){
          e.atk = e.atkCd;
          hurtPlayer(e.dmg);
        } else if(d.ranged && dist < d.r+0.6){
          e.atk = e.atkCd;
          hurtPlayer(e.dmg*0.7);
        }
      }
    }
  }

  // --- pociski (szyszki) ---
  for(let i=shots.length-1;i>=0;i--){
    const s=shots[i];
    s.life-=dt;
    const nx=s.x+s.vx*dt, ny=s.y+s.vy*dt;
    s.vz -= SHOT_G*dt;
    const nz=s.z+s.vz*dt;
    if(cell(nx,ny)!==0 || nz<0.04 || s.life<=0){
      burst(s.x,s.y,Math.max(0.1,s.z),8,[120,90,50]); shots.splice(i,1); continue;
    }
    // test przeciągnięty po odcinku klatki + kontrola wysokości: szyszka nie
    // przeskoczy gracza przy niskim FPS i nie trafia, jeśli leci nad głową
    if(!P.dead && nz>0.02 && nz<1.05 &&
       segDist2(s.x,s.y,nx,ny,P.x,P.y) < 0.42*0.42){
      hurtPlayer(s.dmg); burst(nx,ny,nz,10,[150,110,60]); shots.splice(i,1); continue;
    }
    s.x=nx; s.y=ny; s.z=nz;
  }

  // --- cząstki ---
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];
    p.life-=dt;
    if(p.life<=0){ parts.splice(i,1); continue; }
    p.vz -= 3.2*dt;
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.z+=p.vz*dt;
    if(p.z<0.02){ p.z=0.02; p.vz*=-0.32; p.vx*=0.6; p.vy*=0.6; }
  }

  // --- unoszące się liczby obrażeń ---
  for(let i=floaters.length-1;i>=0;i--){
    const f=floaters[i];
    f.t+=dt; f.life-=dt;
    if(f.e && f.e.dying<=0){ f.x=f.e.x; f.y=f.e.y; }   // trzyma się drzewa
    f.z += dt*0.5;
    if(f.life<=0) floaters.splice(i,1);
  }

  // --- napięcie w tle: im więcej drzew blisko, tym głośniejszy las ---
  if(AC){
    let near=0;
    for(const e of enemies){
      if(e.dying>0) continue;
      const ddx=e.x-P.x, ddy=e.y-P.y;
      if(ddx*ddx+ddy*ddy < 36) near++;
    }
    threat += (near-threat)*Math.min(1, dt*3);
    if(windGain)  windGain.gain.value  = 0.09 + Math.min(0.11, threat*0.022);
    if(droneGain) droneGain.gain.value = Math.min(0.14, Math.max(0, threat-1)*0.035);
  }

  // --- znajdźki ---
  for(let i=pickups.length-1;i>=0;i--){
    const pk=pickups[i];
    pk.t+=dt;
    pk.life-=dt;
    if(pk.life<=0){ pickups.splice(i,1); continue; }   // nie zaśmiecamy mapy w nieskończoność
    if(Math.hypot(P.x-pk.x,P.y-pk.y)<0.55){
      let taken=false;
      if(pk.kind===0 && P.hp<P.maxhp){ P.hp=Math.min(P.maxhp,P.hp+25); taken=true; message('+25 ŻYWICY',1); }
      else if(pk.kind===1 && P.shells<P.maxShells){ P.shells=Math.min(P.maxShells,P.shells+8); taken=true; message('+8 NABOI',1); }
      else if(pk.kind===2 && P.bullets<P.maxBullets){ P.bullets=Math.min(P.maxBullets,P.bullets+45); taken=true; message('+45 AMUNICJI',1); }
      else if(pk.kind===3 && P.fuel<P.maxFuel){ P.fuel=Math.min(P.maxFuel,P.fuel+40); taken=true; message('+40 PALIWA',1); }
      if(taken){ SFX.pick(); pickups.splice(i,1); updateHUD(); }
    }
  }

  if(msgTimer>0){ msgTimer-=dt; if(msgTimer<=0) document.getElementById('msg').classList.remove('show'); }
  updateHUD();
}

function tryMove(ent, dx, dy, r, free){
  free = free || freeCell;
  let moved=false;
  if(free(ent.x+dx, ent.y, r)){ ent.x+=dx; moved=true; }
  if(free(ent.x, ent.y+dy, r)){ ent.y+=dy; moved=true; }
  if(!moved){
    // oba kierunki zablokowane — spróbuj wyślizgu w bok (anty-zakleszczenie)
    const l=Math.hypot(dx,dy)||1e-6, px=-dy/l*l, py=dx/l*l;
    if(free(ent.x+px, ent.y+py, r)){ ent.x+=px; ent.y+=py; moved=true; }
    else if(free(ent.x-px, ent.y-py, r)){ ent.x-=px; ent.y-=py; moved=true; }
  }
  return moved;
}
// zakorzenione drzewa są dla gracza twardą przeszkodą — stąd ich rola taktyczna
function freeForPlayer(x,y,r){
  if(!freeCell(x,y,r)) return false;
  for(const e of enemies){
    if(!e.rooted || e.dying>0) continue;
    const rr = ENEMY_DEF[e.kind].r + r;
    const ox=e.x-x, oy=e.y-y;
    if(ox*ox+oy*oy < rr*rr) return false;
  }
  return true;
}
// kwadrat najmniejszej odległości punktu (px,py) od odcinka a->b
function segDist2(ax,ay,bx,by,px,py){
  const dx=bx-ax, dy=by-ay, l2=dx*dx+dy*dy;
  let t = l2>0 ? ((px-ax)*dx+(py-ay)*dy)/l2 : 0;
  t = t<0?0:t>1?1:t;
  const qx=ax+dx*t-px, qy=ay+dy*t-py;
  return qx*qx+qy*qy;
}
const SHOT_SPD = 6.5, SHOT_G = 1.8, SHOT_Z0 = 0.75;
function fireCone(e, nx, ny, dist, dmg){
  const T = Math.max(0.15, dist/SHOT_SPD);
  const vz = (0.5 - SHOT_Z0)/T + 0.5*SHOT_G*T;   // balistyka celowana w tors
  shots.push({ x:e.x, y:e.y, z:SHOT_Z0, vx:nx*SHOT_SPD, vy:ny*SHOT_SPD, vz, dmg, life:3 });
  SFX.hit();
}
const MAX_PICKUPS = 24, PICKUP_LIFE = 45;
function addPickup(x,y,kind){
  if(pickups.length>=MAX_PICKUPS) pickups.shift();
  pickups.push({ x, y, kind, t:0, life:PICKUP_LIFE });
}
// awaryjne wypchnięcie drzewa, które wlazło w geometrię
function unstick(e,r,dt){
  const cx=(e.x|0)+0.5, cy=(e.y|0)+0.5;
  if(cell(cx,cy)===0){
    const dx=cx-e.x, dy=cy-e.y, l=Math.hypot(dx,dy)||1;
    e.x+=dx/l*2.5*dt; e.y+=dy/l*2.5*dt; return;
  }
  const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
  for(const [ox,oy] of dirs){
    if(cell(cx+ox,cy+oy)===0){ e.x+=ox*2.5*dt; e.y+=oy*2.5*dt; return; }
  }
}
function losClear(x0,y0,x1,y1){
  const dx=x1-x0, dy=y1-y0, d=Math.hypot(dx,dy), steps=Math.ceil(d/0.15);
  for(let i=1;i<steps;i++){
    const t=i/steps;
    if(cell(x0+dx*t, y0+dy*t)!==0) return false;
  }
  return true;
}
function hurtPlayer(dmg){
  if(P.dead || P.iframe>0) return;   // zamach siekierą daje chwilę oddechu
  P.hp -= dmg;
  hurtFlash = Math.min(1, hurtFlash + dmg/45);
  camShake = Math.min(6, camShake + dmg/8);
  SFX.hurt();
  if(P.hp<=0){ P.hp=0; endGame(); }
  updateHUD();
}
function burst(x,y,z,n,col){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, s=0.6+Math.random()*2.4;
    parts.push({ x,y,z:z+Math.random()*0.3,
      vx:Math.cos(a)*s, vy:Math.sin(a)*s, vz:1+Math.random()*2.4,
      life:0.5+Math.random()*0.7, size:0.03+Math.random()*0.05,
      c:(255<<24)|((col[2]+Math.random()*30|0)<<16)|((col[1]+Math.random()*40|0)<<8)|(col[0]+Math.random()*30|0) });
  }
  if(parts.length>420) parts.splice(0, parts.length-420);
}

/* ---------- strzelanie ---------- */
function startReload(){
  P.reloadT = WEAPONS[1].reload;
  P.cd = Math.max(P.cd, P.reloadT);
  SFX.swap();
  updateHUD();
}

function fire(){
  const w=WEAPONS[P.w];

  if(P.w===1){                                  // dubeltówka — magazynek dwulufowy
    if(P.mag<=0){
      if(P.shells>0) startReload(); else { SFX.empty(); P.cd=0.35; }
      return;
    }
    P.mag--;
  } else if(w.ammo!==-1){
    if(P[w.ammo]<=0){ SFX.empty(); P.cd=0.35; return; }
    P[w.ammo]--;
  }
  P.cd=w.cd; P.kickT=1; P.fireT=w.melee?0.32:0.11;

  if(w.flame){
    SFX.flame();
    addLight(P.x,P.y,[1.20,0.55,0.15],3.5,0.07);   // B4 — miotacz

    camShake=Math.max(camShake,0.45);
    // Stożek rozszerza się z odległością: z bliska wąski i pewny, dalej szeroki
    // ale rozrzedzony. Trafienie samo w sobie boli mało — liczy się podpalenie.
    for(const e of enemies.slice()){
      if(e.dying>0) continue;
      const dx=e.x-P.x, dy=e.y-P.y, dist=Math.hypot(dx,dy);
      if(dist > w.range + ENEMY_DEF[e.kind].r) continue;
      const spread = w.arc*(0.5 + dist/w.range*0.9);
      if(Math.abs(angDiff(Math.atan2(dy,dx), P.a)) > spread) continue;
      if(!losClear(P.x,P.y,e.x,e.y)) continue;
      damage(e, w.dmg*(0.8+Math.random()*0.4));
      if(e.dying<=0) e.burn = Math.max(e.burn||0, w.burn);
    }
    // płomień w świecie — żeby było widać strumień, nie tylko broń w rękach
    for(let i=0;i<3;i++){
      const a = P.a + (Math.random()*2-1)*w.arc*0.85;
      const dd = 0.45 + Math.random()*w.range*0.85;
      if(rayWallDist(P.x,P.y,Math.cos(a),Math.sin(a),dd) < dd) continue;
      parts.push({ x:P.x+Math.cos(a)*dd, y:P.y+Math.sin(a)*dd, z:0.5+Math.random()*0.3,
        vx:Math.cos(a)*1.7, vy:Math.sin(a)*1.7, vz:0.6+Math.random()*1.1,
        life:0.2+Math.random()*0.24, size:0.05+Math.random()*0.07,
        c:(255<<24)|(((35+Math.random()*45)|0)<<16)|(((140+Math.random()*85)|0)<<8)|255 });
    }
    if(parts.length>420) parts.splice(0, parts.length-420);
    updateHUD();
    return;
  }

  if(w.melee){
    SFX.axe();
    // trafienie rozwiązuje resolveSwing() po w.swing sekund — w pętli gry
    P.swingT = w.swing;
    P.iframe = Math.max(P.iframe, w.iframe);
    camShake=Math.max(camShake,1.2);
    return;
  }

  // broń palna
  // B4 — błysk wystrzału to światło STOJĄCE W MIEJSCU GRACZA, nie rozjaśnienie ekranu
  if(P.w===1){ SFX.shotgun(); addLight(P.x,P.y,[1.60,1.15,0.50],6.5,0.085); camShake=Math.max(camShake,3.2); P.pitch=clamp(P.pitch+7,-70,70); }
  else       { SFX.chain();   addLight(P.x,P.y,[1.10,0.80,0.35],4.5,0.055); camShake=Math.max(camShake,1.1); P.pitch=clamp(P.pitch+1.6,-70,70); }

  for(let i=0;i<w.pellets;i++){
    const a = P.a + (Math.random()*2-1)*w.spread;
    hitscan(a, w.range, w.dmg*(0.85+Math.random()*0.3));
  }

  // po opróżnieniu obu luf przeładuj automatycznie
  if(P.w===1 && P.mag<=0 && P.shells>0) startReload();
  updateHUD();
}

// Siekiera tnie w łuku: dostają WSZYSTKIE drzewa w stożku, sadzonki podwójnie,
// a trafione są odrzucane. Cel szukany w chwili trafienia, nie w chwili zamachu.
function resolveSwing(){
  if(P.dead) return;
  const w=WEAPONS[0];
  let any=false;
  const targets = enemies.slice();   // kopia: matecznik może dosiać sadzonki w trakcie
  for(const e of targets){
    if(e.dying>0) continue;
    const dx=e.x-P.x, dy=e.y-P.y, dist=Math.hypot(dx,dy);
    if(dist > w.range + ENEMY_DEF[e.kind].r) continue;
    if(Math.abs(angDiff(Math.atan2(dy,dx), P.a)) > w.arc) continue;
    let dmg = w.dmg*(0.85+Math.random()*0.3);
    if(e.kind===0) dmg*=2;                       // sadzonki rąbie się jak chrust
    damage(e,dmg);
    if(!e.rooted && e.dying<=0){                 // odrzut — tylko niezakorzenione
      const l=dist||1e-4;
      tryMove(e, dx/l*w.knock, dy/l*w.knock, ENEMY_DEF[e.kind].r);
    }
    any=true;
  }
  if(any){ SFX.chop(); camShake=Math.max(camShake,1.8); }
}

function angDiff(a,b){ let d=a-b; while(d>Math.PI)d-=2*Math.PI; while(d<-Math.PI)d+=2*Math.PI; return d; }

// Odległość do najbliższej ściany wzdłuż promienia (DDA — bez marszu po krokach).
function rayWallDist(ox,oy,dx,dy,maxD){
  let mapX=ox|0, mapY=oy|0;
  const ddx = dx===0?1e30:Math.abs(1/dx);
  const ddy = dy===0?1e30:Math.abs(1/dy);
  let stepX,stepY,sdx,sdy;
  if(dx<0){ stepX=-1; sdx=(ox-mapX)*ddx; } else { stepX=1; sdx=(mapX+1-ox)*ddx; }
  if(dy<0){ stepY=-1; sdy=(oy-mapY)*ddy; } else { stepY=1; sdy=(mapY+1-oy)*ddy; }
  let side=0, guard=0;
  while(guard++<512){
    if(sdx<sdy){ sdx+=ddx; mapX+=stepX; side=0; }
    else       { sdy+=ddy; mapY+=stepY; side=1; }
    const d = side===0 ? sdx-ddx : sdy-ddy;
    if(d>maxD) return maxD;
    if(cell(mapX,mapY)!==0) return d;
  }
  return maxD;
}

// Analityczny promień↔okrąg: jeden test na wroga zamiast ~250 kroków marszu.
// Znika też błąd „kwadratowego" hitboksa i przestrzeliwanie cienkich sadzonek.
function hitscan(a, range, dmg){
  const dx=Math.cos(a), dy=Math.sin(a);
  const wallD = rayWallDist(P.x, P.y, dx, dy, range);

  let hit=null, hitT=wallD;
  for(const e of enemies){
    if(e.dying>0) continue;
    const r = ENEMY_DEF[e.kind].r;
    const ex=e.x-P.x, ey=e.y-P.y;
    const proj = ex*dx + ey*dy;              // rzut środka na promień
    if(proj<=0 || proj-r>=hitT) continue;    // za plecami albo dalej niż aktualne trafienie
    const perp2 = ex*ex+ey*ey - proj*proj;   // kwadrat odległości środka od osi promienia
    if(perp2 > r*r) continue;
    const t = proj - Math.sqrt(r*r - perp2); // wejście w okrąg
    if(t<0 || t>=hitT) continue;
    hitT=t; hit=e;
  }

  if(hit){
    damage(hit,dmg);
    burst(P.x+dx*hitT, P.y+dy*hitT, 0.6+Math.random()*0.7, 5, [90,150,60]);
  } else if(wallD<range){
    burst(P.x+dx*(wallD-0.1), P.y+dy*(wallD-0.1), 0.5+Math.random()*0.5, 4, [110,95,70]);
  }
}
// Wybuch pękacza: rani gracza w promieniu i przenosi się na inne drzewa.
// Łańcuch nie może się zapętlić — drzewo z e.dying>0 nie wybuchnie drugi raz.
function explode(e,def){
  SFX.boom();
  camShake   = Math.min(9, camShake+5.5);
  addLight(e.x, e.y, [1.90,0.85,0.28], 7.5, 0.38);   // B4 — wybuch rozpala otoczenie
  burst(e.x,e.y,0.5,44,[255,150,50]);
  burst(e.x,e.y,0.2,18,[120,70,30]);
  const pd = Math.hypot(P.x-e.x, P.y-e.y);
  if(pd < def.boomR && losClear(e.x,e.y,P.x,P.y))
    hurtPlayer(def.boomDmg*(1-pd/def.boomR));
  for(const o of enemies.slice()){
    if(o===e || o.dying>0) continue;
    const od=Math.hypot(o.x-e.x, o.y-e.y);
    if(od<def.boomR) damage(o, def.boomDmg*0.85*(1-od/def.boomR), 'blast');
  }
}

// tryb: 'hit' — bezpośrednie trafienie gracza (hitmarker + liczba obrażeń),
//       'burn' — podpalenie (cicho, bez markera), 'blast' — wybuch
function damage(e,dmg,mode){
  mode = mode || 'hit';
  e.hp-=dmg;
  if(mode!=='burn'){
    e.flash=1;
    burst(e.x,e.y,0.7+Math.random()*0.6,4,[80,140,55]);
  }
  if(mode==='hit'){ hitT=0.16; addFloater(e,dmg); }
  if(e.hp<=0 && e.dying<=0){
    const def=ENEMY_DEF[e.kind];
    e.dying=0.65; e.dead=true; e.rooted=false; e.burn=0;
    kills++;
    // seria: ścięcia w odstępie < 3.2 s podbijają mnożnik punktów do x4
    const prev = comboMult();
    streak++; streakT = 3.2;
    const cm = comboMult();
    if(cm>prev) SFX.combo();
    score += def.score * (1 + Math.floor(Math.max(0,wave-1)/5)) * cm;
    SFX.fall();
    if(def.boom) explode(e,def);
    burst(e.x,e.y,0.9,26,[70,130,50]);
    burst(e.x,e.y,0.4,10,[110,80,45]);
    // łupy
    const roll=Math.random();
    if(roll<0.16) addPickup(e.x,e.y,0);
    else if(roll<0.38) addPickup(e.x,e.y,1);
    else if(roll<0.54) addPickup(e.x,e.y,2);
    else if(roll<0.66) addPickup(e.x,e.y,3);
    if(e.kind===3){ message('PRADRZEW POWALONY!',2.4);
      addPickup(e.x+0.6,e.y,0);
      addPickup(e.x-0.6,e.y,2); }
    // matecznik pęka i rozsiewa sadzonki
    if(def.splits && enemies.length < 40){
      burst(e.x,e.y,0.8,18,[200,140,175]);
      for(let s=0;s<def.splits;s++){
        const a=Math.random()*Math.PI*2, off=0.5+Math.random()*0.3;
        const sx=e.x+Math.cos(a)*off, sy=e.y+Math.sin(a)*off;
        const sd=ENEMY_DEF[0];
        if(!freeCell(sx,sy,sd.r)) continue;
        enemies.push(makeEnemy(0,sx,sy));
      }
      message('MATECZNIK PĘKŁ — SADZONKI!',1.4);
    }
    updateHUD();
  } else if(mode==='hit') SFX.hit();
}

/* ============================================================
   RENDER
   ============================================================ */
let dirX=1,dirY=0,plX=0,plY=PLANE, camShift=0;

function render(){
  const shakeX = camShake>0 ? (Math.random()*2-1)*camShake : 0;
  const shakeY = camShake>0 ? (Math.random()*2-1)*camShake : 0;
  const bob = Math.sin(bobT)*2.2 + Math.abs(Math.cos(bobT))*0.8;
  camShift = P.dead ? P.pitch + 70          // po śmierci kamera opada na ziemię
                    : P.pitch + bob + shakeY;
  const ang = P.a + shakeX*0.002;
  dirX=Math.cos(ang); dirY=Math.sin(ang);
  plX=-dirY*PLANE;    plY=dirX*PLANE;

  const horizon = (H/2 + camShift)|0;

  drawSky(ang, horizon);
  drawFloor(horizon);
  drawWalls(horizon);

  // sprite'y: wrogowie, pnie, znajdźki, pociski
  const list=[];
  for(const e of enemies){
    const fr = TREES[e.kind][((e.anim|0)%TREE_FRAMES+TREE_FRAMES)%TREE_FRAMES];
    const d=ENEMY_DEF[e.kind];
    let sy=1, sx=1;
    if(e.dying>0){ const t=1-e.dying/0.65; sy=1-t*0.92; sx=1+t*0.45; }
    if(e.rooted){ sy*=0.92; sx*=1.12; }          // wrośnięty: przysiada i rozpiera się
    // B8 — jedno wyliczenie światła na obiekt; bez tego drzewa świecą własnym
    // światłem i wyglądają jak naklejki na oświetlonym tle
    lightAt(e.x, e.y, LT);
    list.push({ x:e.x, y:e.y, tex:fr, hUnits:d.hUnits*sy, wUnits:d.wUnits*sx, flash:e.flash,
                lr:LT[0], lg:LT[1], lb:LT[2] });
  }
  for(const d of decals){
    lightAt(d.x, d.y, LT);
    list.push({ x:d.x, y:d.y, tex:STUMP, hUnits:0.30, wUnits:0.45, flash:0,
                lr:LT[0], lg:LT[1], lb:LT[2] });
  }
  for(const pk of pickups){
    // ostatnie 5 s znajdźka miga — widać, że zaraz zniknie
    if(pk.life<5 && (pk.life*6|0)%2) continue;
    // znajdźki muszą zostać czytelne także w GRZYBNI, więc ich mnożnik
    // jest ściągnięty ku szarości (B5): światło je barwi, ale nie przebarwia
    lightAt(pk.x, pk.y, LT);
    list.push({ x:pk.x, y:pk.y, tex:PICKUP[pk.kind],
      hUnits:0.30, wUnits:0.30, flash:0, zoff:0.10+Math.sin(pk.t*3)*0.05,
      lr:LT[0], lg:LT[1], lb:LT[2], dim:0.35 });
  }
  // szyszki niosą WŁASNE światło (B4), więc lightAt na ich pozycji zwróciłby
  // wartość zdominowaną przez nie same i pocisk zrobiłby się biały
  for(const s of shots) list.push({ x:s.x, y:s.y, tex:CONE, hUnits:0.22, wUnits:0.18, flash:0,
                                    zoff:s.z-0.11, lr:1, lg:1, lb:1 });

  for(const s of list) s.d=(s.x-P.x)*(s.x-P.x)+(s.y-P.y)*(s.y-P.y);
  list.sort((a,b)=>b.d-a.d);
  for(const s of list) drawSprite(s);

  drawParticles();

  ctx.putImageData(img,0,0);

  drawWeapon();
  drawOverlayFX();
}

function drawSky(ang, horizon){
  let off = Math.floor(ang/(Math.PI*2)*SKY_W) % SKY_W;
  if(off<0) off+=SKY_W;
  const top = Math.max(0, Math.min(H, horizon));
  for(let y=0;y<top;y++){
    let sy = y - horizon + SKY_HZ;
    if(sy<0) sy=0; else if(sy>=SKY_H) sy=SKY_H-1;
    const srow = sy*SKY_W, drow = y*W;
    for(let x=0;x<W;x++){
      let sx = off + x; if(sx>=SKY_W) sx-=SKY_W;
      buf[drow+x] = sky.data[srow+sx];
    }
  }
}

const SEG = 8;        // co ile pikseli próbkować światło podłogi (B3)
function drawFloor(horizon){
  const rdx0=dirX-plX, rdy0=dirY-plY;
  const rdx1=dirX+plX, rdy1=dirY+plY;
  const start = Math.max(0, horizon+1);
  const posZ = 0.5*H;
  const gw=GRASS.w, gh=GRASS.h;
  for(let y=start;y<H;y++){
    const p = y-horizon;
    const rowDist = posZ/p;
    if(rowDist>MAXFOG*1.35){
      // za mgłą — jednolity kolor
      const c=(255<<24)|(FOG[2]<<16)|(FOG[1]<<8)|FOG[0];
      buf.fill(c, y*W, y*W+W);
      continue;
    }
    const stepX=rowDist*(rdx1-rdx0)/W, stepY=rowDist*(rdy1-rdy0)/W;
    let fx=P.x+rowDist*rdx0, fy=P.y+rowDist*rdy0;
    let lvl = (rowDist/MAXFOG*31)|0;
    lvl = clamp(lvl,0,31);
    const tex = GRASS.lv[lvl];
    const row=y*W;

    // B1/B3 — światło zmienia się wzdłuż wiersza, ale wiersze podłogi są spójne:
    // próbkujemy dwuliniowo co SEG pikseli i interpolujemy przyrostowo.
    // fogK: mgła musi tłumić światło, inaczej rozbłysk rozjaśnia samą mgłę.
    const fogK = 1 - lvl/31;
    lightBilinear(fx,fy,LT);
    let cr=256+(LT[0]*256-256)*fogK, cg=256+(LT[1]*256-256)*fogK,
        cb=256+(LT[2]*256-256)*fogK, dr=0, dg=0, db=0;

    for(let x=0;x<W;x++){
      if((x&(SEG-1))===0){
        // próbka na końcu następnego odcinka, przyrosty rozłożone na SEG kroków
        lightBilinear(fx+stepX*SEG, fy+stepY*SEG, LT);
        dr=((256+(LT[0]*256-256)*fogK)-cr)/SEG;
        dg=((256+(LT[1]*256-256)*fogK)-cg)/SEG;
        db=((256+(LT[2]*256-256)*fogK)-cb)/SEG;
      }
      let lr = cr|0; if(lr<0) lr=0;
      let lg = cg|0; if(lg<0) lg=0;
      let lb = cb|0; if(lb<0) lb=0;

      const tx = ((fx*gw)|0) & (gw-1);
      const ty = ((fy*gh)|0) & (gh-1);
      const c  = tex[ty*gw+tx];
      const r  = ((c     &255)*lr)>>8;
      const g  = ((c>>>8 &255)*lg)>>8;
      const b  = ((c>>>16&255)*lb)>>8;
      buf[row+x] = 0xFF000000
        | ((b>255?255:b)<<16)
        | ((g>255?255:g)<<8)
        |  (r>255?255:r);

      cr+=dr; cg+=dg; cb+=db;
      fx+=stepX; fy+=stepY;
    }
  }
}

function drawWalls(horizon){
  for(let x=0;x<W;x++){
    const camX = 2*x/W - 1;
    const rdx = dirX + plX*camX, rdy = dirY + plY*camX;
    let mapX=P.x|0, mapY=P.y|0;
    const ddx = rdx===0?1e30:Math.abs(1/rdx);
    const ddy = rdy===0?1e30:Math.abs(1/rdy);
    let stepX,stepY,sdx,sdy;
    if(rdx<0){ stepX=-1; sdx=(P.x-mapX)*ddx; } else { stepX=1; sdx=(mapX+1-P.x)*ddx; }
    if(rdy<0){ stepY=-1; sdy=(P.y-mapY)*ddy; } else { stepY=1; sdy=(mapY+1-P.y)*ddy; }
    let side=0, hit=0, guard=0;
    while(!hit && guard++<256){
      if(sdx<sdy){ sdx+=ddx; mapX+=stepX; side=0; }
      else       { sdy+=ddy; mapY+=stepY; side=1; }
      if(cell(mapX,mapY)!==0) hit=cell(mapX,mapY);
    }
    if(!hit){ zbuf[x]=1e9; continue; }
    const perp = side===0 ? (sdx-ddx) : (sdy-ddy);
    const dist = Math.max(0.05, perp);
    zbuf[x]=dist;

    const lineH = (H/dist)|0;
    let y0 = (-lineH/2 + H/2 + camShift)|0;
    let y1 = ( lineH/2 + H/2 + camShift)|0;
    const drawY0 = Math.max(0,y0), drawY1 = Math.min(H-1,y1);
    if(drawY1<drawY0) continue;

    const tex = TEX[hit];
    let wallX = side===0 ? P.y + dist*rdy : P.x + dist*rdx;
    wallX -= Math.floor(wallX);
    let tx = (wallX*tex.w)|0;
    if(side===0 && rdx>0) tx=tex.w-tx-1;
    if(side===1 && rdy<0) tx=tex.w-tx-1;

    let lvl = (dist/MAXFOG*31)|0;
    lvl = clamp(lvl,0,31);
    const t = tex.lv[lvl];

    // B1 — mnożnik światła liczony RAZ dla całej kolumny.
    // Próbkujemy komórkę PRZED ścianą (tę, w której ray był krok wcześniej):
    // komórki ścian mają w lightmapie tylko ambientMin, więc wszystkie ściany
    // wyszłyby jednakowo ciemne i cała robota z polanami poszłaby w gwizdek.
    const lcx = (side===0 ? mapX-stepX : mapX) + 0.5;
    const lcy = (side===1 ? mapY-stepY : mapY) + 0.5;
    lightAt(lcx, lcy, LT);
    const fogK = 1 - lvl/31;          // mgła tłumi światło — patrz komentarz w drawFloor
    // B7 — kierunkowe światło księżyca zastępuje `if(side===1) lvl+=4`:
    // cztery ściany słupa dostają cztery różne jasności zamiast dwóch
    const face = side===0 ? (rdx>0 ? 1 : 0) : (rdy>0 ? 3 : 2);
    const fk = faceK[face];
    let lr = (256+(LT[0]*256-256)*fogK)*fk|0; if(lr<0) lr=0;
    let lg = (256+(LT[1]*256-256)*fogK)*fk|0; if(lg<0) lg=0;
    let lb = (256+(LT[2]*256-256)*fogK)*fk|0; if(lb<0) lb=0;

    const stepT = tex.h/lineH;
    let texPos = (drawY0 - camShift - H/2 + lineH/2)*stepT;
    const tw=tex.w, th=tex.h;
    for(let y=drawY0;y<=drawY1;y++){
      const ty = ((texPos|0) & (th-1));
      texPos += stepT;
      const c = t[ty*tw+tx];
      const r = ((c     &255)*lr)>>8;
      const g = ((c>>>8 &255)*lg)>>8;
      const b = ((c>>>16&255)*lb)>>8;
      buf[y*W+x] = 0xFF000000
        | ((b>255?255:b)<<16)
        | ((g>255?255:g)<<8)
        |  (r>255?255:r);
    }
  }
}

// B10 — ciemna elipsa u podstawy sprite'a. Bez niej wszystko w raycasterze
// sprawia wrażenie lewitującego; z nią unosząca się znajdźka LEWITUJE naprawdę,
// bo jej cień zostaje na ziemi.
function contactShadow(scr, floorY, unit, wUnits, tY, str){
  const rw = (unit*wUnits*0.55)|0;
  const rh = Math.max(1, (rw*0.34)|0);
  if(rw<1) return;
  const fy=floorY|0;
  const y0=Math.max(0,fy-rh), y1=Math.min(H-1,fy+rh);
  const x0=Math.max(0,scr-rw), x1=Math.min(W-1,scr+rw);
  for(let y=y0;y<=y1;y++){
    const dy=(y-fy)/rh, dy2=dy*dy;
    const row=y*W;
    for(let x=x0;x<=x1;x++){
      if(zbuf[x] <= tY) continue;          // ściana bliżej — cień nie wychodzi za nią
      const dx=(x-scr)/rw;
      const d=dx*dx+dy2;
      if(d>=1) continue;
      const k = 256 - (str*(1-d)*256)|0;   // mnożnik < 256 = przyciemnienie
      const c = buf[row+x];
      buf[row+x] = 0xFF000000
        | ((((c>>>16&255)*k)>>8)<<16)
        | ((((c>>>8 &255)*k)>>8)<<8)
        |  (((c      &255)*k)>>8);
    }
  }
}

function drawSprite(s){
  const sx = s.x-P.x, sy = s.y-P.y;
  const invDet = 1/(plX*dirY - dirX*plY);
  const tX = invDet*(dirY*sx - dirX*sy);
  const tY = invDet*(-plY*sx + plX*sy);
  if(tY<0.12) return;
  const unit = H/tY;
  const scr = ((W/2)*(1+tX/tY))|0;
  const floorY = H/2 + camShift + unit*0.5 - (s.zoff||0)*unit;
  const sh = (unit*s.hUnits)|0;
  const sw = (unit*s.wUnits)|0;
  if(sh<1||sw<1) return;
  const y1 = floorY|0, y0 = y1-sh;
  const x0 = (scr-(sw>>1))|0, x1 = x0+sw;
  const dx0=Math.max(0,x0), dx1=Math.min(W-1,x1-1);
  if(dx1<dx0) return;
  const dy0=Math.max(0,y0), dy1=Math.min(H-1,y1-1);
  if(dy1<dy0) return;

  // B10 — cień idzie na wysokość GRUNTU, więc BEZ odejmowania zoff.
  // Siła zwiazana z rozmiarem: bliskie drzewo nie ma przykrywać pół ekranu.
  const groundY = H/2 + camShift + unit*0.5;
  contactShadow(scr, groundY, unit, s.wUnits, tY, 0.5*clamp(3/tY,0.3,1));

  let lvl = (tY/MAXFOG*(SPR_LV-1))|0;
  lvl = clamp(lvl,0,SPR_LV-1);
  const tex = s.tex, t = tex.lv[lvl];
  const tw=tex.w, th=tex.h;
  const flash = s.flash>0.02;

  // B8 — mnożnik stały dla całego sprite'a, wyliczony przy budowie listy
  const fogK = 1 - lvl/(SPR_LV-1);
  const dim  = s.dim || 1;
  let mr = 256+((s.lr*256-256)*fogK)*dim|0; if(mr<0) mr=0;
  let mg = 256+((s.lg*256-256)*fogK)*dim|0; if(mg<0) mg=0;
  let mb = 256+((s.lb*256-256)*fogK)*dim|0; if(mb<0) mb=0;

  for(let x=dx0;x<=dx1;x++){
    if(zbuf[x]<=tY) continue;
    const texX = (((x-x0)*tw/sw)|0);
    if(texX<0||texX>=tw) continue;
    for(let y=dy0;y<=dy1;y++){
      const texY = (((y-y0)*th/sh)|0);
      if(texY<0||texY>=th) continue;
      const c = t[texY*tw+texX];
      if(c===0) continue;
      if(flash){
        // Rozbłysk trafienia zostaje POZA mnożeniem: to sygnał gry, nie zjawisko
        // optyczne — gracz musi widzieć, że trafił, także w ciemnościach GRZYBNI.
        buf[y*W+x] = 0xFF000000 | (((c>>>1)&0x7F7F7F) + 0x808080);
      } else {
        const r=((c     &255)*mr)>>8;
        const g=((c>>>8 &255)*mg)>>8;
        const b=((c>>>16&255)*mb)>>8;
        buf[y*W+x] = 0xFF000000
          | ((b>255?255:b)<<16)
          | ((g>255?255:g)<<8)
          |  (r>255?255:r);
      }
    }
  }
}

function drawParticles(){
  const invDet = 1/(plX*dirY - dirX*plY);
  for(const p of parts){
    const sx=p.x-P.x, sy=p.y-P.y;
    const tX = invDet*(dirY*sx - dirX*sy);
    const tY = invDet*(-plY*sx + plX*sy);
    if(tY<0.15) continue;
    const unit=H/tY;
    const scr = ((W/2)*(1+tX/tY))|0;
    const yy  = (H/2 + camShift + unit*0.5 - p.z*unit)|0;
    const sz  = Math.max(1,(p.size*unit)|0);
    const fade = clamp(1-tY/MAXFOG,0,1);
    if(fade<=0.02) continue;
    const c=p.c;
    const r=((c&255)*fade+FOG[0]*(1-fade))|0;
    const g=(((c>>>8)&255)*fade+FOG[1]*(1-fade))|0;
    const b=(((c>>>16)&255)*fade+FOG[2]*(1-fade))|0;
    const col=(255<<24)|(b<<16)|(g<<8)|r;
    for(let x=scr;x<scr+sz;x++){
      if(x<0||x>=W) continue;
      if(zbuf[x]<=tY) continue;
      for(let y=yy;y<yy+sz;y++){
        if(y<0||y>=H) continue;
        buf[y*W+x]=col;
      }
    }
  }
}

/* ---------- broń w rękach ---------- */
function drawWeapon(){
  const bx = Math.sin(bobT)*6, by = Math.abs(Math.cos(bobT))*5;
  const kick = P.kickT*P.kickT;
  ctx.save();
  ctx.translate(W/2 + bx, H + by + kick*18 - (P.dead?-80:0));
  ctx.scale(H/270, H/270);        // rysunek broni jest w skali 480x270

  if(P.w===0){                                       // siekiera
    const sw = P.fireT>0 ? (1-P.fireT/0.32) : 0;
    const ang = -0.55 + (P.fireT>0 ? Math.sin(sw*Math.PI)*1.5 : 0);
    ctx.translate(58,-8); ctx.rotate(ang);
    ctx.fillStyle='#5a3c22'; ctx.fillRect(-6,-4,13,110);
    ctx.fillStyle='#3a2614'; ctx.fillRect(-6,-4,4,110);
    ctx.fillStyle='#9aa3ab';
    ctx.beginPath();
    ctx.moveTo(-6,0); ctx.lineTo(-44,-12); ctx.lineTo(-50,16); ctx.lineTo(-6,22);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle='#d7dde3';
    ctx.beginPath(); ctx.moveTo(-40,-11); ctx.lineTo(-50,16); ctx.lineTo(-42,17); ctx.lineTo(-34,-8);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle='#6c7178'; ctx.fillRect(-10,-2,8,22);
    ctx.fillStyle='rgba(90,170,60,.5)';
    ctx.fillRect(-38,4,6,3); ctx.fillRect(-30,12,5,3);
  } else if(P.w===1){                                // dubeltówka
    ctx.translate(0,-2);
    const rec = kick*14;
    ctx.translate(0,rec);
    // przeładowanie: broń opada i łamie się w zawiasie
    if(P.reloadT>0){
      const rt = 1 - P.reloadT/WEAPONS[1].reload;      // 0 → 1
      const swing = Math.sin(rt*Math.PI);              // w dół i z powrotem
      ctx.translate(10*swing, 30*swing);
      ctx.rotate(-0.55*swing);
      if(swing>0.55){                                  // wyrzucone łuski
        ctx.fillStyle='#c9a24a';
        ctx.fillRect(-20,-96-(swing-0.55)*70, 7, 14);
        ctx.fillRect(8, -96-(swing-0.55)*58, 7, 14);
      }
    }
    ctx.fillStyle='#2a2d31';
    ctx.fillRect(-26,-88,20,88); ctx.fillRect(2,-88,20,88);
    ctx.fillStyle='#3d4247'; ctx.fillRect(-26,-88,20,4); ctx.fillRect(2,-88,20,4);
    ctx.fillStyle='#14161a'; ctx.fillRect(-22,-86,12,84); ctx.fillRect(6,-86,12,84);
    ctx.fillStyle='#5a3c22';
    ctx.beginPath(); ctx.moveTo(-34,4); ctx.lineTo(30,4); ctx.lineTo(46,64); ctx.lineTo(-48,64);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle='#77502e'; ctx.fillRect(-30,6,58,10);
    ctx.fillStyle='#1b1d20'; ctx.fillRect(-8,-6,16,14);
    if(P.fireT>0.02){
      const f=P.fireT/0.11;
      ctx.globalAlpha=f;
      const grd=ctx.createRadialGradient(-16,-92,2,-16,-92,34);
      grd.addColorStop(0,'#fff7d0'); grd.addColorStop(.4,'#ffc44a'); grd.addColorStop(1,'rgba(255,120,20,0)');
      ctx.fillStyle=grd; ctx.beginPath(); ctx.arc(-16,-92,34,0,7); ctx.fill();
      const grd2=ctx.createRadialGradient(12,-92,2,12,-92,30);
      grd2.addColorStop(0,'#fff7d0'); grd2.addColorStop(.4,'#ffc44a'); grd2.addColorStop(1,'rgba(255,120,20,0)');
      ctx.fillStyle=grd2; ctx.beginPath(); ctx.arc(12,-92,30,0,7); ctx.fill();
      ctx.globalAlpha=1;
    }
  } else if(P.w===2){                                // kosiarka (szybkostrzelna)
    ctx.translate(4,0);
    const rec=kick*8;
    ctx.translate(Math.sin(P.fireT*90)*2, rec);
    const spin = (bobT*3 + (P.fireT>0? performance.now()/40:0));
    ctx.fillStyle='#2b2f33'; ctx.fillRect(-30,-70,60,70);
    for(let i=0;i<4;i++){
      const a=spin + i*Math.PI/2;
      const ox=Math.cos(a)*11, sc=0.6+Math.sin(a)*0.4;
      ctx.fillStyle=`rgb(${(40+sc*70)|0},${(44+sc*70)|0},${(50+sc*70)|0})`;
      ctx.fillRect(-4+ox,-104,9,44);
    }
    ctx.fillStyle='#1a1d20'; ctx.fillRect(-32,-64,64,10);
    ctx.fillStyle='#3d4247'; ctx.fillRect(-34,-58,68,8);
    ctx.fillStyle='#4a3a22'; ctx.fillRect(-14,-2,28,44);
    ctx.fillStyle='#22262a'; ctx.fillRect(-40,-46,16,34); ctx.fillRect(24,-46,16,34);
    if(P.fireT>0.01){
      ctx.globalAlpha=P.fireT/0.11;
      const grd=ctx.createRadialGradient(0,-106,2,0,-106,26);
      grd.addColorStop(0,'#fffbe0'); grd.addColorStop(.35,'#ffd45a'); grd.addColorStop(1,'rgba(255,120,20,0)');
      ctx.fillStyle=grd; ctx.beginPath(); ctx.arc(0,-106,26,0,7); ctx.fill();
      ctx.globalAlpha=1;
    }
  } else {                                           // miotacz ognia
    ctx.translate(2,0);
    ctx.translate(Math.sin(P.fireT*70)*1.5, kick*6);
    // butla przy prawej krawędzi
    ctx.fillStyle='#4a2e22'; ctx.fillRect(36,-58,30,64);
    ctx.fillStyle='#6a4030'; ctx.fillRect(36,-58,30,6);
    ctx.fillStyle='#2a1a12'; ctx.fillRect(42,-46,6,44);
    // wąż paliwowy
    ctx.strokeStyle='#3a2a20'; ctx.lineWidth=6; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(2,-8); ctx.bezierCurveTo(26,12,36,-8,46,-18); ctx.stroke();
    // lanca
    ctx.fillStyle='#2e3236'; ctx.fillRect(-14,-96,22,96);
    ctx.fillStyle='#44494e'; ctx.fillRect(-14,-96,22,5);
    ctx.fillStyle='#14161a'; ctx.fillRect(-9,-94,12,90);
    ctx.fillStyle='#5a3c22'; ctx.fillRect(-19,-16,31,20);
    // knot pilotowy — pulsuje nawet, gdy nie strzelasz
    const pil=0.5+Math.sin(performance.now()/90)*0.5;
    ctx.globalAlpha=0.45+pil*0.55;
    ctx.fillStyle='#ffd06a';
    ctx.beginPath(); ctx.ellipse(-3,-100,3,6+pil*3,0,0,7); ctx.fill();
    ctx.globalAlpha=1;
    if(P.fireT>0.004){
      const grd=ctx.createRadialGradient(-3,-116,3,-3,-126,54);
      grd.addColorStop(0,'#fff6c8'); grd.addColorStop(.22,'#ffc040');
      grd.addColorStop(.6,'rgba(255,90,20,.5)'); grd.addColorStop(1,'rgba(255,60,10,0)');
      ctx.fillStyle=grd;
      ctx.beginPath(); ctx.ellipse(-3,-126,36+Math.random()*6,56+Math.random()*8,0,0,7); ctx.fill();
    }
  }
  ctx.restore();
}

// Punkt świata → ekran (ta sama macierz co w drawSprite) — dla liczb obrażeń.
function project(x,y,z){
  const sx=x-P.x, sy=y-P.y;
  const invDet = 1/(plX*dirY - dirX*plY);
  const tX = invDet*(dirY*sx - dirX*sy);
  const tY = invDet*(-plY*sx + plX*sy);
  if(tY<0.25) return null;
  const unit=H/tY;
  return { x:((W/2)*(1+tX/tY))|0, y:(H/2 + camShift + unit*0.5 - z*unit)|0, d:tY };
}

function drawOverlayFX(){
  const k = H/270;                 // skala rysunków UI wobec bazowych 480x270

  // --- liczby obrażeń nad trafionymi drzewami ---
  if(floaters.length){
    ctx.textAlign='center';
    for(const f of floaters){
      const p=project(f.x, f.y, f.z);
      if(!p || p.x<0 || p.x>=W || p.d>MAXFOG) continue;
      if(zbuf[p.x] < p.d) continue;                    // schowane za ścianą
      const a=clamp(f.life/0.55,0,1);
      const size=Math.max(5, Math.min(13, 26/p.d))*k;
      ctx.globalAlpha=a;
      ctx.font='bold '+((size)|0)+'px "Consolas",monospace';
      ctx.fillStyle='#070d08';
      ctx.fillText(Math.round(f.v), p.x+1*k, p.y+1*k);
      ctx.fillStyle = f.v>=45 ? '#ffd24a' : '#eaf5d8';
      ctx.fillText(Math.round(f.v), p.x, p.y);
    }
    ctx.globalAlpha=1;
  }

  // celownik
  if(!P.dead){
    ctx.fillStyle='rgba(190,255,170,.75)';
    const cxp=W/2|0, cyp=(H/2+P.pitch*0.35)|0;
    const r0=Math.max(1,(3*k)|0), r1=Math.max(2,(5*k)|0), th=Math.max(1,k|0);
    ctx.fillRect(cxp-r1,cyp,r1-r0+1,th); ctx.fillRect(cxp+r0,cyp,r1-r0+1,th);
    ctx.fillRect(cxp,cyp-r1,th,r1-r0+1); ctx.fillRect(cxp,cyp+r0,th,r1-r0+1);
    ctx.fillStyle='rgba(190,255,170,.35)'; ctx.fillRect(cxp,cyp,th,th);

    // hitmarker — natychmiastowe potwierdzenie trafienia
    if(hitT>0){
      const a=hitT/0.16;
      ctx.globalAlpha=0.3+0.7*a;
      ctx.strokeStyle='#fff3c0'; ctx.lineWidth=Math.max(1,k);
      const i0=4*k, i1=9.5*k;
      for(let i=0;i<4;i++){
        const sx=(i&1)?1:-1, sy=(i&2)?1:-1;
        ctx.beginPath();
        ctx.moveTo(cxp+sx*i0, cyp+sy*i0);
        ctx.lineTo(cxp+sx*i1, cyp+sy*i1);
        ctx.stroke();
      }
      ctx.globalAlpha=1;
    }
  }
  // czerwony błysk obrażeń
  if(hurtFlash>0.01){
    ctx.fillStyle=`rgba(150,20,15,${Math.min(0.6,hurtFlash*0.5)})`;
    ctx.fillRect(0,0,W,H);
  }
  // winieta
  if(!vign) buildVignette();
  ctx.drawImage(vign,0,0);
  // wygaszenie przy przejściu do nowego lasu
  if(levelFade>0.005){
    ctx.fillStyle=`rgba(0,0,0,${Math.min(1,levelFade)})`;
    ctx.fillRect(0,0,W,H);
  }
  // niski stan zdrowia — pulsowanie
  if(P.hp<35 && !P.dead){
    const a = (Math.sin(performance.now()/180)*0.5+0.5)*0.18*(1-P.hp/35);
    ctx.fillStyle=`rgba(160,20,20,${a})`; ctx.fillRect(0,0,W,H);
  }

  // --- mnożnik serii ---
  const cm = comboMult();
  if(cm>1 && !P.dead){
    const pulse = 0.75+0.25*Math.sin(performance.now()/90);
    ctx.textAlign='center';
    ctx.globalAlpha = Math.min(1, streakT/0.5)*pulse;
    ctx.font='bold '+((12*k)|0)+'px "Consolas",monospace';
    ctx.fillStyle='#070d08'; ctx.fillText('x'+cm, W/2+1*k, H*0.27+1*k);
    ctx.fillStyle = cm>=4 ? '#ff9a3b' : cm>=3 ? '#ffd24a' : '#cfe3c4';
    ctx.fillText('x'+cm, W/2, H*0.27);
    ctx.font=((5*k)|0)+'px "Consolas",monospace';
    ctx.fillStyle='#8fb07a';
    ctx.fillText('SERIA '+streak, W/2, H*0.27+8*k);
    ctx.globalAlpha=1;
  }

  // --- strzałka do Pradrzewa, gdy jest poza kadrem ---
  if(!P.dead){
    let boss=null;
    for(const e of enemies) if(e.kind===3 && e.dying<=0){ boss=e; break; }
    if(boss){
      const da = angDiff(Math.atan2(boss.y-P.y, boss.x-P.x), P.a);
      if(Math.abs(da) > FOV_HALF*0.92){
        const side = da>0 ? 1 : -1;
        const x = side>0 ? W-7*k : 7*k, y = H/2;
        ctx.globalAlpha = 0.6+0.4*Math.sin(performance.now()/200);
        ctx.fillStyle='#ff4a32';
        ctx.beginPath();
        ctx.moveTo(x+side*5*k, y);
        ctx.lineTo(x-side*4*k, y-6*k);
        ctx.lineTo(x-side*4*k, y+6*k);
        ctx.closePath(); ctx.fill();
        ctx.globalAlpha=1;
      }
    }
  }
}
function buildVignette(){
  vign=makeCanvas(W,H); const g=vign.getContext('2d');
  const grd=g.createRadialGradient(W/2,H/2,H*0.35,W/2,H/2,H*0.85);
  grd.addColorStop(0,'rgba(0,0,0,0)'); grd.addColorStop(1,'rgba(0,0,0,.65)');
  g.fillStyle=grd; g.fillRect(0,0,W,H);
}

/* ---------- minimapa ---------- */
function drawMini(){
  const S=72, R=9;                     // promień widoczności w kratkach
  mctx.clearRect(0,0,S,S);
  mctx.fillStyle='rgba(4,10,6,.55)'; mctx.fillRect(0,0,S,S);
  const sc=S/(R*2);
  const ox=P.x, oy=P.y;
  for(let gy=Math.floor(oy-R); gy<=oy+R; gy++){
    for(let gx=Math.floor(ox-R); gx<=ox+R; gx++){
      const c=cell(gx,gy);
      if(!c) continue;
      const sx=(gx-ox+R)*sc, sy=(gy-oy+R)*sc;
      mctx.fillStyle = biome.mini[c-1] || biome.mini[0];
      mctx.fillRect(sx,sy,sc+0.6,sc+0.6);
    }
  }
  for(const d of decals){
    const sx=(d.x-ox+R)*sc, sy=(d.y-oy+R)*sc;
    if(sx<0||sy<0||sx>S||sy>S) continue;
    mctx.fillStyle='rgba(120,90,60,.7)'; mctx.fillRect(sx-1,sy-1,2,2);
  }
  for(const pk of pickups){
    const sx=(pk.x-ox+R)*sc, sy=(pk.y-oy+R)*sc;
    if(sx<0||sy<0||sx>S||sy>S) continue;
    // fiolet: żaden gatunek drzewa nie ma takiego znacznika
    mctx.fillStyle = pk.kind===0?'#7fe06a':pk.kind===3?'#b06aff':'#e0c14a';
    mctx.fillRect(sx-1.5,sy-1.5,3,3);
  }
  let widoczny=false;
  for(const e of enemies){
    if(e.dying>0) continue;
    const sx=(e.x-ox+R)*sc, sy=(e.y-oy+R)*sc;
    if(sx<0||sy<0||sx>S||sy>S) continue;
    widoczny=true;
    mctx.fillStyle = ['#ff8a3b','#ff8a3b','#5bd0ff','#ff3b3b','#ffb02e','#ff6ab0','#e8e8e8','#ff5a1e'][e.kind];
    const r = e.kind===3?3:(e.kind===4&&e.rooted)?3:2;
    mctx.fillRect(sx-r/2,sy-r/2,r,r);
  }
  // żaden wróg nie mieści się na minimapie — pokaż kierunek do najbliższego,
  // żeby ostatnie drzewa fali nie zmuszały do ślepego przeczesywania mapy
  if(!widoczny){
    let near=null, nd=1e9;
    for(const e of enemies){
      if(e.dying>0) continue;
      const d=(e.x-ox)*(e.x-ox)+(e.y-oy)*(e.y-oy);
      if(d<nd){ nd=d; near=e; }
    }
    if(near){
      const a=Math.atan2(near.y-oy, near.x-ox);
      const rad=S/2-8;
      mctx.save();
      mctx.translate(S/2+Math.cos(a)*rad, S/2+Math.sin(a)*rad);
      mctx.rotate(a);
      // dolny próg 0.44 — puls ma przyciągać wzrok, a nie gasić strzałkę
      mctx.globalAlpha = 0.72 + 0.28*Math.sin(performance.now()/220);
      mctx.fillStyle = near.kind===3 ? '#ff3b3b' : '#ffb02e';
      mctx.beginPath();
      mctx.moveTo(7,0); mctx.lineTo(-4,4.5); mctx.lineTo(-4,-4.5);
      mctx.closePath(); mctx.fill();
      mctx.restore();
    }
  }
  // gracz
  mctx.save(); mctx.translate(S/2,S/2); mctx.rotate(P.a);
  mctx.fillStyle='#dff3cf';
  mctx.beginPath(); mctx.moveTo(5,0); mctx.lineTo(-3,3); mctx.lineTo(-3,-3); mctx.closePath(); mctx.fill();
  mctx.restore();
}

/* ---------- HUD ---------- */
const el = {
  wave:document.getElementById('wave'), left:document.getElementById('left'),
  kills:document.getElementById('kills'), hpnum:document.getElementById('hpnum'),
  hpbar:document.getElementById('hpbar'), wepname:document.getElementById('wepname'),
  ammo:document.getElementById('ammo'), weplist:document.getElementById('weplist'),
  score:document.getElementById('score'), best:document.getElementById('best'),
  biome:document.getElementById('biome'),
  stambar:document.getElementById('stambar'),
  bossbar:document.getElementById('bossbar'),
  bosshp:document.getElementById('bosshp'),
};
function updateHUD(){
  el.biome.textContent = `L${level} ${biome.name}`;
  el.wave.textContent = wave||1;
  el.left.textContent = enemies.filter(e=>e.dying<=0).length + waveQueue.length;
  el.kills.textContent = kills;
  el.score.textContent = score|0;
  el.best.textContent = best.score|0;
  el.hpnum.textContent = Math.ceil(P.hp);
  el.hpbar.style.width = clamp(P.hp/P.maxhp*100,0,100)+'%';
  el.hpbar.className = P.hp<35 ? 'low' : '';
  el.stambar.style.width = clamp(P.stam/P.maxStam*100,0,100)+'%';
  el.stambar.parentNode.className = 'bar sbar' + (P.stam<0.6 ? ' out' : '');

  // pasek Pradrzewa — widoczny tylko wtedy, gdy boss żyje
  let boss=null;
  for(const e of enemies) if(e.kind===3 && e.dying<=0){ boss=e; break; }
  if(boss){
    el.bossbar.classList.remove('hide');
    el.bosshp.style.width = clamp(boss.hp/boss.maxhp*100,0,100)+'%';
  } else el.bossbar.classList.add('hide');

  const w=WEAPONS[P.w];
  el.wepname.textContent = P.w===1 && P.reloadT>0 ? 'ŁADOWANIE…' : w.name;
  el.ammo.textContent = w.ammo===-1 ? '∞'
                      : P.w===1     ? `${P.mag}/${P.shells}`
                                    : P[w.ammo]|0;
  el.weplist.innerHTML = WEAPONS.map((_,i)=>`<span class="${i===P.w?'on':''}">${i+1}</span>`).join(' ');
}

/* ---------- skalowanie okna ---------- */
function fit(){
  const app=document.getElementById('app');
  const vw=innerWidth, vh=innerHeight;
  const s = Math.max(1, Math.min(vw/W, vh/H));
  app.style.width = Math.floor(W*s)+'px';
  app.style.height= Math.floor(H*s)+'px';
  document.documentElement.style.setProperty('--s', (s*0.95).toFixed(3));
  document.body.style.display='flex';
}
addEventListener('resize',fit);
fit();

reset();
updateHUD();
showTitle();
render();
</script>
