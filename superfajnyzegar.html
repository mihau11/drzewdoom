<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gambit Clock</title>
<style>
:root{
  --bg:#0a0d12;
  --panel:#141a23;
  --panel-2:#1b222d;
  --line:#272f3b;
  --txt:#e8edf4;
  --dim:#7c8798;
  --accent:#e2a44a;
  --accent-soft:rgba(226,164,74,.14);
  --danger:#e05a4a;
  --good:#5fc08a;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Segoe UI Mono",Consolas,monospace;
  --sans:"Segoe UI",system-ui,-apple-system,Inter,Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg);color:var(--txt);font-family:var(--sans);
  display:flex;flex-direction:column;overflow:hidden;
  user-select:none;-webkit-user-select:none;
}

/* ---------- panels ---------- */
.panel{
  flex:1 1 0;min-height:0;position:relative;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:18px;
  margin:10px;
  overflow:hidden;
  transition:border-color .22s,box-shadow .22s,background .22s;
  cursor:pointer;
}
.panel.black{margin-bottom:0}
.panel.white{margin-top:0}
.panel .rot{height:100%;display:flex;flex-direction:column;padding:14px 18px}
.panel.black .rot{transform:rotate(180deg)}

.panel.active{
  background:var(--panel-2);
  border-color:rgba(226,164,74,.55);
  box-shadow:0 0 0 1px rgba(226,164,74,.18),0 18px 50px -24px rgba(226,164,74,.5);
}
.panel.idle{opacity:.62}
.panel.flag{border-color:rgba(224,90,74,.7);background:#1d1517}
.panel.low .time{color:var(--danger)}

.head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex:0 0 auto}
.name{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);font-weight:600}
.panel.active .name{color:var(--accent)}
.chip{
  font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);
  border:1px solid var(--line);border-radius:999px;padding:3px 10px;white-space:nowrap;
}
.chip b{color:var(--txt);font-weight:600}

.timewrap{flex:1 1 auto;display:flex;align-items:center;justify-content:center;min-height:0}
.time{
  font-family:var(--mono);font-variant-numeric:tabular-nums;
  font-size:clamp(46px,15vh,96px);line-height:1;font-weight:600;letter-spacing:-.02em;
  color:var(--txt);transition:color .2s;
}
.panel.idle .time{color:var(--dim)}
.flagtag{
  display:none;font-size:11px;letter-spacing:.24em;text-transform:uppercase;
  color:var(--danger);font-weight:700;text-align:center;margin-top:6px;
}
.panel.flag .flagtag{display:block}

/* ---------- roster ---------- */
.roster{flex:0 0 auto;display:flex;flex-direction:column;gap:3px;align-items:center}
.rrow{display:flex;gap:2px;justify-content:center;flex-wrap:nowrap}
.pc{
  font-size:clamp(17px,3.4vh,25px);line-height:1;
  width:1.5em;height:1.5em;display:flex;align-items:center;justify-content:center;
  border-radius:7px;cursor:pointer;position:relative;
  transition:opacity .18s,background .18s,transform .12s;
}
.pc:active{transform:scale(.88)}
.pc.king{cursor:default;opacity:.85;margin-right:7px}
.pc.king:active{transform:none}
.pc.gone{opacity:.2}
.pc.gone::after{
  content:"";position:absolute;left:14%;right:14%;top:50%;height:1.5px;
  background:var(--danger);border-radius:2px;
}
.panel.white .pc{color:#f2f5fa;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.panel.black .pc{color:#aab4c4}

/* ---------- control bar ---------- */
.bar{
  flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:8px;
  padding:9px 10px;position:relative;
}
.btn{
  background:var(--panel);border:1px solid var(--line);color:var(--dim);
  font-family:var(--sans);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  font-weight:600;padding:8px 15px;border-radius:999px;cursor:pointer;
  transition:all .16s;white-space:nowrap;
}
.btn:hover{color:var(--txt);border-color:#39434f}
.btn.on{color:var(--accent);border-color:rgba(226,164,74,.5);background:var(--accent-soft)}
.btn.warn{color:var(--danger);border-color:rgba(224,90,74,.5)}
.brand{
  position:absolute;left:14px;top:50%;transform:translateY(-50%);
  font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:#3c4654;font-weight:700;
  pointer-events:none;
}
@media (max-width:560px){.brand{display:none}}

/* ---------- popovers ---------- */
.pop{
  position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.96);
  width:min(400px,92vw);max-height:80vh;overflow:auto;
  background:var(--panel-2);border:1px solid var(--line);border-radius:16px;
  padding:20px;z-index:50;box-shadow:0 30px 80px -20px rgba(0,0,0,.85);
  opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;
}
.pop.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.scrim{position:fixed;inset:0;background:rgba(5,7,10,.66);z-index:40;opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.show{opacity:1;pointer-events:auto}
.pop h3{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:16px;font-weight:700}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid rgba(39,47,59,.6)}
.row:last-of-type{border-bottom:0}
.row label{font-size:13px;color:var(--dim)}
.row input[type=number]{
  width:76px;background:var(--panel);border:1px solid var(--line);border-radius:8px;
  color:var(--txt);font-family:var(--mono);font-size:14px;padding:7px 9px;text-align:center;
}
.row input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.pop .btn{width:100%;margin-top:16px;padding:11px}

.logline{display:flex;gap:9px;padding:7px 0;border-bottom:1px solid rgba(39,47,59,.5);font-size:12.5px;line-height:1.45}
.logline:last-child{border-bottom:0}
.logside{flex:0 0 auto;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;padding-top:3px;width:36px}
.logside.w{color:#eef2f8}.logside.b{color:var(--dim)}
.logtxt{color:var(--txt)}
.empty{color:var(--dim);font-size:13px;text-align:center;padding:18px 0}

/* ---------- event card ---------- */
.card{
  position:absolute;inset:0;z-index:20;
  background:linear-gradient(170deg,#1d2430,#141a23 65%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;padding:22px;text-align:center;
  transform:translateY(-101%);transition:transform .34s cubic-bezier(.2,.9,.25,1);
  border-radius:18px;
}
.card:not(.show){pointer-events:none}
.panel.black .card{transform:translateY(101%) rotate(180deg)}
.card.show{transform:translateY(0)}
.panel.black .card.show{transform:translateY(0) rotate(180deg)}
.card .kicker{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--accent);font-weight:700}
.card .txt{font-size:clamp(19px,3.6vh,27px);line-height:1.3;font-weight:600;max-width:30ch}
.card .sub{font-size:11.5px;color:var(--dim);letter-spacing:.04em}
.card .delta{
  font-family:var(--mono);font-size:21px;font-weight:700;
  padding:5px 14px;border-radius:999px;border:1px solid;
}
.card .delta.plus{color:var(--good);border-color:rgba(95,192,138,.45);background:rgba(95,192,138,.1)}
.card .delta.minus{color:var(--danger);border-color:rgba(224,90,74,.45);background:rgba(224,90,74,.1)}
.card .ok{
  margin-top:4px;background:var(--accent);border:0;color:#16110a;
  font-weight:700;font-size:12px;letter-spacing:.18em;text-transform:uppercase;
  padding:12px 34px;border-radius:999px;cursor:pointer;font-family:var(--sans);
}
.card .ok:active{transform:scale(.97)}
</style>
</head>
<body>

<section class="panel black" id="pB">
  <div class="rot">
    <div class="head"><span class="name">Black</span><span class="chip">Events <b id="evB">0</b></span></div>
    <div class="timewrap"><div><div class="time" id="tB">5:00</div><div class="flagtag">Flag</div></div></div>
    <div class="roster" id="rB"></div>
  </div>
  <div class="card" id="cardB">
    <div class="kicker">Black &mdash; event</div>
    <div class="delta" id="dB"></div>
    <div class="txt" id="xB"></div>
    <div class="sub" id="sB"></div>
    <button class="ok">Accept</button>
  </div>
</section>

<div class="bar">
  <span class="brand">Gambit</span>
  <button class="btn" id="btnPause">Start</button>
  <button class="btn" id="btnReset">Reset</button>
  <button class="btn" id="btnLog">Log</button>
  <button class="btn" id="btnCfg">Setup</button>
</div>

<section class="panel white" id="pW">
  <div class="rot">
    <div class="head"><span class="name">White</span><span class="chip">Events <b id="evW">0</b></span></div>
    <div class="timewrap"><div><div class="time" id="tW">5:00</div><div class="flagtag">Flag</div></div></div>
    <div class="roster" id="rW"></div>
  </div>
  <div class="card" id="cardW">
    <div class="kicker">White &mdash; event</div>
    <div class="delta" id="dW"></div>
    <div class="txt" id="xW"></div>
    <div class="sub" id="sW"></div>
    <button class="ok">Accept</button>
  </div>
</section>

<div class="scrim" id="scrim"></div>

<div class="pop" id="popCfg">
  <h3>Setup</h3>
  <div class="row"><label>Base time (minutes)</label><input type="number" id="iBase" min="1" max="180" step="1"></div>
  <div class="row"><label>Increment (seconds)</label><input type="number" id="iInc" min="0" max="60" step="1"></div>
  <div class="row"><label>Events enabled</label><input type="checkbox" id="iEv"></div>
  <div class="row"><label>First event after (moves)</label><input type="number" id="iOpen" min="0" max="60" step="1"></div>
  <div class="row"><label>Min moves between</label><input type="number" id="iMin" min="1" max="40" step="1"></div>
  <div class="row"><label>Max moves between</label><input type="number" id="iMax" min="1" max="60" step="1"></div>
  <button class="btn warn" id="btnApply">Apply &amp; new game</button>
</div>

<div class="pop" id="popLog">
  <h3>Event log</h3>
  <div id="logBody"><div class="empty">Nothing has happened yet.</div></div>
</div>

<script>
/* =======================================================================
   EVENT CATALOGUE - edit freely.
   w     : weight (higher = more frequent)
   text  : shown on the card. Tokens: {sq} {sq2} {piece} {file}
   time  : ms added to the owner's clock (negative = removed)
   opp   : ms added to the OPPONENT's clock
   swap  : true -> swap the two clocks
   mark  : true -> card reminds the player to update the roster below
   ======================================================================= */
var EVENTS = [
  /* time */
  {w:7, text:"Bonus time. Enjoy it.",                                 time:+120000},
  {w:6, text:"Time tax. Pay up.",                                     time:-60000},
  {w:4, text:"A gift of thirty seconds.",                             time:+30000},
  {w:3, text:"Your opponent is handed two extra minutes.",            opp:+120000},
  {w:2, text:"Clocks change hands. Whatever you had, they have now.", swap:true},
  {w:3, text:"Ninety seconds, straight off the top.",                 time:-90000},

  /* material */
  {w:6, text:"Lose a knight. Your choice which one.",                 mark:true,
        req:function(s,o){ return alive(s,"n") > 0; }},
  {w:6, text:"Lose a pawn. Your choice which one.",                   mark:true,
        req:function(s,o){ return alive(s,"p") > 0; }},
  {w:3, text:"Lose a bishop. Your choice which one.",                 mark:true,
        req:function(s,o){ return alive(s,"b") > 0; }},
  {w:2, text:"Lose a rook. Your choice which one.",                   mark:true,
        req:function(s,o){ return alive(s,"r") > 0; }},
  {w:5, text:"Gain a pawn - place it on any empty square of your second rank.", mark:true,
        req:function(s,o){ return alive(s,"p") < 8; }},
  {w:3, text:"Your opponent loses a {piece}. They choose which.",     mark:true,
        req:function(s,o){ return living(o).length > 0; }},
  {w:2, text:"Resurrect one captured piece onto any empty square of your own half.", mark:true,
        req:function(s,o){ return lost(s) > 0; }},
  {w:3, text:"Promote one of your pawns to a {minor}. Right now.",    mark:true,
        req:function(s,o){ return alive(s,"p") > 0 && (alive(s,"b") < 2 || alive(s,"n") < 2); }},
  {w:2, text:"Trade a knight for a pawn with your opponent.",         mark:true,
        req:function(s,o){ return alive(s,"n") > 0 && alive(o,"p") > 0; }},

  /* placement */
  {w:5, text:"Move your queen to {sq}. If she cannot get there, lose a pawn instead.", mark:true,
        req:function(s,o){ return alive(s,"q") > 0; }},
  {w:4, text:"Put a knight on {sq}. Anything standing there is removed.", mark:true,
        req:function(s,o){ return alive(s,"n") > 0; }},
  {w:4, text:"Teleport any one of your pieces to {sq}, if it is empty."},
  {w:3, text:"Your king steps to any adjacent empty square. Castling rights survive."},
  {w:3, text:"Swap the places of two of your own pieces.",
        req:function(s,o){ return living(s).length > 0; }},
  {w:3, text:"Every pawn on the {file}-file is removed from the board.", mark:true,
        req:function(s,o){ return alive(s,"p") > 0 || alive(o,"p") > 0; }},

  /* tempo */
  {w:4, text:"Skip your move. Press the clock and hand it straight over."},
  {w:3, text:"Your next move must be a pawn move, if one is legal.",
        req:function(s,o){ return alive(s,"p") > 0; }},
  {w:3, text:"Your next move must be a capture, if one is legal.",
        req:function(s,o){ return living(o).length > 0; }},
  {w:3, text:"Your next move must be made within ten seconds."},
  {w:2, text:"You may take back your opponent's last move."}
];

/* the last resort, if the board state rules everything else out */
var FALLBACK = {w:1, text:"Nothing happens. Breathe, and play on."};

/* ----------------------------------------------------------------- */
function $(id){ return document.getElementById(id); }
var GLYPH = {
  w:{k:"♔",q:"♕",r:"♖",b:"♗",n:"♘",p:"♙"},
  b:{k:"♚",q:"♛",r:"♜",b:"♝",n:"♞",p:"♟"}
};
var ROW1 = ["k","q","r","r","b","b","n","n"];
var ROW2 = ["p","p","p","p","p","p","p","p"];
var FILES = ["a","b","c","d","e","f","g","h"];
var PIECE_WORDS = ["knight","bishop","rook","pawn"];

var CFG_KEY = "gambitclock.cfg";
/* v is the shape of this config, not a setting. Bumping it retires a
   stored config from an older build, so new defaults actually arrive
   instead of being overwritten by whatever was saved last time.      */
var cfg = {v:2, base:5, inc:0, minGap:8, maxGap:16, opening:10, events:true};
try { var saved = JSON.parse(localStorage.getItem(CFG_KEY) || "{}");
      if (saved.v === cfg.v) for (var k in saved) if (k in cfg) cfg[k] = saved[k]; } catch(e){}

var S, raf = null, beat = null, resetArmed = false, resetTimer = null;

function rnd(a,b){ return a + Math.floor(Math.random()*(b-a+1)); }
function other(s){ return s === "w" ? "b" : "w"; }
function sq(){ return FILES[rnd(0,7)] + rnd(1,8); }

function blank(){ var a=[],i; for(i=0;i<16;i++) a.push(false); return a; }

/* ---------- what is still on the board, per the rosters ----------
   The rosters are the app's only picture of the position, so events ask
   them before they fire: no "lose a knight" with no knights left, no
   "promote to a bishop" when you already have both of yours.            */
var TYPES = ROW1.concat(ROW2);
var WORD = {k:"king", q:"queen", r:"rook", b:"bishop", n:"knight", p:"pawn"};

function alive(side, t){
  var n = 0, i;
  for (i=0;i<16;i++) if (TYPES[i] === t && !S[side].gone[i]) n++;
  return n;
}
/* distinct capturable types still standing (king excluded) */
function living(side){
  var out = [], i, t;
  for (i=0;i<16;i++){
    t = TYPES[i];
    if (t !== "k" && !S[side].gone[i] && out.indexOf(t) < 0) out.push(t);
  }
  return out;
}
function lost(side){
  var n = 0, i;
  for (i=0;i<16;i++) if (S[side].gone[i]) n++;
  return n;
}

function newGame(){
  var ms = cfg.base*60000;
  S = {
    w:{ms:ms, ev:0, gone:blank()},
    b:{ms:ms, ev:0, gone:blank()},
    turn:null, running:false, since:null, flagged:null,
    moveCount:0, pending:null, log:[],
    nextOwner:null, nextAt:0
  };
  S.nextOwner = Math.random() < .5 ? "w" : "b";
  /* opening grace period: nothing fires before move cfg.opening */
  S.nextAt = cfg.opening + rnd(0, cfg.maxGap - cfg.minGap);
  hideCard("w"); hideCard("b");
  $("btnPause").textContent = "Start";
  $("btnPause").classList.remove("on");
  renderRoster("w"); renderRoster("b"); renderLog();
  draw();
}

/* ---------- roster ---------- */
function renderRoster(side){
  var host = $(side === "w" ? "rW" : "rB");
  host.innerHTML = "";
  [ROW1, ROW2].forEach(function(row, ri){
    var el = document.createElement("div");
    el.className = "rrow";
    row.forEach(function(t, ci){
      var i = ri*8 + ci;
      var p = document.createElement("div");
      var isKing = (t === "k");
      p.className = "pc" + (S[side].gone[i] ? " gone" : "") + (isKing ? " king" : "");
      p.textContent = GLYPH[side][t];
      /* the king never leaves the board - losing him ends the game, not a roster tap */
      p.addEventListener("click", function(ev){
        ev.stopPropagation();
        if (isKing) return;
        S[side].gone[i] = !S[side].gone[i];
        p.classList.toggle("gone", S[side].gone[i]);
      });
      el.appendChild(p);
    });
    host.appendChild(el);
  });
  host.oncontextmenu = function(ev){
    ev.preventDefault(); ev.stopPropagation();
    S[side].gone = blank();
    renderRoster(side);
  };
}

/* ---------- clock ---------- */
function fmt(ms){
  if (ms < 0) ms = 0;
  var t = Math.ceil(ms/100)/10;
  var m = Math.floor(t/60);
  var s = t - m*60;
  if (ms < 20000) return m + ":" + (s < 10 ? "0" : "") + s.toFixed(1);
  var ss = String(Math.floor(s));
  if (ss.length < 2) ss = "0" + ss;
  return m + ":" + ss;
}

/* Time is read from the clock of the world, never counted up frame by
   frame: a backgrounded tab gets no animation frames, and a clock that
   quietly stops while you look away is not a clock. S[side].ms is the
   time as it stood at S.since; what has run since is worked out on
   demand, so the reading is right however long the frames were absent. */
function left(side){
  if (S.running && S.since !== null && S.turn === side)
    return Math.max(0, S[side].ms - (performance.now() - S.since));
  return S[side].ms;
}
/* settle the elapsed time into the store before anything touches it */
function fold(){
  if (S.running && S.since !== null){
    var t = S.turn;
    S[t].ms = Math.max(0, S[t].ms - (performance.now() - S.since));
    S.since = performance.now();
  }
}
function stopTimers(){
  if (raf){ cancelAnimationFrame(raf); raf = null; }
  if (beat){ clearInterval(beat); beat = null; }
}

function draw(){
  ["w","b"].forEach(function(side){
    var P = $(side === "w" ? "pW" : "pB"), ms = left(side);
    $(side === "w" ? "tW" : "tB").textContent = fmt(ms);
    $(side === "w" ? "evW" : "evB").textContent = S[side].ev;
    P.classList.toggle("active", S.turn === side && !S.flagged);
    P.classList.toggle("idle",  S.turn !== side && S.turn !== null && !S.flagged);
    P.classList.toggle("low",   ms < 20000);
    P.classList.toggle("flag",  S.flagged === side);
  });
}

function tick(){
  if (!S.running){ stopTimers(); return; }
  var t = S.turn;
  if (left(t) <= 0){
    S[t].ms = 0; S.running = false; S.since = null; stopTimers();
    S.flagged = t;
    $("btnPause").textContent = "Start";
    $("btnPause").classList.remove("on");
    draw();
    return;
  }
  draw();
  raf = requestAnimationFrame(tick);
}

function run(on){
  fold();
  var want = !!on && !S.flagged && !S.pending && S.turn !== null;
  if (want && !S.running) S.since = performance.now();
  if (!want) S.since = null;
  S.running = want;
  $("btnPause").textContent = S.running ? "Pause" : "Start";
  $("btnPause").classList.toggle("on", S.running);
  stopTimers();
  if (S.running){
    raf = requestAnimationFrame(tick);   /* smooth while the page is watched */
    beat = setInterval(tick, 250);       /* and still true while it is not */
  }
  draw();
}
document.addEventListener("visibilitychange", function(){ if (S.running) tick(); });

/* ---------- the press ---------- */
function press(side){
  if (S.flagged || S.pending) return;
  if (S.turn === null){            /* first press starts the opponent's clock */
    S.turn = other(side);
    run(true);
    return;
  }
  if (S.turn !== side) return;     /* not your clock to press */
  fold();                          /* settle what this move cost you */
  S.running = false; S.since = null; stopTimers();
  S[side].ms += cfg.inc*1000;
  S.moveCount++;
  S.turn = other(side);
  draw();
  if (cfg.events && S.moveCount >= S.nextAt && S.turn === S.nextOwner){
    fire(S.turn);
  } else {
    run(true);
  }
}

/* ---------- events ---------- */
/* only events the position actually allows */
function pick(side){
  var opp = other(side), pool = [], total = 0, i, e;
  for (i=0;i<EVENTS.length;i++){
    e = EVENTS[i];
    if (e.req && !e.req(side, opp)) continue;
    pool.push(e); total += e.w;
  }
  if (!pool.length) return FALLBACK;
  var r = Math.random()*total;
  for (i=0;i<pool.length;i++){ r -= pool[i].w; if (r <= 0) return pool[i]; }
  return pool[pool.length-1];
}

function fill(text, side){
  var opp = other(side);
  /* {piece} names something the OPPONENT still has; {minor} a minor piece
     the owner is actually short of */
  var theirs = living(opp);
  var missing = [];
  if (alive(side,"b") < 2) missing.push("bishop");
  if (alive(side,"n") < 2) missing.push("knight");
  return text
    .replace("{sq2}", sq())
    .replace("{sq}", sq())
    .replace("{piece}", theirs.length ? WORD[theirs[rnd(0, theirs.length-1)]] : "pawn")
    .replace("{minor}", missing.length ? missing[rnd(0, missing.length-1)] : "knight")
    .replace("{file}", FILES[rnd(0,7)]);
}

function fire(side){
  var e = pick(side);
  var text = fill(e.text, side);
  var delta = 0;

  if (e.swap){ var t = S.w.ms; S.w.ms = S.b.ms; S.b.ms = t; }
  if (e.time){ S[side].ms = Math.max(0, S[side].ms + e.time); delta = e.time; }
  if (e.opp){ S[other(side)].ms = Math.max(0, S[other(side)].ms + e.opp); }

  S[side].ev++;
  S.log.unshift({side:side, text:text});
  S.nextOwner = other(S.nextOwner);
  S.nextAt = S.moveCount + rnd(cfg.minGap, cfg.maxGap);
  S.pending = side;

  run(false);

  var U = side === "w" ? "W" : "B";
  $("x"+U).textContent = text;
  $("s"+U).textContent = e.mark ? "Adjust the board, then tap the piece below." : "";
  var d = $("d"+U);
  if (delta){
    d.style.display = "";
    d.textContent = (delta > 0 ? "+" : "−") + fmt(Math.abs(delta)).replace(/\.\d$/,"");
    d.className = "delta " + (delta > 0 ? "plus" : "minus");
  } else if (e.swap){
    d.style.display = ""; d.textContent = "⇅"; d.className = "delta plus";
  } else {
    d.style.display = "none";
  }
  $("card"+U).classList.add("show");
  renderLog();
  draw();
}

function hideCard(side){
  $("card" + (side === "w" ? "W" : "B")).classList.remove("show");
}

function accept(side){
  hideCard(side);
  S.pending = null;
  run(true);
}

function renderLog(){
  var host = $("logBody");
  if (!S.log.length){ host.innerHTML = '<div class="empty">Nothing has happened yet.</div>'; return; }
  host.innerHTML = S.log.map(function(l){
    return '<div class="logline"><span class="logside ' + l.side + '">' +
      (l.side === "w" ? "White" : "Black") + '</span><span class="logtxt"></span></div>';
  }).join("");
  var nodes = host.querySelectorAll(".logtxt");
  for (var i=0;i<nodes.length;i++) nodes[i].textContent = S.log[i].text;
}

/* ---------- wiring ---------- */
$("pW").addEventListener("click", function(){ press("w"); });
$("pB").addEventListener("click", function(){ press("b"); });
["cardW","cardB"].forEach(function(id){
  var c = $(id);
  c.addEventListener("click", function(ev){ ev.stopPropagation(); });
  c.querySelector(".ok").addEventListener("click", function(){ accept(id === "cardW" ? "w" : "b"); });
});

$("btnPause").addEventListener("click", function(){
  if (S.flagged || S.pending) return;
  if (S.turn === null) S.turn = "w";
  run(!S.running);
});

$("btnReset").addEventListener("click", function(){
  if (resetArmed){
    clearTimeout(resetTimer); resetArmed = false;
    $("btnReset").textContent = "Reset"; $("btnReset").classList.remove("warn");
    stopTimers();
    newGame();
    return;
  }
  resetArmed = true;
  $("btnReset").textContent = "Sure?"; $("btnReset").classList.add("warn");
  resetTimer = setTimeout(function(){
    resetArmed = false;
    $("btnReset").textContent = "Reset"; $("btnReset").classList.remove("warn");
  }, 2200);
});

function openPop(p){ $("scrim").classList.add("show"); p.classList.add("show"); }
function closePops(){
  $("scrim").classList.remove("show");
  $("popCfg").classList.remove("show");
  $("popLog").classList.remove("show");
}
$("scrim").addEventListener("click", closePops);
$("btnLog").addEventListener("click", function(){ renderLog(); openPop($("popLog")); });
$("btnCfg").addEventListener("click", function(){
  $("iBase").value = cfg.base; $("iInc").value = cfg.inc;
  $("iEv").checked = cfg.events; $("iMin").value = cfg.minGap; $("iMax").value = cfg.maxGap;
  $("iOpen").value = cfg.opening;
  openPop($("popCfg"));
});
$("btnApply").addEventListener("click", function(){
  function n(el, lo, hi, d){
    var v = parseInt($(el).value, 10);
    return isNaN(v) ? d : Math.min(hi, Math.max(lo, v));
  }
  cfg.base = n("iBase",1,180,5);
  cfg.inc  = n("iInc",0,60,0);
  cfg.minGap = n("iMin",1,40,8);
  cfg.maxGap = Math.max(cfg.minGap, n("iMax",1,60,16));
  cfg.opening = n("iOpen",0,60,10);
  cfg.events = $("iEv").checked;
  try { localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); } catch(e){}
  closePops();
  stopTimers();
  newGame();
});

document.addEventListener("keydown", function(ev){
  if (ev.code === "Space"){ ev.preventDefault(); $("btnPause").click(); }
  if (ev.key === "Escape") closePops();
});

newGame();
</script>
